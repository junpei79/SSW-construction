hines), はさまれ・巻き込まれ (caught in), 有害物との接触, 感電, 火災, 交通事故(道路), おぼれ.</p><p><b>Prevent falls:</b> use the full harness; fit 中さん and 下さん on scaffolds; use only marked routes; net openings. <b>Collapse:</b> firm base plate, tight wall ties, remove sheets in strong wind. <b>Machines:</b> keep clear of swinging buckets, use guides, wide safe routes, never use a machine for the wrong purpose. <b>Falling objects:</b> never stand under a lifted load (玉掛け must be correct). <b>Ladders:</b> never stand on the top, never straddle, never carry loads with both hands. <b>Roads:</b> speed and commute accidents.</p><p>The textbook describes a 5 m threshold for the construction context it discusses. Current legal requirements depend on the work and applicable rules; use the site risk assessment and current official requirements rather than applying one height universally.</p>`,s:{jp:`吊{つ}り荷{に}の下{した}に入{はい}ってはいけません。`,ro:`Tsurini no shita ni haitte wa ikemasen.`,en:`You must not go under a lifted load.`,p:[[`吊り荷の下に`,`under the lifted load`],[`入って`,`enter`],[`はいけません`,`must not`]]},p:`Teaching example: a crane lifts steel; you stand outside the marked area and keep your eyes on the guide's signal.`,m:`Big three: fall, machine/crane, collapse. Under a load = never.`,u:`Falls are the top killer. Harness above 5 m. Never under a load, never glove + blade.`},{c:6,t:`Chapter 7 (2): safety cycle, new-entrant training, gear and human error (Textbook 7.2)`,jp:`安全活動{あんぜんかつどう}とヒューマンエラー`,o:[`Order the daily safety cycle`,`Know the new-entrant training rule and 8 contents`,`Remember heat measures and the 12 human errors`],x:`<p><b>Daily 安全施工サイクル (8 steps):</b> 1 safety morning meeting → 2 safety meeting (KY) → 3 pre-work check → 4 guidance during work → 5 safety patrol → 6 safety planning meeting for tomorrow → 7 tidy-up → 8 end-of-day safety check.</p><p><b>新入者安全衛生教育:</b> when an employer hires a new worker (machine and material dangers, safety devices, work steps, start checks, illness prevention, tidiness, first aid and evacuation). <b>新規入場者教育:</b> nearly half of site deaths happen in the first week, so it is required before first work: danger zones, no-entry areas, evacuation, chain of command and rules. About 30 minutes in the site office.</p><p><b>Gear:</b> full harness, helmet, hook, safety shoes; 保護メガネ, 保護マスク, gloves (not with rotating blades), shield helmet for welding.</p><p><b>Heat:</b> hot days over 30°C (真夏日) and 35°C (猛暑日). Rest in cool places, drink water and salt, wear breathable clothes. <b>緑十字</b> is the safety symbol.</p><p><b>12 human errors:</b> assumption, carelessness, drop in attention, lack of experience, shortcuts from habit, group fault, omission, poor communication, instinct, panic, aging, fatigue.</p>`,s:{jp:`新規入場者{しんきにゅうじょうしゃ}は、作業{さぎょう}の前{まえ}に教育{きょういく}を受{う}けます。`,ro:`Shinki nyuujousha wa, sagyou no mae ni kyouiku wo ukemasu.`,en:`New entrants receive training before work.`,p:[[`新規入場者は`,`new entrants (topic)`],[`作業の前に`,`before work`],[`教育を受けます`,`receive training`]]},p:`Teaching example: on day one you are shown the no-entry areas, evacuation route and who gives orders.`,m:`Cycle: morning meeting → KY → check → guide → patrol → plan → tidy → end check.`,u:`The safety cycle runs every day. New entrants need training before work. Know the 12 human errors.`}
];

const EXTRA_L=[
{c:4,t:`Chapter 5 supplement A: cranes, lifting and scaffold components (Textbook 5.1.1-5.1.3)`,jp:`クレーン・足場・鉄骨`,o:[`Distinguish tower, rough-terrain and crawler cranes`,`Identify scaffold components and their functions`,`Recognise steel erection tools and safe lifting basics`],x:`<h3>1. Cranes and construction machinery</h3><p><b>クレーン</b> lifts and moves loads. The textbook illustrates three types: <b>タワークレーン</b> is fixed/tall and used on high-rise projects; <b>ラフタークレーン</b> is a mobile rough-terrain crane on rubber tyres, useful on uneven site ground; <b>クローラクレーン</b> travels on crawler tracks and is used for heavy lifts. An <b>油圧ショベル</b> excavates soil; do not use an excavator to lift loads unless the machine and operation are specifically approved for that purpose.</p><h3>2. Scaffold parts and tools</h3><p><b>くさび緊結式足場</b>, <b>枠組足場</b> and <b>単管足場</b> are assembled from different systems. Learn the component names: <b>建地</b> (vertical standard), <b>腕木</b> (horizontal support), <b>筋交</b> (diagonal brace), <b>足場板</b> (platform board), <b>布</b> (horizontal member/ledger), <b>壁つなぎ</b> (tie to the building). <b>番線</b> is binding wire; a <b>シノ</b> is used to twist/tighten it. Never remove braces, ties or boards without authorisation.</p><h3>3. Steel erection</h3><p>Steel members are lifted, positioned and joined using bolts or welding according to the erection plan. <b>ボルシン</b> helps align bolt holes. Correct bolt tightening, temporary stability, exclusion zones and signals are essential. Never stand below a suspended member; follow the designated signal person and lifting plan.</p><p class=n>Textbook basis: Chapter 5, sections 5.1.1-5.1.3 (PDF pp.63-65). Explanations simplify the equipment descriptions; use manufacturer instructions and site training.</p>`,s:{jp:`吊{つ}り荷{に}の下{した}に入{はい}ってはいけません。`,ro:`Tsurini no shita ni haitte wa ikemasen.`,en:`You must not enter beneath a suspended load.`,p:[[`吊り荷{つりに}の下{した}に`,`under a suspended load`],[`入{はい}ってはいけません`,`must not enter`]]},p:`Point to a crane in a site photo and identify whether it is a tower, rough-terrain or crawler crane. Then name the scaffold standard, brace, platform and building tie.`,m:`Tower = high-rise; rough-terrain = rubber tyres; crawler = tracks. Scaffold: vertical standard + horizontal members + diagonal brace + platform + building ties.`,u:`You can identify the three crane types, main scaffold components and steel erection alignment tool.`},
{c:4,t:`Chapter 5 supplement B: reinforcement, formwork and concrete tools (Textbook 5.1.4-5.1.9)`,jp:`鉄筋・型枠・コンクリートの工具`,o:[`Identify rebar spacers, tying tools and joining equipment`,`Understand formwork ties, panels and props`,`Match concrete pumping and testing equipment to its job`],x:`<h3>1. Reinforcing-bar work</h3><p><b>スペーサー</b> maintains the specified position and concrete cover. The PDF shows different forms, including <b>ドーナツ</b> spacers for columns and <b>キャラメル</b> spacers for floor reinforcement. <b>結束線</b> ties bars; a <b>ハッカー</b> twists the wire. The bars must be positioned to the drawings; spacers do not replace inspection of cover and spacing.</p><h3>2. Rebar joining</h3><p>Reinforcing bars may be joined by mechanical couplers, gas-pressure welding (圧接) or welding, as specified. Equipment in the textbook includes the <b>加圧器</b>, <b>圧接器</b>, <b>ラムシリンダー</b>, electric heating equipment and a <b>バーナー</b>. After joining, the work is inspected visually and, where required, by ultrasonic testing. Do not assume every joint uses the same method.</p><h3>3. Welding and formwork</h3><p>Welding equipment includes a welding machine, electrode/rod and a <b>シールド面</b> (welding face shield). Formwork is the mould for concrete. <b>せき板</b> forms the concrete face; panels and timber members support it. <b>セパレーター</b> and <b>フォームタイ</b> hold opposite form faces at the required spacing; <b>パイプサポート</b> supports horizontal formwork. Never remove props before the authorised stripping time.</p><h3>4. Concrete pumping</h3><p><b>アジテータ車</b> transports ready-mixed concrete while keeping it moving. A <b>コンクリートポンプ</b> pushes concrete through a delivery pipe; the <b>ホッパ</b> receives concrete. <b>スランプコーン</b> checks slump/workability, not compressive strength. Cement and aggregate are ingredients; follow the mix specification and delivery ticket.</p><p class=n>Textbook basis: Chapter 5, sections 5.1.4-5.1.9 (PDF pp.65-70).</p>`,s:{jp:`スペーサーでかぶり厚{あつ}さを確保{かくほ}します。`,ro:`Supeesaa de kaburi atsusa wo kakuho shimasu.`,en:`Spacers help maintain the concrete cover.`,p:[[`スペーサーで`,`with a spacer`],[`かぶり厚さを`,`concrete cover thickness`],[`確保します`,`secure / maintain`]]},p:`Sort the items by task: tie rebar (結束線・ハッカー), maintain cover (スペーサー), hold forms (セパレーター・フォームタイ), support forms (パイプサポート), pump concrete (ポンプ), test slump (スランプコーン).`,m:`Slump = workability/consistency; strength is checked by other tests. A spacer maintains position/cover; it does not join bars.`,u:`You can explain the purpose of the main reinforcement, formwork, welding and concrete tools.`},
{c:4,t:`Chapter 5 supplement C: finishing-trade tools and materials (Textbook 5.2.1-5.2.12)`,jp:`仕上げ工事の工具`,o:[`Match plastering and painting tools to their use`,`Recognise roofing, sheet-metal, tile and interior tools`,`Identify waterproofing and stone-working tools`],x:`<h3>1. Plastering and painting</h3><p><b>こて</b> spreads mortar, plaster and other finishes. The PDF distinguishes <b>仕上げごて</b>, <b>中塗りごて</b>, <b>柳刃ごて</b> for narrow/detail work, <b>目地ごて</b> for tile/brick joints and <b>こて板</b> for holding material. Painting uses <b>はけ</b> for edges and small areas, <b>ウールローラー</b> for broad surfaces, and <b>マスキングテープ</b> to protect areas not to be painted. <b>パテ</b> fills small holes and unevenness before finishing.</p><h3>2. Roof, sheet metal and tile</h3><p>Roofing materials include <b>瓦</b> and metal sheets. Sheet-metal work cuts, bends and fixes thin metal; <b>溶融亜鉛めっき</b> is a corrosion-protection coating. Tile work uses a <b>タイルカッター</b> to cut tile and a <b>打診棒</b> to tap/check for hollow-sounding areas. Do not confuse a tile cutter with a grinder; use the correct tool and dust protection.</p><h3>3. Interior, fittings and waterproofing</h3><p><b>スタッド</b> and <b>ランナー</b> form light-gauge steel wall framing. A <b>コンパス</b> marks circles/arcs; a <b>ディバイダ</b> transfers distances. Flooring tools include a hot-air/welding tool for certain sheet joints and an <b>おさえハケ</b> for smoothing wall coverings. <b>シーリングガン</b> dispenses sealant into joints; <b>トーチバーナー</b> is used in some asphalt-sheet waterproofing methods and requires strict fire controls. <b>タッカー</b> fixes sheets/fabric with staples. Stone work uses a block hammer, こやすけ and せっとう.</p><p class=n>Textbook basis: Chapter 5, sections 5.2.1-5.2.12 (PDF pp.71-76).</p>`,s:{jp:`目地{めじ}ごてでタイルの目地{めじ}を仕上{しあ}げます。`,ro:`Meji kote de tairu no meji wo shiagemasu.`,en:`Finish tile joints with a jointing trowel.`,p:[[`目地ごてで`,`with a jointing trowel`],[`タイルの目地を`,`tile joints`],[`仕上げます`,`finish`]]},p:`For each trade, name the surface and tool: plaster = trowel; paint = brush/roller; tile = cutter/tapping rod; interior framing = stud/runner; sealant = gun; asphalt sheet = torch burner with fire precautions.`,m:`Tool names often describe shape or job: 目地 = joint; こて = trowel; はけ = brush; タッカー = stapler.`,u:`You can identify the tools and materials used by plasterers, painters, roofers, tilers, interior finishers, waterproofers and stone workers.`},
{c:4,t:`Chapter 5 supplement D: common site tools, measuring, lifting and cleaning (Textbook 5.3.1-5.3.15)`,jp:`共通工具・測量・運搬`,o:[`Recognise power tools, digging and cutting tools`,`Choose the correct measuring instrument`,`Identify lifting, access-platform and cleaning equipment`],x:`<h3>1. Power and ground tools</h3><p><b>ドリルドライバー</b> drills holes and drives screws; <b>インパクトドライバー</b> drives screws/bolts with impact action; <b>ディスクグラインダー</b> grinds/cuts with an abrasive disc; <b>丸のこ</b> cuts boards. For digging, the PDF shows <b>剣スコップ</b> (pointed shovel), <b>角スコップ</b> (square shovel) and <b>ランマー</b> (tamping rammer for compaction). Choose the correct tool and inspect it before use.</p><h3>2. Marking and measuring</h3><p><b>墨つぼ</b> snaps a straight reference line; a <b>レーザー墨出し器</b> projects reference lines. <b>レベル</b> and <b>レーザーレベル</b> are used for height/level surveying; <b>トランシット</b> measures angles; <b>水平器</b> checks level; <b>下げ振り</b> checks vertical; <b>メジャー</b> and <b>コンベックス</b> measure length; a straightedge checks straightness. Do not confuse horizontal (水平) with vertical (垂直).</p><h3>3. Cut, strike, fasten and mix</h3><p>The chapter groups tools by action: cut (nippers, cutter, pliers), strike/pull (hammer, crowbar), grind/polish (whetstone, wire brush), tighten/fix (adjustable wrench, hex key, screwdriver), mix (concrete/mortar mixer and mixing box). Select the correct size and keep tools in good condition.</p><h3>4. Protect, clean, move and lift</h3><p><b>養生</b> protects finished work from dust, impact, water or paint. Cleaning tools include broom, dustpan, cloth, bucket and ladle. A trolley and forklift move materials; a winch, wire rope and chain block lift/pull loads; a jack raises equipment. Access equipment includes a stepladder, portable work platform and aerial work vehicle. Inspect equipment and obey load limits; never stand under a suspended load or use damaged lifting gear.</p><p class=n>Textbook basis: Chapter 5, sections 5.3.1-5.3.15 (PDF pp.76-84).</p>`,s:{jp:`下{さ}げ振{ふ}りで垂直{すいちょく}を確認{かくにん}します。`,ro:`Sagefuri de suichoku wo kakunin shimasu.`,en:`Check vertical alignment with a plumb bob.`,p:[[`下げ振りで`,`with a plumb bob`],[`垂直を`,`vertical alignment`],[`確認します`,`check`]]},p:`Choose the instrument from the requirement: straight line = ink line/laser; height = level; angle = transit; horizontal = spirit level; vertical = plumb bob; length = tape measure.`,m:`水平 = horizontal; 垂直 = vertical. 養生 is protection, not merely cleaning.`,u:`You can match common tools to digging, marking, measuring, cutting, lifting, access and cleaning tasks.`},
{c:5,t:`Chapter 6 supplement A: construction features, planning and site management (Textbook 6.1.1-6.1.5)`,jp:`施工計画と施工管理`,o:[`Explain the five characteristics of construction work`,`Understand the inputs to a construction plan`,`Explain QCDSE and setting-out before work`],x:`<h3>1. Five characteristics of construction</h3><ol><li><b>受注一品生産</b>: each project is made to order and differs by client/design.</li><li><b>土地に定着</b>: the completed structure is fixed to a particular site.</li><li><b>自然条件の影響</b>: weather, seasons, ground and surroundings affect work.</li><li><b>社会的制約</b>: laws, neighbours, traffic, noise and local conditions constrain methods.</li><li><b>品質は安全工程でつくる</b>: quality is created through safe, controlled processes, not added only at the end.</li></ol><h3>2. Construction planning</h3><p><b>施工計画</b> is prepared from the construction contract, drawings, specifications and site information. Consider applicable laws and constraints, quality, budget, schedule, safety and environmental protection together. The plan should specify work methods, sequence, people, materials, machinery, temporary works, inspections, emergency response and coordination with other trades. If drawings conflict or information is unclear, stop and ask the responsible supervisor; do not guess.</p><h3>3. 5M and QCDSE</h3><p><b>5M</b> is a planning checklist: Men (人), Materials (材料), Methods (方法), Machinery (機械), Money (資金). <b>QCDSE</b> is the management objective: Quality (品質), Cost (原価), Delivery/schedule (工程), Safety (安全), Environment (環境). The letters are a memory aid; actual site plans must follow the contract and legal requirements.</p><h3>4. Before starting work</h3><p>Confirm the latest drawings and specifications, work area and boundaries, sequence, hazards, nearby trades, permits/qualifications, tools and machinery, weather, access, material storage, emergency routes and communication method. Conduct <b>始業前点検</b> on tools and equipment. <b>墨出し</b> transfers reference positions, axes and levels from drawings to the site; accuracy at this stage prevents downstream rework.</p><p class=n>Textbook basis: Chapter 6, sections 6.1.1-6.1.5 (PDF pp.85-87).</p>`,s:{jp:`図面{ずめん}と仕様書{しようしょ}を確認{かくにん}してから作業{さぎょう}します。`,ro:`Zumen to shiyousho wo kakunin shite kara sagyou shimasu.`,en:`Work only after checking the drawings and specifications.`,p:[[`図面と仕様書を`,`drawings and specifications`],[`確認してから`,`after checking`],[`作業します`,`carry out the work`]]},p:`Before a task, answer five questions: what quality is required, what is the budget, when is it due, what are the hazards, and what environmental controls apply?`,m:`5M = inputs/resources. QCDSE = what management controls. Keep them separate.`,u:`You can explain the five construction characteristics, the planning documents, 5M, QCDSE and the pre-start checklist.`},
{c:5,t:`Chapter 6 supplement B: specialist work sequences from scaffold to concrete (Textbook 6.2.1-6.2.9)`,jp:`専門工事の施工手順（躯体）`,o:[`Describe safe scaffold and steel-work sequences`,`Understand reinforcement, rebar joints and welding checks`,`Follow formwork and concrete-pumping stages`],x:`<h3>1. Scaffolding and steel work</h3><p>Scaffold work starts with checking the ground and base, then assembling standards (建地), horizontal members, braces, platforms, stairs/ladder access and building ties in the specified sequence. Inspect stability, guardrails, toe boards and access before use. Steel work checks foundations/anchor bolts, lifts members using a planned method, temporarily braces them, aligns and bolts/welds connections, then inspects the completed frame. Temporary stability is essential before the frame is fully connected.</p><h3>2. Reinforcement and joints</h3><p>Rebar work includes foundation, slab, wall, beam and column reinforcement. Workers check bar type/diameter, spacing (ピッチ), lap/anchorage, openings and concrete cover (かぶり厚さ). Spacers maintain cover. Column main bars are held by hoop/tie bars (フープ筋). Joining methods include mechanical joints, gas-pressure welding and other specified methods. Check joint appearance and carry out required tests; never substitute a joining method without approval.</p><h3>3. Welding, formwork and concrete</h3><p>Welding requires correct joint preparation, equipment, shielding and fire precautions. Formwork is assembled to the required dimensions and strength; ties, walers and props resist concrete pressure. Check dimensions, plumb, level, cleanliness, openings and supports before pouring. Concrete arrives by agitator truck, is pumped/placed, compacted and finished as specified; avoid segregation and cold joints by following the placement plan. Protect and cure concrete after placement.</p><p class=n>Textbook basis: Chapter 6, sections 6.2.1-6.2.9 (PDF pp.87-96).</p>`,s:{jp:`コンクリートを打設{だせつ}する前{まえ}に型枠{かたわく}を確認{かくにん}します。`,ro:`Konkurito wo dasetsu suru mae ni katawaku wo kakunin shimasu.`,en:`Check the formwork before placing concrete.`,p:[[`打設する前に`,`before placing`],[`型枠を`,`the formwork`],[`確認します`,`check`]]},p:`Put the process in order: install reinforcement and spacers → inspect cover/spacing → erect and inspect formwork → place concrete → compact/finish → cure and protect.`,m:`Before concrete: inspect the steel and formwork. After concrete: protect and cure it.`,u:`You can outline the main sequences for scaffolding, steel, rebar, joints, welding, formwork and concrete.`},
{c:5,t:`Chapter 6 supplement C: finishing and specialist building work (Textbook 6.2.10-6.2.21)`,jp:`専門工事の施工手順（仕上げ）`,o:[`Recognise the order of timber-frame construction`,`Understand roof, metal, tile and interior finishing sequences`,`Know the work scope of fittings, sash, insulation, waterproofing, stone and demolition`],x:`<h3>1. Carpentry and roof work</h3><p>Timber construction includes laying the sill (土台敷), erecting posts and beams, temporary bracing, installing the second-floor structure, small roof members, purlins (母屋), rafters (垂木) and roof sheathing (野地板), followed by raising/assembling the frame (上棟) and permanent bracing. Roof work then installs the specified roof covering and details for rainwater drainage.</p><h3>2. Sheet metal, tile and interior finishes</h3><p>Sheet-metal work marks out (ケガキ), cuts, bends and welds/fixes metal. Tile work checks the substrate, lays out courses, applies the specified adhesive/mortar, places tiles, aligns joints and finishes/grouts them. Interior work builds steel framing, coordinates services, fixes boards, treats joints with tape/putty and sands them smooth. Wallpaper/floor finishes require a clean, dry and even substrate.</p><h3>3. Fittings, sash and glazing</h3><p>Doors and fittings include framed doors, flush doors and Japanese sliding panels. Sash work positions the frame, temporarily wedges it, checks level/plumb/square, anchors it, fills the perimeter gap and installs glass carefully. Protect glass edges and follow lifting/handling precautions.</p><h3>4. Insulation, waterproofing, stone and demolition</h3><p>Spray polyurethane insulation is applied with dedicated equipment to form a continuous insulation layer; protect workers from chemical exposure and overspray. Waterproofing methods in the textbook include sheet, asphalt and sealant methods; substrate preparation and joint details are critical. Stone work cuts and fixes natural or artificial stone. Demolition planning covers external works, scaffold/protection, top-down floor sequence, heavy-equipment access, wall demolition, waste sorting and removal. Do not remove structural members out of sequence.</p><p class=n>Textbook basis: Chapter 6, sections 6.2.10-6.2.21 (PDF pp.96-106).</p>`,s:{jp:`下地{したじ}を平{たい}らにしてから仕上{しあ}げます。`,ro:`Shitaji wo tair a ni shite kara shiagemasu.`,en:`Finish only after making the substrate even.`,p:[[`下地を`,`the substrate`],[`平らにしてから`,`after making it level/even`],[`仕上げます`,`finish`]]},p:`A good finish depends on the substrate. Check it first, then install framing/board/tiles/coverings, treat joints, and protect completed work.`,m:`The sequence matters: substrate → frame/base → covering/finish → inspection → protection. Demolition is planned in a safe sequence, not random breaking.`,u:`You can describe the main stages of carpentry, roofing, tile, metal, interiors, fittings, sash, insulation, waterproofing, stone and demolition.`},
{c:6,t:`Chapter 7 supplement A: all accident types and high-risk construction work (Textbook 7.1.1-7.1.3)`,jp:`労働災害の種類と防止`,o:[`Name all 12 accident categories in the textbook`,`Explain why falls, machinery/crane and collapse are major hazards`,`Apply prevention to building, housing and road work`],x:`<h3>1. The 12 accident categories</h3><ol><li><b>墜落・転落</b> — fall from height or into an opening/excavation.</li><li><b>転倒</b> — slip, trip or fall on the same level.</li><li><b>激突</b> — worker strikes an object.</li><li><b>飛来・落下</b> — hit by flying/falling material or tools.</li><li><b>崩壊・倒壊</b> — soil, scaffold, structure or material collapses.</li><li><b>激突され</b> — struck by a moving object or vehicle.</li><li><b>はさまれ・巻き込まれ</b> — trapped or caught in machinery.</li><li><b>有害物等との接触</b> — contact with harmful substances.</li><li><b>感電</b> — electric shock.</li><li><b>火災</b> — fire.</li><li><b>交通事故（道路）</b> — road traffic accident.</li><li><b>おぼれ</b> — drowning.</li></ol><h3>2. The three major fatal hazards</h3><p>The textbook groups <b>墜落・転落</b>, <b>建設機械・クレーン災害</b> and <b>崩壊・倒壊</b> as the major construction fatal-accident groups. Historical figures in the textbook refer to 2021 (令和3年): 288 construction worker deaths, with 110 falls, 31 collapse/overturning, 27 caught-in/between and other categories. These are historical statistics, not current-year figures.</p><h3>3. Prevent the mechanisms, not just the injury</h3><p>Falls: guard openings, use compliant platforms/guardrails and the required fall-arrest system, inspect ladders/stepladders and keep access clear. Collapse: design and inspect temporary works, shore excavations as required, secure scaffold ties/braces and stop work in dangerous weather. Machinery/cranes: separate people and machines, use a signal person, check lifting gear and ground stability, never stand under loads, and never use equipment outside its intended/approved use. Flying objects: secure tools/materials and establish exclusion zones. Electricity: isolate, lock out where required, verify de-energised and use qualified personnel. Harmful substances: identify, ventilate and use the specified PPE. Fire: control hot work and keep extinguishers/escape routes available.</p><h3>4. Work-specific risks</h3><p>In building work, openings, scaffold platforms and edges create fall risks. In housing/carpentry, even a fall from a beam or stepladder can be fatal; never stand on a stepladder top plate or straddle it, and keep hands free when climbing. On roads, traffic control, visibility, safe vehicle routes and separation from pedestrians are essential. The PDF describes common high-fatality work settings; use the actual site risk assessment rather than memorising one generic control.</p><p class=n>Textbook basis: Chapter 7, sections 7.1.1-7.1.3 (PDF pp.107-112). The 2021 statistics are historical.</p>`,s:{jp:`開口部{かいこうぶ}に手{て}すりを設置{せっち}します。`,ro:`Koukaibu ni tesuri wo setchi shimasu.`,en:`Install guardrails at openings.`,p:[[`開口部に`,`at the opening`],[`手すりを`,`guardrails`],[`設置します`,`install`]]},p:`For each hazard, ask what moves, falls, collapses, rotates, conducts electricity, burns or exposes the worker. Then choose a control that removes or isolates that hazard.`,m:`Three major fatal hazards: fall, machinery/crane, collapse. Memorise all 12 accident categories separately.`,u:`You can name all 12 accident types, explain the three major fatal hazards and choose practical prevention for buildings, housing and roads.`},
{c:6,t:`Chapter 7 supplement B: daily safety cycle, new-worker training, PPE and heat (Textbook 7.2.1-7.2.6)`,jp:`安全施工サイクルと安全衛生`,o:[`Explain why the daily safety cycle is repeated`,`Distinguish new-worker and new-site-entrant training`,`Choose PPE and heat-illness controls for the task`],x:`<h3>1. Safety construction cycle</h3><p>The <b>安全施工サイクル</b> builds safety into ordinary work. The textbook's daily cycle includes morning meeting, safety/KY discussion, pre-work checks, guidance during work, safety patrol, planning/coordination for the next day, tidying and end-of-work checks. It aims to integrate construction and safety, improve cooperation between the main contractor and subcontractors, make safety habits routine, anticipate hazards and share necessary information with everyone. The exact order and local names can vary by site; follow the site's posted cycle.</p><h3>2. Two kinds of training</h3><p><b>新入者安全衛生教育</b> is safety and health education when a worker is newly hired or changes work. It covers hazards of machines/materials, safety devices, work procedures, pre-start checks, health prevention, housekeeping, first aid and evacuation. <b>新規入場者教育</b> is site-specific induction before a worker first enters a particular site: site rules, danger/no-entry zones, emergency exits, evacuation, reporting line, traffic routes and coordination. They are related but not identical.</p><h3>3. Protective equipment</h3><p>Select PPE from the hazard assessment and site instruction. The PDF includes full-harness fall protection, helmets, eye protection, masks/respirators, gloves and welding face shields. PPE must fit, be inspected and be used correctly. Gloves are generally important for hand protection, but can create an entanglement hazard around rotating machinery; follow the machine's specific safe-work instruction. PPE does not replace guards, isolation or safe work methods.</p><h3>4. Heat illness and safety signs</h3><p><b>熱中症</b> prevention includes acclimatisation, work/rest planning, shaded or cooled rest areas, frequent fluids and electrolytes as appropriate, monitoring symptoms and promptly reporting illness. Do not wait for severe symptoms. The textbook defines 真夏日 as a day with maximum temperature at least 30°C and 猛暑日 as at least 35°C; these are weather terms, not the only conditions under which heat illness can occur. <b>緑十字</b> is a safety symbol used in safety contexts.</p><p class=n>Textbook basis: Chapter 7, sections 7.2.1-7.2.6 (PDF pp.112-117). Follow current site heat protocols and emergency procedures.</p>`,s:{jp:`体調{たいちょう}が悪{わる}い時{とき}は、すぐに職長{しょくちょう}へ報告{ほうこく}します。`,ro:`Taichou ga warui toki wa, sugu ni shokuchou e houkoku shimasu.`,en:`If you feel unwell, report it to the foreman immediately.`,p:[[`体調が悪い時は`,`when you feel unwell`],[`すぐに`,`immediately`],[`職長へ報告します`,`report to the foreman`]]},p:`Before work, check the day's hazards, PPE, emergency route and heat plan. During work, report symptoms or changed conditions immediately.`,m:`Newly hired = general safety education. New site = site-specific induction. Both matter.`,u:`You can explain the daily safety cycle, the two training types, PPE selection and heat-illness prevention.`},
{c:6,t:`Chapter 7 supplement C: human error and communication (Textbook 7.2.7)`,jp:`ヒューマンエラーの原因`,o:[`Recognise the 12 human-error factors listed in the textbook`,`Understand how communication and shortcuts create risk`,`Use stop-and-confirm behaviour when unsure`],x:`<h3>1. Human error is not simply carelessness</h3><p>The textbook lists 12 factors: <b>認知</b> (misperception/recognition error), <b>不注意</b> (inattention), <b>注意力の低下</b> (reduced attention), <b>経験不足</b> (lack of experience), <b>慣れ</b> (over-familiarity), <b>集団欠陥</b> (group/team failure), <b>近道行動</b> (shortcut behaviour), <b>連絡不足</b> (insufficient communication), <b>場面行動</b> (situation-driven/automatic action), <b>パニック</b> (panic), <b>心身の機能低下</b> (decline in physical/mental function) and <b>疲労</b> (fatigue). The exact Japanese labels should be learned from the textbook.</p><h3>2. Practical examples</h3><ul><li>Misrecognition: assuming a signal means “start” when it means “stop”. Repeat the signal and confirm.</li><li>Inattention/fatigue: missing a loose cable or open edge. Use planned checks and rest.</li><li>Inexperience: not knowing a machine's blind spot. Ask for instruction and supervision.</li><li>Familiarity/shortcut: skipping a guard or inspection because “it was fine yesterday”. Never bypass a safety step.</li><li>Group/communication failure: two trades work in the same zone without coordination. Share the plan and use clear reporting.</li><li>Panic: reacting suddenly to an unexpected event. Stop, move to safety and follow the emergency procedure.</li></ul><h3>3. A simple rule for a new worker</h3><p>If an instruction is unclear, the work area changes, a machine behaves unexpectedly, or you feel unwell: <b>stop safely → tell the foreman → confirm the safe method → restart only when authorised</b>. Use 報告・連絡・相談 (ほうれんそう: report, inform, consult). Do not hide a mistake or near miss; reporting helps prevent a repeat accident.</p><p class=n>Textbook basis: Chapter 7, section 7.2.7 (PDF pp.118-120).</p>`,s:{jp:`分{わ}からない時{とき}は、作業{さぎょう}を止{と}めて確認{かくにん}します。`,ro:`Wakaranai toki wa, sagyou wo tomete kakunin shimasu.`,en:`When unsure, stop work and confirm.`,p:[[`分からない時は`,`when you do not understand`],[`作業を止めて`,`stop the work`],[`確認します`,`confirm / check`]]},p:`Use this response: stop safely, report to the foreman, explain what is unclear, repeat the instruction back, then restart only after confirmation.`,m:`Human error is often shaped by the system: fatigue, unclear signals, poor planning and pressure. Fix the conditions, not only blame the worker.`,u:`You can identify the 12 human-error factors and use stop-report-confirm behaviour to prevent mistakes.`}
];

{c:1,t:`Chapter 2 deep dive A: working conditions, wages and working time (Textbook 2.1.1)`,jp:`労働条件{ろうどうじょうけん}と賃金{ちんぎん}`,o:[`Identify the six employment conditions that must be clearly stated`,`Remember the five wage-payment principles`,`Understand the textbook's basic rules on hours, breaks, holidays, overtime and paid leave`],x:`<h3>1. What counts as working conditions?</h3><p>The Labour Standards Act sets minimum conditions. The textbook includes wages, working hours, dismissal, compensation for accidents, safety and health, dormitories and other workplace treatment.</p><h3>2. Six items that must be stated</h3><ol><li>Length/period of the labour contract.</li><li>Criteria for renewing a fixed-term contract.</li><li>Workplace and the work to be performed.</li><li>Start/end times, whether overtime exists, breaks, holidays and leave.</li><li>How wages are decided and paid, closing date, payday and raises.</li><li>Retirement and dismissal matters.</li></ol><h3>3. Five principles for paying wages</h3><p>Wages must be paid <b>in currency</b>, <b>directly to the worker</b>, <b>in full</b>, <b>at least once a month</b>, and <b>on a fixed date</b>. Learn the Japanese: 通貨・直接・全額・毎月1回以上・一定期日.</p><h3>4. Hours, breaks and days off in the textbook</h3><ul><li>Basic statutory limit stated: 8 hours a day and 40 hours a week.</li><li>More than 6 hours' work: at least 45 minutes' break; more than 8 hours: at least 1 hour.</li><li>At least one statutory holiday each week.</li><li>Overtime and holiday work require the applicable premium pay and legal procedures.</li><li>The textbook states the general overtime limits as 45 hours per month and 360 hours per year; exceptions and current rules require checking official updates.</li><li>Annual paid leave: the textbook describes 10 days after 6 months' continuous service with at least 80% attendance, increasing with service up to 20 days.</li></ul><h3>5. Other protections</h3><p>The textbook also explains the ban on forced labour, equal treatment, restrictions on dismissal during certain work-related injury/illness leave periods, 30-day dismissal notice (subject to legal exceptions), and prohibition on pre-setting penalty amounts for breach of contract.</p><p class=n>Source: JAC textbook Chapter 2, section 2.1.1, PDF pp.7-9. This is a learning summary, not legal advice. The law and exceptions may change; confirm current rules with official Japanese authorities.</p>`,s:{jp:`労働条件{ろうどうじょうけん}を確認{かくにん}してから働{はたら}きます。`,ro:`Roudou jouken wo kakunin shite kara hatarakimasu.`,en:`I work after checking the employment conditions.`,p:[[`労働条件{ろうどうじょうけん}`,`employment conditions`],[`を確認{かくにん}してから`,`after checking`],[`働{はたら}きます`,`work`]]},p:`Before signing, check the contract period, job location and duties, hours, breaks, holidays, wage calculation, payday and termination conditions. Ask for an explanation if any item is unclear.`,m:`Memorise the six written items and the five wage-payment principles. The numerical limits in this lesson are the textbook's baseline; legal exceptions and later amendments matter.`,u:`You can list the six written employment conditions and five wage-payment principles, and explain the basic hours and break rules.`},
{c:1,t:`Chapter 2 deep dive B: safety, insurance, construction and environmental laws (Textbook 2.1.2-2.17)`,jp:`安全{あんぜん}と建設{けんせつ}の法令{ほうれい}`,o:[`Distinguish labour safety law, workers' compensation and employment insurance`,`Explain the five purposes of the Construction Business Act`,`Understand manifest, recycling and infrastructure-law examples`],x:`<h3>1. Safety and health at work</h3><p>The Industrial Safety and Health Act aims to protect workers' safety and health and create a comfortable work environment. Workers must follow safety rules and cooperate with accident-prevention measures. New hires and workers whose duties change need safety and health education; certain machine operations require additional training or qualifications.</p><h3>2. Insurance: do not confuse these systems</h3><ul><li><b>労災保険 (workers' compensation):</b> covers qualifying work-related and commuting injuries, illness, disability or death. The textbook says the employer bears the full premium.</li><li><b>雇用保険 (employment insurance):</b> includes benefits for eligible unemployed people and support for training; premiums are paid by both worker and employer under the applicable rules.</li><li><b>最低賃金法:</b> minimum wages are set by prefecture; check the current prefectural rate, not an old textbook figure.</li></ul><h3>3. Construction Business Act: five purposes</h3><ol><li>Improve the quality/capability of construction businesses, including licensing.</li><li>Make construction contracts appropriate, including estimates and written contracts.</li><li>Ensure proper construction, including required technical management.</li><li>Protect the client/orderer, including construction organisation records and site representation.</li><li>Promote healthy development of the construction industry.</li></ol><h3>4. Building Standards Act</h3><p><b>単体規定</b> controls the individual building: structural safety, durability, earthquake resistance, fire protection, roof/exterior, daylight, ventilation, toilets and electrical facilities. <b>集団規定</b> controls how buildings fit into the surrounding town: site/road rules, building-coverage ratio, floor-area ratio, height and setback/oblique-line restrictions, and fire-prevention districts.</p><h3>5. Waste and environmental controls</h3><p>The Waste Management Act aims to reduce waste and ensure proper treatment. The main contractor prepares and tracks the industrial-waste manifest (マニフェスト) so the waste's route through collection, transport, treatment and final disposal/recycling can be checked. Workers must sort and store waste in the site's designated way. The Construction Recycling Act promotes separation by material and recycling/reuse.</p><p>Other textbook examples: Air Pollution Control Act regulates emissions/dust; Noise Regulation and Vibration Regulation laws address construction noise/vibration; Water Pollution Control Act controls polluted water discharge; Fire Service Act concerns fire prevention, alarms, extinguishing and evacuation equipment.</p><h3>6. Utility and infrastructure laws</h3><ul><li><b>Water Supply Act:</b> safe, sufficient water supply; qualified personnel and instructions matter.</li><li><b>Sewerage Act:</b> sewer development and water-quality protection; prohibited or excessive pollutants must not be discharged.</li><li><b>Gas Business Act:</b> gas supply safety, leakage and ventilation.</li><li><b>Electricity Business Act:</b> safe electrical works, maintenance and operation; leakage can cause fire or electric shock.</li><li><b>Telecommunications Business Act:</b> communications networks; the textbook notes work/oversight by a qualified chief telecommunications engineer where required.</li><li><b>Radio Act:</b> some transmitters require a licence and Japanese approval; do not assume an overseas radio is legal to use.</li><li><b>Aircraft Act:</b> tall buildings and cranes may affect aircraft safety.</li><li><b>Parking Lot Act:</b> rules concerning parking facilities.</li></ul><p class=n>Source: JAC textbook Chapter 2, PDF pp.7-18. Laws, thresholds, qualifications and local requirements can change. This lesson follows the textbook's teaching scope; confirm current requirements with official sources before acting.</p>`,s:{jp:`廃棄物{はいきぶつ}は分別{ぶんべつ}して、決{き}められた場所{ばしょ}に置{お}きます。`,ro:`Haikibutsu wa bunbetsu shite, kimera reta basho ni okimasu.`,en:`Separate waste and put it in the designated place.`,p:[[`廃棄物{はいきぶつ}`,`waste`],[`分別{ぶんべつ}して`,`separate / sort`],[`決{き}められた場所{ばしょ}`,`designated place`],[`置{お}きます`,`put / place`]]},p:`Sort waste by the site's categories, use the designated storage area, and follow the manifest and supervisor's instructions. Never discharge site wastewater or use unapproved equipment casually.`,m:`Workers need practical awareness of laws, but do not treat this lesson as permission to perform regulated work without required qualifications.`,u:`You can explain the five Construction Business Act purposes, the difference between the two Building Standards categories, and the purpose of a waste manifest.`},
{c:2,t:`Chapter 3 deep dive: what the 38 specialist trades actually do (Textbook 3.2)`,jp:`専門工事{せんもんこうじ}の種類{しゅるい}`,o:[`Group the 38 specialist trades by the work they perform`,`Distinguish similar-sounding trades such as drilling, wellpoint and pipe-jacking`,`Recognise the main building, lifeline and civil-work processes`],x:`<h3>1. Civil engineering and ground works</h3><ul><li><b>土工事:</b> excavation, earth moving, filling, levelling and compaction.</li><li><b>推進トンネル工事:</b> a pipe/jacking machine pushes a pipe or casing underground from a shaft; workers manage the jacking and receiving shafts and alignment.</li><li><b>海洋工事:</b> marine/coastal construction such as work around ports and shore structures.</li><li><b>さく井工事:</b> drilling wells/bores into the ground.</li><li><b>ウェルポイント工事:</b> temporary groundwater lowering using wellpoint pipes and pumps so excavation can be carried out in drier, more stable conditions.</li><li><b>舗装工事:</b> preparing the road base and laying/finishing pavement.</li><li><b>機械土工事:</b> earthwork using construction machinery.</li><li><b>杭工事:</b> installing piles to transfer building loads into supporting ground.</li></ul><h3>2. Structural frame and concrete</h3><ul><li><b>とび工事:</b> scaffolding, temporary structures and work at height.</li><li><b>鉄骨工事:</b> erecting and connecting structural steel members.</li><li><b>鉄筋工事:</b> cutting, bending, arranging and tying reinforcing bars.</li><li><b>鉄筋継手工事:</b> joining reinforcing bars (for example, gas-pressure welding or mechanical joints, depending on design).</li><li><b>溶接工事:</b> joining metal by welding.</li><li><b>型枠工事:</b> assembling forms that hold fresh concrete in the required shape.</li><li><b>コンクリート圧送工事:</b> pumping concrete through pipes/hoses to the placement point.</li></ul><h3>3. Building finishes and specialist building work</h3><ul><li><b>塗装:</b> surface preparation and coating.</li><li><b>造園:</b> landscaping and planting.</li><li><b>左官:</b> applying and finishing plaster/mortar.</li><li><b>建築:</b> general building/carpentry work as classified in the textbook.</li><li><b>屋根:</b> roof covering and related roof work.</li><li><b>建築板金:</b> forming and installing sheet-metal components such as flashings and roof/wall metalwork.</li><li><b>タイル張り:</b> setting and grouting tiles.</li><li><b>内装仕上げ:</b> interior finishing, ceilings, walls and floors.</li><li><b>表装:</b> wallpaper/wall-covering work.</li><li><b>建具:</b> fitting doors, windows and other building fittings.</li><li><b>サッシ:</b> installing sash/window frames.</li><li><b>吹付け:</b> spray-applied finishing or insulation work, depending on the trade.</li><li><b>防水:</b> waterproofing roofs, decks, wet areas and joints.</li><li><b>石工事:</b> cutting, setting and fixing stone.</li><li><b>築炉:</b> building/lining industrial furnaces and kilns.</li><li><b>解体:</b> dismantling structures in a planned sequence.</li></ul><h3>4. Lifeline and building services</h3><ul><li><b>電気工事:</b> electrical wiring and equipment installation.</li><li><b>電気通信工事:</b> communication cables, network equipment and related systems.</li><li><b>配管工事:</b> piping for services such as water, gas or other systems, according to scope.</li><li><b>冷凍空調機器工事:</b> refrigeration and air-conditioning equipment.</li><li><b>給排水衛生設備工事:</b> water supply, drainage and sanitary equipment.</li><li><b>保温工事:</b> thermal insulation for pipes/equipment.</li><li><b>消防設備工事:</b> fire alarm, extinguishing and related fire-protection equipment.</li></ul><p><b>How to study:</b> For every trade, learn four things: the Japanese name, the object being worked on, the main action, and one typical hazard. Similar names are not interchangeable: さく井 is drilling a well; ウェルポイント is groundwater lowering; 推進トンネル is pipe-jacking/tunnelling.</p><p class=n>Source: JAC textbook Chapter 3, sections 3.1-3.3, PDF pp.18-48. The short descriptions here are learning summaries; actual scope depends on the project and trade classification.</p>`,s:{jp:`鉄筋工事{てっきんこうじ}では、鉄筋{てっきん}を組{く}み立{た}てます。`,ro:`Tekkin kouji dewa, tekkin wo kumitatemasu.`,en:`In rebar work, reinforcing bars are assembled.`,p:[[`鉄筋工事{てっきんこうじ}`,`reinforcement-bar work`],[`では`,`in / as for`],[`鉄筋{てっきん}`,`reinforcing bar`],[`組{く}み立{た}てます`,`assemble`]]},p:`Before identifying a trade, ask: is it ground work, structural work, finishing, lifeline equipment or demolition? Then identify the material and the operation.`,m:`Do not confuse さく井 (well drilling) with ウェルポイント (dewatering) or 推進トンネル (pipe-jacking).`,u:`You can describe the main purpose of the textbook's 38 specialist trades and distinguish the similar ground-work trades.`},
{c:3,t:`Chapter 4 deep dive: setting-out, levels, foundations and rebar language (Textbook 4.2)`,jp:`墨出{すみだ}しと現場用語{げんばようご}`,o:[`Understand setting-out and the purpose of control lines`,`Distinguish 遣り方, 水貫, 親墨, 陸墨 and 壁芯`,`Understand common foundation, rebar and scaffold terms`],x:`<h3>1. What is 墨出し?</h3><p>墨出し (sumidashi) is transferring dimensions and reference lines from drawings onto the site or building surface. Workers use those marks to locate walls, columns, openings, equipment and other elements. A wrong reference line can affect many later trades, so confirm the drawing, reference point and measurement before marking.</p><h3>2. Reference and setting-out terms</h3><ul><li><b>親墨:</b> primary/control reference line used as the basis for other setting-out.</li><li><b>陸墨:</b> horizontal level reference line used to transfer or check height.</li><li><b>壁芯:</b> centre line of a wall.</li><li><b>遣り方:</b> temporary batter boards/profile used to transfer building position and level outside the excavation area.</li><li><b>水貫:</b> horizontal board fixed to the batter-board stakes, used to mark lines/levels.</li><li><b>水盛り:</b> levelling method using water level principles to transfer a common level.</li></ul><h3>3. Ground and foundation vocabulary</h3><p><b>掘削</b> = excavation; <b>根切り</b> = excavation for foundations; <b>埋戻し</b> = backfilling; <b>締固め</b> = compaction; <b>地業</b> = ground/foundation preparation; <b>杭</b> = pile; <b>基礎</b> = foundation.</p><h3>4. Reinforcement and formwork</h3><ul><li><b>主筋:</b> main reinforcement bar.</li><li><b>配力筋:</b> distribution bar.</li><li><b>あばら筋 / スターラップ:</b> stirrup reinforcement in beams.</li><li><b>かぶり厚さ:</b> concrete cover thickness protecting reinforcement.</li><li><b>スペーサー:</b> spacer that helps maintain cover/position.</li><li><b>型枠:</b> formwork; <b>支保工:</b> temporary support/shoring.</li><li><b>開口部:</b> opening; openings require protection against falls where relevant.</li></ul><h3>5. Check before you mark or install</h3><ol><li>Use the latest approved drawing and revision.</li><li>Confirm the benchmark/reference point with the supervisor.</li><li>Check dimensions and level with the correct instrument.</li><li>Mark clearly and protect the marks from damage.</li><li>Have critical positions checked before the next trade covers them.</li></ol><p class=n>Source: JAC textbook Chapter 4, sections 4.2.1-4.2.11, PDF pp.50-58. This is a simplified terminology guide; always use the project's approved drawings and instructions.</p>`,s:{jp:`図面{ずめん}を確認{かくにん}してから、墨出{すみだ}しをします。`,ro:`Zumen wo kakunin shite kara, sumidashi wo shimasu.`,en:`I do setting-out after checking the drawing.`,p:[[`図面{ずめん}`,`drawing`],[`確認{かくにん}してから`,`after checking`],[`墨出{すみだ}し`,`setting-out`],[`をします`,`do / perform`]]},p:`When a mark, level or dimension does not match the drawing, do not guess or move it yourself. Stop and confirm with the responsible supervisor.`,m:`親墨 is a primary control line; 陸墨 is a horizontal level reference; 壁芯 is the wall centre line. Learn these as different concepts.`,u:`You can explain setting-out and distinguish the main control-line, batter-board, foundation and reinforcement terms.`},
{c:4,t:`Chapter 5 deep dive A: common hand tools and electric tools (Textbook 5.3.1-5.3.8)`,jp:`工具{こうぐ}の名前{なまえ}と使{つか}い方{かた}`,o:[`Identify the common tools by their function`,`Distinguish measuring, cutting, striking, scraping and tightening tools`,`Understand why the correct tool and safe operating method matter`],x:`<h3>1. Electric tools</h3><p>Common examples include the electric drill (電動ドリル), impact driver (インパクトドライバー), grinder (グラインダー), circular saw (丸のこ) and other powered cutting/drilling tools. Select the correct bit or blade, check the guard and cable/battery, secure the workpiece, and follow the tool's operating instructions. Never remove a safety guard or use a damaged tool.</p><h3>2. Digging and earthwork tools</h3><p>Examples include shovel/spade (スコップ), pick/mattock (つるはし) and hand tamper/compaction tools. Select based on soil and task; check underground services and the excavation plan before digging.</p><h3>3. Marking and measuring</h3><ul><li><b>墨つぼ:</b> chalk/ink line marker for straight reference lines.</li><li><b>差し金:</b> carpenter's square for checking/marking right angles and dimensions.</li><li><b>巻尺:</b> tape measure.</li><li><b>水平器:</b> spirit level.</li><li><b>下げ振り:</b> plumb bob for checking vertical alignment.</li><li><b>トランシット / レベル:</b> surveying instruments for angle/alignment and level work (use the instrument appropriate to the task).</li></ul><h3>4. Cutting and grinding</h3><p>Tools include hacksaw (金切りのこ), cutter/utility knife (カッター), nippers (ニッパ), chisel (のみ), grinder and circular saw. Keep hands clear of the cutting line, clamp the workpiece, use the correct blade/disc and wear suitable eye/face protection.</p><h3>5. Striking, pulling and scraping</h3><ul><li><b>ハンマー / 玄能:</b> hammer for striking.</li><li><b>バール:</b> crowbar/pry bar for levering or pulling.</li><li><b>ワイヤーブラシ:</b> wire brush for cleaning/rust removal.</li><li><b>砥石:</b> whetstone/grinding stone for sharpening or dressing, depending on type.</li><li><b>のみ:</b> chisel for cutting/shaping material.</li><li><b>かんな:</b> hand plane for shaving/smoothing wood.</li></ul><h3>6. Tightening and fastening</h3><ul><li><b>スパナ:</b> open-ended wrench.</li><li><b>モンキーレンチ:</b> adjustable wrench.</li><li><b>六角レンチ:</b> hex key / Allen key.</li><li><b>ドライバー:</b> manual screwdriver.</li><li><b>インパクトドライバー:</b> powered impact driver for driving suitable screws/fasteners.</li><li><b>シノ:</b> tool used in rebar work to twist/tighten binding wire.</li></ul><p><b>Selection rule:</b> match the tool to the fastener/material and size. Do not use a wrench as a hammer or force a tool that does not fit.</p><p class=n>Source: JAC textbook Chapter 5, sections 5.3.1-5.3.8, PDF pp.76-82. Tool examples are introductory; follow manufacturer instructions and site training.</p>`,s:{jp:`作業{さぎょう}に合{あ}った工具{こうぐ}を使{つか}います。`,ro:`Sagyou ni atta kougu wo tsukaimasu.`,en:`Use a tool that matches the task.`,p:[[`作業{さぎょう}`,`task / work`],[`に合{あ}った`,`suitable for`],[`工具{こうぐ}`,`tool`],[`を使{つか}います`,`use`]]},p:`Before use: inspect the tool, confirm the correct attachment, secure the material, wear the required PPE, keep bystanders clear and return the tool safely after use.`,m:`The same broad job may require different tools. A spanner, adjustable wrench and hex key are not interchangeable.`,u:`You can identify the main common tools, explain their purpose and select a suitable tool for a basic task.`},
{c:4,t:`Chapter 5 deep dive B: mixing, curing, lifting, work platforms and cleaning (Textbook 5.3.9-5.3.15)`,jp:`練{ね}る・養生{ようじょう}・吊{つ}る工具{こうぐ}`,o:[`Understand tools used for mixing and material preparation`,`Recognise curing/protection, lifting and access equipment`,`Apply basic inspection and exclusion-zone thinking`],x:`<h3>1. Mixing and preparing material</h3><p>Mixing tools and equipment are selected for the material and volume: hand mixing tools, mixing trays and powered mixers may be used for mortar, plaster or other products. Follow the specified mix ratio and mixing time. Do not add water or other material casually; it can change the product performance.</p><h3>2. Curing and protection</h3><p><b>養生</b> means protecting completed work or materials from damage and unsuitable conditions. Common items include protective sheets, curing sheets, masking tape, floor/wall protection and covers. Protect finished surfaces from impact, dust, water, paint and traffic as instructed.</p><h3>3. Cleaning and removing dirt</h3><p>Cleaning tools include brooms, brushes, dustpans, scrapers, cloths and suitable cleaning equipment. Choose a method that does not damage the surface or create dust exposure. Sort waste and place it in the designated area.</p><h3>4. Lifting and moving objects</h3><p>Lifting equipment can include slings, wire ropes, shackles, hooks, chain blocks/hoists and cranes. Only trained/authorised workers perform regulated lifting tasks. Check the load weight, rated capacity, sling condition, attachment points, balance and communication signals. Keep everyone out from under suspended loads. Never stand in the line of a moving load.</p><h3>5. Work platforms and access</h3><p>Work platforms include stepladders, ladders, mobile towers and movable work platforms. Select the safest suitable access equipment. Inspect before use, place on stable ground, secure where required, and do not overreach. Follow site rules for guardrails, access and fall protection.</p><h3>6. Before-work inspection</h3><ol><li>Check the equipment identification and condition.</li><li>Check guards, brakes, hooks, slings and attachments as relevant.</li><li>Confirm rated capacity and intended use.</li><li>Check the work area, ground and overhead/underground hazards.</li><li>Agree signals and exclusion zones with the team.</li><li>Stop and report defects; do not improvise a repair.</li></ol><p class=n>Source: JAC textbook Chapter 5, sections 5.3.9-5.3.15, PDF pp.82-84. Equipment selection and lifting rules depend on the equipment, task and current site regulations.</p>`,s:{jp:`吊{つ}り荷{に}の下{した}に入{はい}ってはいけません。`,ro:`Tsurini no shita ni haitte wa ikemasen.`,en:`You must not enter beneath a suspended load.`,p:[[`吊{つ}り荷{に}`,`suspended load`],[`の下{した}に`,`under`],[`入{はい}ってはいけません`,`must not enter`]]},p:`If a load swings, a sling is damaged, the signal is unclear or someone enters the exclusion zone, stop the lift safely and notify the responsible person.`,m:`Rated capacity and worker authorisation matter. Never guess a load's weight or use lifting gear with unknown condition.`,u:`You can explain basic mixing, curing, lifting and access-equipment precautions.`},
{c:5,t:`Chapter 6 deep dive A: construction planning, drawings, 5M and pre-work checks (Textbook 6.1)`,jp:`施工計画{せこうけいかく}と施工前{せこうまえ}の確認{かくにん}`,o:[`Understand why construction planning is prepared before work`,`Use 5M and QCDSE as planning/checking frameworks`,`Know what to verify before starting work`],x:`<h3>1. What is a construction plan?</h3><p>A construction plan explains how the work will be carried out safely and properly. It connects drawings/specifications, work sequence, people, materials, machinery, temporary works, site conditions, quality checks and safety controls. It is not just a calendar.</p><h3>2. 5M</h3><ul><li><b>Man:</b> people, skills, roles, qualifications and supervision.</li><li><b>Machine:</b> equipment, tools, capacity, condition and maintenance.</li><li><b>Material:</b> correct type, specification, quantity, delivery and storage.</li><li><b>Method:</b> work procedure, sequence, access and inspection method.</li><li><b>Management:</b> coordination, schedule, records, communication and control.</li></ul><h3>3. QCDSE</h3><ul><li><b>Quality:</b> meet drawings/specifications and inspection criteria.</li><li><b>Cost:</b> use labour/material/equipment efficiently without unsafe shortcuts.</li><li><b>Delivery:</b> meet the schedule and coordinate trades.</li><li><b>Safety:</b> identify hazards and prevent injury.</li><li><b>Environment:</b> control waste, dust, noise, vibration and water impacts.</li></ul><h3>4. Pre-work confirmation</h3><ol><li>Confirm the latest drawing, specification and work area.</li><li>Confirm the sequence and interfaces with other trades.</li><li>Confirm workers, qualifications, instructions and supervision.</li><li>Confirm materials, quantities, condition and storage.</li><li>Inspect machinery, tools, temporary structures and access.</li><li>Identify hazards, required PPE, exclusion zones and emergency arrangements.</li><li>Confirm quality checkpoints and who records/approves them.</li></ol><h3>5. Change control</h3><p>If site conditions, dimensions, materials, weather or instructions differ from the plan, stop the affected work and report. Do not quietly change the method or use an unapproved substitute. The responsible supervisor must confirm the revised method and any drawing/plan changes.</p><p class=n>Source: JAC textbook Chapter 6, sections 6.1.1-6.1.5, PDF pp.85-87. The 5M/QCDSE descriptions are beginner learning frameworks; use the project's own approved plan and documents.</p>`,s:{jp:`作業前{さぎょうまえ}に図面{ずめん}と安全{あんぜん}を確認{かくにん}します。`,ro:`Sagyou mae ni zumen to anzen wo kakunin shimasu.`,en:`Before work, check the drawings and safety.`,p:[[`作業前{さぎょうまえ}に`,`before work`],[`図面{ずめん}と`,`drawings and`],[`安全{あんぜん}を`,`safety`],[`確認{かくにん}します`,`check`]]},p:`A plan must be checked against real site conditions. Report differences before proceeding; never make an unauthorised design or method change.`,m:`5M asks who, what equipment, which materials, which method and how it is managed. QCDSE balances quality, cost, delivery, safety and environment.`,u:`You can explain the purpose of a construction plan and use 5M/QCDSE for a pre-work check.`},
{c:5,t:`Chapter 6 deep dive B: trade-by-trade work sequence and inspection points (Textbook 6.2)`,jp:`専門工事{せんもんこうじ}の施工手順{せこうてじゅん}`,o:[`Understand typical sequences for major structural and finishing trades`,`Recognise why inspection occurs before work is covered by the next trade`,`Know when to stop and request confirmation`],x:`<h3>1. Scaffolding / temporary access</h3><p>Plan the scaffold for the task and site. Prepare a stable base, assemble the specified members and braces, install platforms and guardrails, provide safe access, tie/anchor as designed, inspect and hand over before use. Do not remove or alter members without authorisation. Weather and loading can change stability.</p><h3>2. Steel frame</h3><p>Confirm member identification and lifting plan; prepare the work area and crane; lift and position members; temporarily secure and align; complete the specified bolted or welded connections; check alignment and connection quality; only release temporary support when authorised. Keep people clear of suspended members.</p><h3>3. Reinforcement</h3><p>Check bar marks, size, shape and quantity against drawings; prepare and place bars in the specified order; maintain spacing, cover and laps/joints; install spacers and chairs; inspect openings and additional reinforcement; request inspection before concrete placement. Beam/slab/wall arrangements differ, so follow the drawings rather than memorising one universal pattern.</p><h3>4. Rebar joints and welding</h3><p>Joint methods include gas-pressure welding and other approved mechanical or welded methods. The textbook's key performance principle is that the joint must have the required strength; for a sound gas-pressure joint, the parent bar should fail before the joint in the described tensile/bending tests. Only qualified workers use the approved procedure; inspect and record the joint as required.</p><h3>5. Formwork and concrete</h3><p>Formwork sequence: check layout and dimensions; assemble panels; install walers/ties/bracing and shores; check plumb, level, dimensions and tightness; inspect before pouring. Concrete placement: confirm mix and delivery, pump/pipe setup, access and communication; place in a controlled sequence; compact with the specified vibrator; monitor formwork; finish and cure. Do not overload or alter supports during placement.</p><h3>6. Finishing trades</h3><ul><li><b>Plastering:</b> prepare/clean substrate, set guides if required, apply mortar/plaster in layers and finish to the specified plane/texture.</li><li><b>Painting:</b> inspect and prepare substrate, protect adjacent areas, apply primer/undercoat and specified coats, observe drying/recoat instructions.</li><li><b>Roofing/waterproofing:</b> prepare substrate and details, install underlay/membrane/covering in the designed sequence, treat laps/edges/penetrations, inspect before concealment.</li><li><b>Tile/interior/wallpaper:</b> confirm layout and substrate, set out, apply adhesive or fixing system, install, align, grout/finish and protect.</li><li><b>Doors/sashes:</b> check opening dimensions and frame position, fix and align, then check operation and clearances.</li><li><b>Demolition:</b> survey and plan, isolate services, establish exclusion zones, dismantle in a controlled sequence, manage dust/noise and sort waste. Never remove structural support without an approved sequence.</li></ul><h3>7. The hold-point rule</h3><p>Some work becomes hidden by the next process (for example, reinforcement before concrete). These stages need inspection before being covered. If a required inspection has not happened, do not proceed to the next stage.</p><p class=n>Source: JAC textbook Chapter 6, sections 6.2.1-6.2.21, PDF pp.87-106. These are simplified process summaries, not complete method statements. Actual sequence is project-specific and must follow approved drawings, specifications, procedures and qualified supervision.</p>`,s:{jp:`次{つぎ}の工程{こうてい}に進{すす}む前{まえ}に、検査{けんさ}を受{う}けます。`,ro:`Tsugi no koutei ni susumu mae ni, kensa wo ukemasu.`,en:`Receive inspection before moving to the next process.`,p:[[`次{つぎ}の工程{こうてい}に`,`to the next process`],[`進{すす}む前{まえ}に`,`before proceeding`],[`検査{けんさ}を受{う}けます`,`receive inspection`]]},p:`Do not cover reinforcement, joints, waterproofing details or other inspection points before the required check and approval.`,m:`A trade sequence is not one fixed recipe for every site. Drawings, specifications, approved method statements and site conditions control the actual steps.`,u:`You can outline typical sequences for scaffolding, steel, rebar, formwork/concrete and finishing work, and explain hold-point inspections.`},
{c:6,t:`Chapter 7 deep dive A: accident types and practical prevention (Textbook 7.1)`,jp:`労働災害{ろうどうさいがい}の種類{しゅるい}と防止{ぼうし}`,o:[`Recognise the main accident categories in the textbook`,`Explain common causes involving falls, collapse, machinery and falling objects`,`Apply simple controls to ladders, circular saws, vehicles and lifting work`],x:`<h3>1. Accident categories</h3><p>The textbook describes falls, trips/falls, collisions, flying/falling objects, collapse, struck-by incidents, caught-in/between or entanglement, harmful-substance contact, electric shock, fire, road traffic accidents and drowning. Learn the Japanese labels as well as the scenario.</p><h3>2. High-risk examples and controls</h3><ul><li><b>墜落・転落 (fall from height):</b> scaffold edges, openings, roofs, beams and ladders. Use approved guardrails, covers/nets, safe access and the required fall-arrest system. Use designated walkways.</li><li><b>崩壊・倒壊 (collapse):</b> unstable scaffold bases, missing ties/braces, omitted members, wind loading on sheets/panels or earthquake. Build to the design, inspect ties and foundations, and follow weather instructions.</li><li><b>激突され・はさまれ (struck/caught):</b> excavator swing radius, reversing dump trucks, pinch points and blind spots. Separate people and machines, use a trained guide where required, agree signals and never enter the danger zone.</li><li><b>飛来・落下 (flying/falling objects):</b> dropped tools/materials and suspended loads. Secure tools/materials, use toe boards or protection as designed, establish exclusion zones and never stand under a load.</li><li><b>感電 (electric shock):</b> damaged cables, leakage or contact with live conductors. Isolate/confirm de-energisation through authorised procedures; do not touch suspected live equipment.</li><li><b>交通事故:</b> site access roads, public-road loading/unloading and reversing vehicles. Use traffic plans, visibility, safe routes and spotters as required.</li><li><b>切れ・こすれ (cuts):</b> circular saws and rotating blades. Secure the workpiece and use guards. The textbook warns not to wear gloves when operating certain rotating-blade machines because gloves can be caught and pulled in.</li></ul><h3>3. Ladder and stepladder rules from the textbook</h3><ul><li>Do not stand on the top cap/platform of a stepladder.</li><li>Do not straddle a stepladder to work.</li><li>Do not climb while carrying objects in both hands.</li><li>Do not use a ladder with its top or bottom unsecured; check anti-slip feet.</li><li>Where practical, choose safer alternatives such as guarded stepladders, mobile towers, movable work platforms or elevated work platforms.</li></ul><p class=n>Source: JAC textbook Chapter 7, sections 7.1.1-7.1.3, PDF pp.107-112. The textbook's fatality figures are historical (2021 data); do not treat them as current statistics. Follow current site risk assessments and regulations.</p>`,s:{jp:`危険{きけん}な場所{ばしょ}に入{はい}らないでください。`,ro:`Kiken na basho ni hairanaide kudasai.`,en:`Please do not enter dangerous areas.`,p:[[`危険{きけん}な場所{ばしょ}`,`dangerous area`],[`に`,`into`],[`入{はい}らないでください`,`please do not enter`]]},p:`If you see a person under a suspended load, an unprotected opening, unstable scaffold or a person in a machine's swing zone, stop the affected work and warn the responsible supervisor.`,m:`The textbook highlights falls, construction machinery/crane incidents and collapse as the three major construction accident groups. The underlying figures are dated; learn the hazard types, not an old percentage as a current statistic.`,u:`You can recognise common accident types and state practical prevention rules for height work, machinery, lifting and cutting.`},
{c:6,t:`Chapter 7 deep dive B: safety cycle, worker education, PPE and heat illness (Textbook 7.2.1-7.2.6)`,jp:`安全施工{あんぜんせこう}サイクルと安全教育{あんぜんきょういく}`,o:[`Remember all eight steps of the daily safety construction cycle`,`Distinguish new-worker education from new-site entrant education`,`Select PPE appropriately and recognise heat-illness warning signs`],x:`<h3>1. Eight steps of the daily safety construction cycle</h3><ol><li><b>作業前の安全朝礼:</b> all contractors attend; share previous patrol findings, today's safety instructions and warm-up.</li><li><b>安全ミーティング:</b> trade teams review yesterday, today's work sequence, KY and new-entrant education.</li><li><b>作業開始前点検:</b> inspect machines, tools and the work setup before starting.</li><li><b>作業中の指導・監督:</b> supervisors/foremen monitor and guide work.</li><li><b>安全パトロール:</b> site leaders and contractors inspect conditions and give directions.</li><li><b>安全工程打合せ:</b> main contractor and specialist contractors coordinate next-day interfaces and methods.</li><li><b>持ち場の後片付け:</b> everyone tidies, organises and cleans their work area.</li><li><b>終業時の安全確認:</b> responsible persons check fire, theft and public-hazard prevention before closing.</li></ol><h3>2. New-worker safety and health education (新入者安全衛生教育)</h3><p>The textbook lists eight topics: (1) hazards/harmfulness of machines and materials and how to handle them; (2) safety devices, harmful-substance controls and protective equipment; (3) work procedures; (4) pre-start inspections; (5) causes and prevention of work-related illness; (6) housekeeping and cleanliness; (7) emergency first aid and evacuation; (8) other safety/health matters related to the job.</p><h3>3. New-site entrant education (新規入場者教育)</h3><p>This is specific to the construction site and is given before the worker starts there. The eight topics are: (1) areas where main and subcontractor workers mix; (2) dangerous locations and restricted areas; (3) coordination between simultaneous trades; (4) evacuation method; (5) chain of command; (6) assigned work and accident-prevention measures; (7) site safety/health rules; (8) the site's basic safety policy, targets and accident-prevention plan. The textbook notes that many fatal incidents occur within the first week of site entry, which is why site-specific induction matters.</p><h3>4. PPE and equipment</h3><p>Basic equipment shown includes full-body harness, helmet, hook and safety shoes. Other protection includes safety glasses for dust/sparks/particles, masks for dust, and welding shields. Gloves protect hands for many tasks, but the textbook warns against gloves near specified rotating blades/machines (such as circular saws and drilling machines) where they can be caught. PPE must match the actual hazard and site rules.</p><h3>5. Heat illness</h3><p>Warning signs in the textbook include dizziness/fainting, muscle pain or stiffness, heavy sweating, headache, discomfort and nausea. Prevention includes shaded/cool rest areas, water and salt supply, planned breaks, suitable breathable clothing and site heat measures such as fans, shade nets, misting and cooling facilities. If symptoms occur, stop work, tell the supervisor immediately and follow the site's emergency response. Do not leave an affected worker alone or delay escalation.</p><h3>6. Safety symbols</h3><p><b>緑十字</b> (green cross) is a safety and health symbol. The textbook also describes the safety and health flag combining the green cross with the white cross.</p><p class=n>Source: JAC textbook Chapter 7, sections 7.2.1-7.2.6, PDF pp.112-118. PPE requirements and fall-arrest thresholds depend on current law, task and site assessment; follow current instructions, not a simplified number in isolation.</p>`,s:{jp:`体調{たいちょう}が悪{わる}くなったら、すぐに報告{ほうこく}します。`,ro:`Taichou ga waruku nattara, sugu ni houkoku shimasu.`,en:`If you start feeling unwell, report it immediately.`,p:[[`体調{たいちょう}が悪{わる}くなったら`,`if you start feeling unwell`],[`すぐに`,`immediately`],[`報告{ほうこく}します`,`report`]]},p:`At a new site, identify restricted zones, emergency exits, first-aid points, reporting lines, simultaneous work and today's hazards before beginning.`,m:`New-worker education is general job safety training; new-site entrant education explains the hazards and rules of that particular site. They are not interchangeable.`,u:`You can recall the eight daily safety-cycle steps, the two education lists, key PPE and heat-illness responses.`}
];

const TOOL_ATLAS_L=[
{c:4,t:`Chapter 5 deep dive C: complete common-tool atlas by textbook category (Textbook 5.3.1-5.3.12)`,jp:`共通工具{きょうつうこうぐ}の種類{しゅるい}と用途{ようと}`,o:[`Identify the named tools shown in the textbook's common-tool sections`,`Match each tool to its correct task`,`Recognise important differences between similar electric and measuring tools`],x:`<h3>1. Electric tools (5.3.1)</h3><ul><li><b>ドリルドライバー:</b> interchangeable bits allow screw-driving and drilling; speed and torque can be adjusted.</li><li><b>インパクトドライバー:</b> adds hammering impact while driving screws; more powerful than a drill-driver for suitable fastening.</li><li><b>ディスクグラインダー:</b> replaceable abrasive/cutting disc for cutting or grinding metal pipe/concrete and removing paint. Use the correct disc and guard.</li><li><b>丸のこ:</b> straight cutting of sheet materials such as plywood; check the safety cover. Kickback can move the saw unexpectedly.</li><li><b>高速切断機:</b> rotating cutting wheel for metal pipe, rebar and light-gauge steel.</li></ul><h3>2. Dig, level and compact (5.3.2)</h3><ul><li><b>剣スコップ:</b> pointed spade; step on the upper part to dig into the ground.</li><li><b>角スコップ:</b> square/straight-edged shovel for scooping and moving soil or asphalt.</li><li><b>ランマ:</b> impact compactor; its weight and reciprocating shoe compact the ground.</li></ul><h3>3. Marking and measuring (5.3.3-5.3.4)</h3><ul><li><b>墨つぼ:</b> marks long straight lines.</li><li><b>墨さし:</b> flat end draws a line; rounded brush-like end can be used like a brush.</li><li><b>レーザー墨出し器:</b> projects horizontal/vertical reference lines onto walls, ceilings and floors. Keep laser light out of eyes and use the specified eye protection.</li><li><b>ポンチ / センターポンチ:</b> makes a small indentation/mark in metal; struck with a hammer.</li><li><b>レベル / オートレベル:</b> surveying instrument to establish heights/levels.</li><li><b>レーザーレベル:</b> laser-based levelling instrument.</li><li><b>トランシット / セオドライト:</b> measures horizontal and vertical angles.</li><li><b>水平器:</b> checks whether a surface is level using a bubble or digital display.</li><li><b>下げ振り:</b> plumb bob used to check vertical alignment.</li><li><b>メジャー / 巻尺:</b> tape measure; <b>コンベックス:</b> tape with a thin metal blade; <b>定規・定木:</b> ruler/straightedge.</li></ul><h3>4. Cut, bend and shape (5.3.5)</h3><ul><li><b>くい切り:</b> cutting tool for tiles, wire and nail heads.</li><li><b>カッターナイフ:</b> utility knife with a replaceable/break-off blade.</li><li><b>ペンチ:</b> grips, bends and cuts material.</li></ul><h3>5. Strike and pull out (5.3.6)</h3><ul><li><b>ハンマー:</b> striking tool; striking faces may be metal, rubber or wood depending on use.</li><li><b>バール:</b> lever/pry bar; its shaped end can pull nails and pry materials apart.</li></ul><h3>6. Grind, polish and drill (5.3.7)</h3><ul><li><b>砥石:</b> cuts/grinds/polishes metal or stone; a small rectangular stone can sharpen chisel/plane blades.</li><li><b>ワイヤーブラシ:</b> removes rust, paint and debris from abrasive surfaces.</li></ul><h3>7. Tighten and fasten (5.3.8)</h3><ul><li><b>モンキーレンチ:</b> adjustable open-ended wrench; adjust jaws to fit the nut/bolt and apply force correctly.</li><li><b>六角レンチ:</b> turns bolts with a hexagonal socket.</li><li><b>ドライバー:</b> choose the correct cross-head or flat-head tip and size to avoid damaging the screw head.</li></ul><h3>8. Mix, protect, clean and move (5.3.9-5.3.12)</h3><ul><li><b>コンクリートミキサ:</b> mixer designed for concrete; <b>トロ箱:</b> sturdy box/tray for mixing mortar or concrete materials.</li><li><b>飛散防止ネット:</b> mesh sheet around scaffold/building to reduce material scattering; can also help prevent loads falling from vehicle beds.</li><li><b>水平養生ネット:</b> horizontal net used to prevent people/materials falling from height.</li><li><b>ウェス:</b> cloth for wiping oil and liquid dirt; <b>バケツ:</b> bucket; <b>ひしゃく:</b> handled dipper.</li><li><b>台車:</b> four-caster trolley for moving materials; some have handles/brakes.</li><li><b>フォークリフト:</b> vehicle with hydraulically raised forks for lifting/moving loads; only trained/authorised operators use it.</li></ul><p class=n>Source: JAC textbook Chapter 5, sections 5.3.1-5.3.12, PDF pp.76-83. This is a tool-recognition lesson; actual operation requires training, correct attachments and site authorisation.</p>`,s:{jp:`工具{こうぐ}の名前{なまえ}と使{つか}い方{かた}を覚{おぼ}えます。`,ro:`Kougu no namae to tsukaikata wo oboemasu.`,en:`I learn tool names and how to use them.`,p:[[`工具{こうぐ}の`,`of tools`],[`名前{なまえ}と`,`names and`],[`使{つか}い方{かた}`,`how to use`],[`覚{おぼ}えます`,`learn / memorise`]]},p:`For every tool, say its name, its job and one inspection or safety point. Never operate a powered tool or vehicle without the required training and permission.`,m:`A drill-driver adjusts speed/torque for drilling and screw-driving; an impact driver adds impact while driving screws. A level measures height; a transit measures angles.`,u:`You can identify the named tools across the textbook's common-tool categories and match them to their purpose.`},
{c:4,t:`Chapter 5 deep dive D: lifting gear, access equipment and cleaning tools (Textbook 5.3.13-5.3.15)`,jp:`吊上{つりあ}げ・作業台{さぎょうだい}・清掃用具{せいそうようぐ}`,o:[`Identify the textbook's lifting and pulling equipment`,`Distinguish stepladders, portable work platforms and elevated work vehicles`,`Recognise basic cleaning tools and their purpose`],x:`<h3>1. Lifting, raising and pulling (5.3.13)</h3><ul><li><b>ウインチ:</b> machine that winds rope; also called a hoisting/winding machine.</li><li><b>ワイヤーロープ:</b> rope made by twisting steel wires into strands and strands into a rope; strong in tension and flexible. Processed ends may be used for slinging.</li><li><b>チェーンブロック:</b> lifting device using lever/pulley principles to raise and lower heavy objects; it may be attached to a tripod or suitable support.</li><li><b>親綱緊張器:</b> tensions a horizontal lifeline (親綱) so it is not slack; used for fall-protection arrangements in work at height.</li><li><b>ジャッキ:</b> raises heavy objects with a relatively small input force using screw, gear or hydraulic mechanisms.</li></ul><h3>2. Work platforms and ladders (5.3.14)</h3><ul><li><b>脚立:</b> folding A-frame ladder. Do not sit or stand on its top cap, and do not straddle it while working.</li><li><b>可搬式作業台:</b> portable work platform, also called のび馬; has a platform between two adjustable legs and a handrail. Leaning out or pushing a wall can make it overturn.</li><li><b>高所作業車:</b> vehicle equipped with a mechanism that raises a work basket to 2 m or higher.</li></ul><p>Use stable ground, inspect the equipment, keep within its permitted working position and follow site fall-protection rules. Do not use a ladder or platform with damaged feet, locks, rails or other defects.</p><h3>3. Cleaning (5.3.15)</h3><ul><li><b>ほうき:</b> broom for sweeping.</li><li><b>ちりとり:</b> dustpan for collecting the dirt swept up by a broom.</li></ul><h3>4. Quick equipment selection checklist</h3><ol><li>Identify the load/task and select equipment designed for it.</li><li>Check the equipment's rated capacity, condition and inspection status.</li><li>Confirm the support point, ground and work area are suitable.</li><li>Keep people away from suspended loads and moving equipment.</li><li>For elevated access, choose the safest practical platform and inspect it before use.</li><li>After work, lower/store equipment safely and clean the work area.</li></ol><p class=n>Source: JAC textbook Chapter 5, sections 5.3.13-5.3.15, PDF pp.83-84. This is identification and awareness training, not authorisation to operate lifting machinery or work platforms.</p>`,s:{jp:`脚立{きゃたつ}の天板{てんばん}に立{た}ってはいけません。`,ro:`Kyatatsu no tenban ni tatte wa ikemasen.`,en:`You must not stand on the top cap of a stepladder.`,p:[[`脚立{きゃたつ}`,`stepladder`],[`の天板{てんばん}に`,`on its top cap`],[`立{た}ってはいけません`,`must not stand`]]},p:`Choose a platform suitable for the task. Inspect it, use it on stable ground, avoid overreaching, and follow the site's rules for fall protection and authorised operators.`,m:`The textbook names a winch, wire rope, chain block, lifeline tensioner and jack; it separately names a stepladder, portable work platform and elevated work vehicle.`,u:`You can identify lifting gear, access equipment and cleaning tools from the textbook's final common-tool sections.`}
];
L.push(...TOOL_ATLAS_L);

{c:1,lv:`Beginner`,t:`Morning meeting`,jp:`毎朝{まいあさ}、朝礼{ちょうれい}があります。みんなで安全{あんぜん}を確認{かくにん}します。最後{さいご}に「今日{きょう}もご安全{あんぜん}に」と言{い}います。`,ro:`Maiasa, chourei ga arimasu. Minna de anzen wo kakunin shimasu. Saigo ni "Kyou mo goanzen ni" to iimasu.`,en:`Every morning there is a morning meeting. Everyone checks safety together. At the end they say "Stay safe today too."`,p:[[`毎朝{まいあさ}`,`every morning`],[`みんなで`,`all together`],[`最後{さいご}に`,`at the end`],[`と言{い}います`,`say (quote)`]],q:[`What do they say at the end of the meeting?`,[`今日もご安全に`,`おやすみなさい`,`いただきます`,`ごめんなさい`],0,`The passage says 「今日もご安全に」.`]},
