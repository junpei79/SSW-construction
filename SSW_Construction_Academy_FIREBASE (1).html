{c:1,lv:`Exam Practice`,t:`KY activity`,jp:`危険{きけん}予知{よち}活動{かつどう}（KY活動{かつどう}）では、作業{さぎょう}の前{まえ}に、事故{じこ}が起{お}こりそうな場面{ばめん}を考{かんが}えて、危険{きけん}を見{み}つけ、事故{じこ}を未然{みぜん}に防{ふせ}ぎます。`,ro:`Kiken yochi katsudou (KY katsudou) dewa, sagyou no mae ni, jiko ga okorisou na bamen wo kangaete, kiken wo mitsuke, jiko wo mizen ni fusegimasu.`,en:`In hazard prediction activity (KY), before work you think of scenes where an accident might happen, find the dangers, and prevent accidents before they happen.`,p:[[`起{お}こりそうな`,`likely to happen (そう = looks like)`],[`場面{ばめん}`,`scene / situation`],[`見{み}つけ`,`find (and...)`],[`未然{みぜん}に`,`before it happens`],[`防{ふせ}ぎます`,`prevent`]],q:[`未然に means:`,[`before it happens`,`after it happens`,`every day`,`by machine`],0,`未然 = not yet happened, so 未然に防ぐ = prevent beforehand.`]}
,{c:2,lv:`Beginner`,t:`Working hours`,jp:`労働基準法{ろうどうきじゅんほう}では、一日{いちにち}八時間{はちじかん}、一週間{いっしゅうかん}四十時間{よんじゅうじかん}が原則{げんそく}です。`,ro:`Roudou kijunhou dewa, ichinichi hachijikan, isshuukan yonjuu jikan ga gensoku desu.`,en:`Under the Labour Standards Act, 8 hours a day and 40 hours a week is the rule.`,p:[[`原則{げんそく}`,`in principle`],[`一日{いちにち}八時間{はちじかん}`,`8 hours a day`],[`一週間{いっしゅうかん}`,`one week`]],q:[`How many hours a week is the rule?`,[`40`,`30`,`50`,`60`],0,`一週間四十時間 = 40 hours a week.`]}
,{c:2,lv:`Intermediate`,t:`Falls and harnesses`,jp:`建設現場{けんせつげんば}の死亡事故{しぼうじこ}で一番{いちばん}多{おお}いのは、墜落{ついらく}・転落{てんらく}です。高所{こうしょ}では、フルハーネス型{がた}の器具{きぐ}を使{つか}います。`,ro:`Kensetsu genba no shibou jiko de ichiban ooi no wa, tsuiraku tenraku desu. Kousho dewa, furu haanesu gata no kigu wo tsukaimasu.`,en:`The most common deadly accident on construction sites is falling. At height, a full-harness device is used.`,p:[[`死亡事故{しぼうじこ}`,`fatal accident`],[`一番{いちばん}多{おお}いのは`,`the most common is`],[`高所{こうしょ}では`,`at heights`],[`使{つか}います`,`use`]],q:[`What causes the most deaths?`,[`墜落・転落`,`火事`,`交通事故`,`熱中症`],0,`墜落・転落 (falls) is the most common.`]}
,{c:3,lv:`Beginner`,t:`Buildings`,jp:`建物{たてもの}を作{つく}る工事{こうじ}を建築工事{けんちくこうじ}と言{い}います。木造{もくぞう}は一般住宅{いっぱんじゅうたく}に多{おお}く使{つか}われます。`,ro:`Tatemono wo tsukuru kouji wo kenchiku kouji to iimasu. Mokuzou wa ippan juutaku ni ooku tsukawaremasu.`,en:`Work that builds buildings is called kenchiku kouji. Wooden structures are often used for ordinary houses.`,p:[[`建物{たてもの}を作{つく}る`,`that builds buildings`],[`一般住宅{いっぱんじゅうたく}`,`ordinary houses`],[`多{おお}く使{つか}われます`,`are used often`]],q:[`What is 木造 often used for?`,[`Ordinary houses`,`Dams`,`Roads`,`Bridges only`],0,`木造は一般住宅に多く使われます。`]}
,{c:3,lv:`Exam Practice`,t:`Formwork and shoring`,jp:`型枠{かたわく}の中{なか}にコンクリートを流{なが}し込{こ}むので、型枠{かたわく}には内側{うちがわ}から大{おお}きな圧力{あつりょく}が加{くわ}わります。そのため、外側{そとがわ}から支保工{しほこう}で支{ささ}えます。`,ro:`Katawaku no naka ni konkuriito wo nagashikomu node, katawaku ni wa uchigawa kara ookina atsuryoku ga kuwawarimasu. Sono tame, sotogawa kara shihokou de sasaemasu.`,en:`Because concrete is poured into the formwork, large pressure acts on it from inside. For that reason, it is supported from outside with shoring.`,p:[[`流{なが}し込{こ}むので`,`because (we) pour in`],[`内側{うちがわ}から`,`from the inside`],[`圧力{あつりょく}が加{くわ}わります`,`pressure is applied`],[`そのため`,`for that reason`],[`支{ささ}えます`,`supports`]],q:[`What supports the formwork from outside?`,[`支保工`,`杭`,`墨出し`,`ゼネコン`],0,`外側から支保工で支えます。`]}

,{c:4,lv:`Exam Practice`,t:`Hourensou`,jp:`報告{ほうこく}・連絡{れんらく}・相談{そうだん}を「ほうれんそう」と言{い}います。結論{けつろん}を先{さき}に言{い}って、分{わ}かりやすく話{はな}しましょう。`,ro:`Houkoku, renraku, soudan wo "hourensou" to iimasu. Ketsuron wo saki ni itte, wakariyasuku hanashimashou.`,en:`Report, contact and consult are called "hourensou". Say the conclusion first and speak clearly.`,p:[[`報告{ほうこく}・連絡{れんらく}・相談{そうだん}`,`report, contact, consult`],[`結論{けつろん}を先{さき}に`,`the conclusion first`],[`分{わ}かりやすく`,`so it is easy to understand`],[`話{はな}しましょう`,`let us speak`]],q:[`What should you say first?`,[`The conclusion`,`The weather`,`A joke`,`Your name only`],0,`結論を先に言います。`]}
,{c:2,lv:`Intermediate`,t:`Aviation law`,jp:`高{たか}さ六十{ろくじゅう}メートル以上{いじょう}の建物{たてもの}には、航空障害灯{こうくうしょうがいとう}を付{つ}けなければなりません。`,ro:`Takasa rokujuu meetoru ijou no tatemono ni wa, koukuu shougai tou wo tsukenakereba narimasen.`,en:`Buildings 60 m or higher must have aviation obstruction lights.`,p:[[`高{たか}さ六十{ろくじゅう}メートル以上{いじょう}`,`height of 60 m or more`],[`航空障害灯{こうくうしょうがいとう}を`,`aviation obstruction lights (object)`],[`付{つ}けなければなりません`,`must attach`]],q:[`From what height are lights needed?`,[`60 m`,`6 m`,`6 km`,`1 m`],0,`高さ六十メートル以上.`]}
,{c:3,lv:`Intermediate`,t:`Waterproofing`,jp:`防水工事{ぼうすいこうじ}は、雨水{あまみず}や雪{ゆき}が建物{たてもの}の中{なか}に入{はい}らないようにする工事{こうじ}です。ウレタン防水{ぼうすい}は、液体{えきたい}の防水材{ぼうすいざい}を塗{ぬ}ります。`,ro:`Bousui kouji wa, amamizu ya yuki ga tatemono no naka ni hairanai you ni suru kouji desu. Uretan bousui wa, ekitai no bousuizai wo nurimasu.`,en:`Waterproofing keeps rain and snow from entering a building. Urethane waterproofing applies a liquid waterproofing material.`,p:[[`入{はい}らないようにする`,`so that (it) does not enter`],[`液体{えきたい}の`,`liquid`],[`塗{ぬ}ります`,`apply (paint/coat)`]],q:[`What does waterproofing keep out?`,[`Rain and snow`,`Sound`,`Light`,`Workers`],0,`雨水や雪.`]}
,{c:4,lv:`Exam Practice`,t:`Leakage and earthing`,jp:`漏電{ろうでん}とは、電気{でんき}が流{なが}れてはいけない所{ところ}に流{なが}れることです。アースを付{つ}けると、感電{かんでん}を防{ふせ}ぐことができます。`,ro:`Rouden to wa, denki ga nagarete wa ikenai tokoro ni nagareru koto desu. Aasu wo tsukeru to, kanden wo fusegu koto ga dekimasu.`,en:`Leakage means electricity flows where it must not. With an earth wire, you can prevent electric shock.`,p:[[`流{なが}れてはいけない所{ところ}`,`a place where it must not flow`],[`アースを付{つ}けると`,`if you attach an earth`],[`防{ふせ}ぐことができます`,`can prevent`]],q:[`What can an earth wire prevent?`,[`Electric shock`,`Rain`,`Noise`,`Dust`],0,`感電を防ぐ.`]}
,{c:1,lv:`Intermediate`,t:`Greeting and the Career-Up card`,jp:`建設{けんせつ}キャリアアップシステムでは、就業日数{しゅうぎょうにっすう}と資格{しかく}を登録{とうろく}します。レベルは四つ{よっつ}です。新{あたら}しい人{ひと}はレベル1から始{はじ}めます。また、通路{つうろ}で会{あ}う人{ひと}にあいさつをすると、一体感{いったいかん}が生{う}まれます。`,ro:`Kensetsu kyaria appu shisutemu dewa, shuugyou nissuu to shikaku wo touroku shimasu. Reberu wa yottsu desu. Atarashii hito wa reberu ichi kara hajimemasu. Mata, tsuuro de au hito ni aisatsu wo suru to, ittaikan ga umaremasu.`,en:`In the Construction Career-Up System you register days worked and qualifications. There are four levels. New people start from Level 1. Also, greeting people you meet in a corridor creates a sense of unity.`,p:[[`就業日数{しゅうぎょうにっすう}`,`days worked`],[`資格{しかく}`,`qualification`],[`レベル1から始{はじ}めます`,`start from Level 1`],[`通路{つうろ}`,`passage / corridor`],[`一体感{いったいかん}が生{う}まれます`,`a sense of unity is born`]],q:[`Which level does a new worker start from?`,[`Level 1`,`Level 2`,`Level 3`,`Level 4`],0,`新しい人はレベル1から始めます。`],x:[[`What creates a sense of unity?`,[`Greeting people`,`Working overtime`,`Wearing a helmet`,`Paying wages`],0,`あいさつをすると、一体感が生まれます。`]]}
,{c:2,lv:`Intermediate`,t:`Paid leave and the stress check`,jp:`六か月{ろっかげつ}続{つづ}けて働{はたら}き、全労働日{ぜんろうどうび}の八割以上{はちわりいじょう}出勤{しゅっきん}すると、十日{とおか}の年次有給休暇{ねんじゆうきゅうきゅうか}がもらえます。また、働{はたら}く人{ひと}が五十人以上{ごじゅうにんいじょう}の職場{しょくば}では、年{ねん}に一回{いっかい}ストレスチェックがあります。`,ro:`Rokkagetsu tsuzukete hataraki, zen roudoubi no hachiwari ijou shukkin suru to, tooka no nenji yuukyuu kyuuka ga moraemasu. Mata, hataraku hito ga gojuunin ijou no shokuba dewa, nen ni ikkai sutoresu chekku ga arimasu.`,en:`If you work continuously for six months and attend at least 80% of working days, you receive 10 days of annual paid leave. Also, in workplaces with 50 or more people, there is a stress check once a year.`,p:[[`六か月{ろっかげつ}続{つづ}けて`,`continuing for six months`],[`八割以上{はちわりいじょう}出勤{しゅっきん}`,`attending 80% or more`],[`十日{とおか}`,`ten days`],[`五十人以上{ごじゅうにんいじょう}`,`50 people or more`],[`年{ねん}に一回{いっかい}`,`once a year`]],q:[`How many days of paid leave do you first receive?`,[`10 days`,`6 days`,`20 days`,`30 days`],0,`十日の年次有給休暇がもらえます。`],x:[[`How often is the stress check?`,[`Once a year`,`Every month`,`Every day`,`Only at hiring`],0,`年に一回ストレスチェックがあります。`]]}
,{c:3,lv:`Exam Practice`,t:`How a road is built (paving)`,jp:`道路{どうろ}は下{した}から、路床{ろしょう}、路盤{ろばん}、基層{きそう}、表層{ひょうそう}の順{じゅん}に作{つく}ります。路盤{ろばん}は重機{じゅうき}でしっかり締{し}め固{かた}めます。表層{ひょうそう}は車{くるま}が走{はし}る一番上{いちばんうえ}の面{めん}です。`,ro:`Douro wa shita kara, roshou, roban, kisou, hyousou no jun ni tsukurimasu. Roban wa juuki de shikkari shimekatamemasu. Hyousou wa kuruma ga hashiru ichiban ue no men desu.`,en:`A road is built from the bottom in the order subgrade, roadbed, base course, surface course. The roadbed is firmly compacted with heavy machines. The surface course is the top layer where cars run.`,p:[[`下{した}から`,`from the bottom`],[`順{じゅん}に`,`in order`],[`重機{じゅうき}`,`heavy machinery`],[`締{し}め固{かた}めます`,`compact firmly`],[`一番上{いちばんうえ}`,`the very top`]],q:[`Which layer is on the very top?`,[`表層`,`路床`,`路盤`,`基層`],0,`表層は一番上の面です。`],x:[[`What is compacted with heavy machines?`,[`路盤`,`表層`,`植栽`,`岸壁`],0,`路盤は重機でしっかり締め固めます。`]]}
,{c:5,lv:`Beginner`,t:`Tools by job`,jp:`墨{すみ}つぼで線{せん}を引{ひ}きます。水平器{すいへいき}で水平{すいへい}を見{み}ます。丸{まる}のこで木{き}を切{き}ります。丸{まる}のこを使{つか}うとき、手袋{てぶくろ}はしません。`,ro:`Sumitsubo de sen wo hikimasu. Suiheiki de suihei wo mimasu. Maru noko de ki wo kirimasu. Maru noko wo tsukau toki, tebukuro wa shimasen.`,en:`I draw a line with the ink pot. I check level with a spirit level. I cut wood with a circular saw. When using the circular saw, I do not wear gloves.`,p:[[`墨{すみ}つぼ`,`ink line pot`],[`水平器{すいへいき}`,`spirit level`],[`切{き}ります`,`cut`],[`手袋{てぶくろ}はしません`,`do not wear gloves`]],q:[`What do you NOT wear with a circular saw?`,[`手袋`,`ヘルメット`,`安全靴`,`メガネ`],0,`丸のこを使うとき、手袋はしません。`],x:[[`What tool checks level?`,[`水平器`,`墨つぼ`,`丸のこ`,`脚立`],0,`水平器で水平を見ます。`]]}
,{c:6,lv:`Intermediate`,t:`Planning with 5M and QCDSE`,jp:`施工計画{せこうけいかく}では、人{ひと}、材料{ざいりょう}、方法{ほうほう}、機械{きかい}、資金{しきん}を考{かんが}えます。工事{こうじ}は品質{ひんしつ}、費用{ひよう}、工期{こうき}、安全{あんぜん}、環境{かんきょう}の五{いつ}つを管理{かんり}します。`,ro:`Sekou keikaku dewa, hito, zairyou, houhou, kikai, shikin wo kangaemasu. Kouji wa hinshitsu, hiyou, kouki, anzen, kankyou no itsutsu wo kanri shimasu.`,en:`In the construction plan you think about people, materials, methods, machines and money. Work manages five things: quality, cost, schedule, safety and environment.`,p:[[`施工計画{せこうけいかく}`,`construction plan`],[`資金{しきん}`,`funds (money)`],[`工期{こうき}`,`construction period`],[`五{いつ}つ`,`five things`]],q:[`How many things are managed in QCDSE?`,[`Five`,`Three`,`Seven`,`Ten`],0,`Quality, cost, schedule, safety and environment: five.`],x:[[`Which is one of the 5M?`,[`資金 (money)`,`天気 (weather)`,`写真 (photo)`,`名前 (name)`],0,`人・材料・方法・機械・資金 are the 5M.`]]}
,{c:7,lv:`Exam Practice`,t:`New entrants and the first week`,jp:`建設現場{けんせつげんば}の死亡災害{しぼうさいがい}の半数近{はんすうちか}くは、入場{にゅうじょう}から一週間以内{いっしゅうかんいない}に起{お}こります。だから、新規入場者{しんきにゅうじょうしゃ}は作業{さぎょう}の前{まえ}に教育{きょういく}を受{う}けます。危険{きけん}な場所{ばしょ}や避難{ひなん}の方法{ほうほう}を必{かなら}ず確認{かくにん}しましょう。`,ro:`Kensetsu genba no shibou saigai no hansuu chikaku wa, nyuujou kara isshuukan inai ni okorimasu. Dakara, shinki nyuujousha wa sagyou no mae ni kyouiku wo ukemasu. Kiken na basho ya hinan no houhou wo kanarazu kakunin shimashou.`,en:`Nearly half of the fatal accidents on construction sites happen within a week of entering. So new entrants receive training before work. Be sure to check the dangerous places and the way to evacuate.`,p:[[`半数近{はんすうちか}く`,`nearly half`],[`一週間以内{いっしゅうかんいない}`,`within one week`],[`避難{ひなん}の方法{ほうほう}`,`evacuation method`],[`必{かなら}ず`,`without fail`]],q:[`When do many fatal accidents happen?`,[`Within the first week`,`After one year`,`Only in winter`,`At night only`],0,`入場から一週間以内に起こります。`],x:[[`What must new entrants check?`,[`Danger places and evacuation`,`Lunch menu`,`Pay day`,`Holiday dates`],0,`危険な場所や避難の方法を確認します。`]]}
];
const RQ=RD.flatMap((p,i)=>[p.q,...(p.x||[])].map((q,k)=>({id:'r'+i+(k?'_'+k:''),pi:i,t:'reading',q:q[0],o:q[1],a:q[2],e:q[3]})));
const VQ=V.flatMap((v,i)=>{const w=shuf(V.filter((_,j)=>j!==i)).slice(0,3),e=`${v[0]} (${v[1]}, ${v[2]}) = ${v[3]}. Trick: ${v[7]}`;return[{id:'va'+i,t:'vocab',q:`What does <b>${v[0]}</b> (${v[1]}) mean?`,o:[v[3],...w.map(x=>x[3])],a:0,e},{id:'vb'+i,t:'vocab',q:`Which Japanese word means "<b>${v[3]}</b>"?`,o:[v[0],...w.map(x=>x[0])],a:0,e}]});
const ALL=[...QS,...RQ,...VQ];
const CH=[[`日本の現場で大切にしていること`,`What Japanese sites value (teamwork, CCUS, greetings, 朝礼)`,`Lessons 1-3 + 21 supplement (CCUS details and safety communication)`],[`日本の現場で働く上で守らなければならない法令`,`Laws to follow (labour law, Construction Business Act, Building Standards Act, waste, fire...)`,`Lessons 4-6, 12-13, 22, 39-40 (employment conditions, insurance, construction and environmental laws).`],[`建設工事の種類と業務`,`Types of construction and trades (civil, building, lifeline; 38 specialist trades; qualifications)`,`Lessons 7-8, 14-18, 23, 41 (38 trades and practical work scopes).`],[`建設現場で使われるあいさつ・用語・共同生活上の注意`,`Site greetings, terms (marking, formwork, rebar, scaffolds...), 5S, shared living`,`Lessons 9-11, 19-20, 24, 42 (setting-out, levels, foundations and technical terms).`]];

const TN=t=>isNaN(t)?(t==='vocab'?'Vocabulary':'Reading'):'Lesson '+t;

let TM,Q=null,VS={q:'',ch:'all',i:0,f:0,m:'all'},UI={};
const nav=h=>location.hash==='#'+h?go():location.hash=h;
const nd=()=>Object.keys(S.done).filter(k=>S.done[k]).length;
const streak=()=>{let d=ld(),n=0;if(!S.act[d]&&!S.days[d])d=ad(d,-1);while(S.act[d]||S.days[d]){n++;d=ad(d,-1)}return n};
const dueV=()=>V.map((_,i)=>i).filter(i=>S.v[i]&&S.v[i].d<=ld()&&(S.v[i].w>0||S.v[i].b<2||S.v[i].d<=ld()));
const weak=()=>{const m={};Object.values(S.wrong).forEach(w=>m[w.t]=(m[w.t]||0)+w.n);return Object.entries(m).sort((a,b)=>b[1]-a[1])};
const bar=p=>`<div class=bar><i style="width:${p}%"></i></div>`;

const VW={};
VW.dash=()=>{const p=Math.round(nd()/L.length*100),lq=S.quiz[S.quiz.length-1],w=weak(),min=S.days[ld()]||0,kn=Object.values(S.v).filter(x=>x.b>=1).length,nx=L.findIndex((_,i)=>!S.done[i+1]);
return `<h1>SSW Construction Academy</h1><p>Building-related construction (建築) study for beginners.</p><p class="n cs">${cst()}</p>
<div class=c><b>Progress: ${p}%</b> of built lessons ${bar(p)}</div>
<div class=g><div class=c>Lessons done<div class=big>${nd()}/${L.length}</div>${L.length-nd()} remaining</div><div class=c>Streak<div class=big>${streak()}</div>days</div><div class=c>Today<div class=big>${min}/60</div>minutes</div><div class=c>Vocabulary learned<div class=big>${kn}/${V.length}</div></div><div class=c>Latest quiz<div class=big>${lq?Math.round(lq.c/lq.n*100)+'%':'-'}</div>${lq?lq.t:'none yet'}</div></div>
<div class=c><h3>Today's recommended lesson</h3>${nx<0?'All built lessons done. Do a daily revision or a mock test.':`<a href="#lesson-${nx+1}">Lesson ${nx+1}: ${L[nx].t}</a>`}</div>
<div class=c><h3>Weak topics</h3>${w.length?w.slice(0,3).map(x=>`${TN(x[0])} (${x[1]} mistakes)`).join('<br>'):'None yet. Take a quiz to find them.'}</div>
<button class=pri onclick="nav('${nx<0?'rev':'lesson-'+(nx+1)}')">Continue Learning</button><button onclick="nav('rev')">Daily Revision</button><button class=red onclick="nav('mock')">Start Mock Test</button>`};
VW.course=()=>`<h1>Course</h1><div class="c warn"><b>Source and coverage note.</b> This course has been checked against all 120 pages of the uploaded JAC 建築 textbook (Chapters 1-7) and now contains 50 structured lessons, 642 vocabulary entries, 206 lesson quiz questions and 18 reading passages. Lessons are beginner-friendly teaching adaptations, not a verbatim translation of every sentence or image. New deep-dive lessons expand employment/labour laws (39-40), specialist trade scopes (41), setting-out terminology (42), common tools and lifting/access equipment (43-44, 49-50), construction planning and trade sequences (45-46), and accident prevention, the full daily safety cycle, worker education, PPE and heat illness (47-48). Questions are original practice questions, NOT official past questions. Historical textbook statistics and legal/safety rules are labelled; current requirements may differ. Follow current official guidance, approved project documents and site instructions. Check <a href="https://jac-skill.or.jp/exam/" target=_blank rel=noopener>jac-skill.or.jp/exam</a> for official exam information.</div>
${CH.map((c,i)=>`<div class=c><h3>Chapter ${i+1}: ${c[0]}</h3><p>${c[1]}</p>${L.map((l,j)=>(l.c||0)==i?`<p><a href="#lesson-${j+1}">Lesson ${j+1}: ${l.t}</a> ${S.done[j+1]?'✅':''}</p>`:'').join('')}${L.some(l=>(l.c||0)==i)?'':'<p class=n>Not built yet. Add lessons to the L array.</p>'}${i==1?`<p class=n>${c[2]}</p>`:''}</div>`).join('')}`;
function lesson(n){const l=L[n-1];if(!l)return '<p>Lesson not found.</p>';const ids=V.map((_,i)=>i).filter(i=>V[i][8]==n),s=l.s;
return `<a href="#course">← Course</a><h1>Lesson ${n}</h1><p class=jp>${r(l.jp)}</p><h2>${l.t}</h2>
<div class=c><h3>1. Learning objectives</h3><ul>${l.o.map(x=>`<li>${x}</li>`).join('')}</ul></div>
<div class=c><h3>2. Explanation</h3>${l.x}</div>
<div class=c><h3>3. Vocabulary (kanji, reading, romaji, meaning)</h3><div class=tbl><table>${ids.map(vrow).join('')}</table></div></div>
<div class=c><h3>4. Sentence breakdown</h3><p class=jp>${r(s.jp)}</p><p class=ro>${s.ro}</p><p>${s.en}</p><table>${s.p.map(x=>`<tr><td class=jp>${r(x[0])}</td><td>${x[1]}</td></tr>`).join('')}</table></div>
<div class=c><h3>5. Practical example</h3>${l.p}</div>
<div class=c><h3>6. Notes and memory tricks</h3><ul><li>${l.m}</li>${ids.slice(0,14).map(i=>`<li>${V[i][0]}: ${V[i][7]}</li>`).join('')}</ul></div>
<div class=c><h3>7. Summary</h3>${l.u}</div>
<button class=pri onclick="startQuiz(QS.filter(q=>q.t==${n}),'Lesson ${n} practice')">Practice questions (${QS.filter(q=>q.t==n).length})</button>
<button onclick="S.done[${n}]=!S.done[${n}];act();save();go()">${S.done[n]?'✅ Completed (tap to undo)':'Mark as completed'}</button>`}
const items=[[`Vocabulary revision`,10],[`New construction concepts`,20],[`Japanese reading and terminology`,15],[`Quiz and error review`,15]];
function plan(){const p=[];L.forEach((l,i)=>{p.push({t:`Lesson ${i+1}: ${l.t.replace(/ \(.*/,'')}`,h:'lesson-'+(i+1),ok:S.done[i+1]});if((i+1)%3==0||i==L.length-1)p.push({t:`Revision day + chapter review (lessons 1-${i+1})`,h:'quiz',ok:L.slice(0,i+1).every((_,j)=>S.done[j+1])&&!weak().length});});p.push({t:`Final revision phase: weak topics + Practice Mock Test`,h:'mock'});return p}
VW.daily=()=>{const c=S.chk[ld()]||[],nx=L.findIndex((_,i)=>!S.done[i+1]),w=weak()[0];
return `<h1>Daily Learning</h1><div class=c><h3>Today's 60-minute checklist</h3>${items.map((x,i)=>`<label style="display:block;padding:6px 0"><input type=checkbox ${c[i]?'checked':''} onchange="chk(${i})"> ${x[0]} (${x[1]} min)</label>`).join('')}<b>${S.days[ld()]||0}/60 minutes</b></div>
<div class=c><h3>Recommendations</h3><p>New concept: ${nx<0?'all built lessons done':`<a href="#lesson-${nx+1}">Lesson ${nx+1}</a>`}</p><p>Vocabulary due: ${dueV().length} <a href="#rev">(revise)</a></p><p>${w?`Weakest area: ${TN(w[0])}. Re-do its quiz.`:'No weak area recorded yet.'}</p></div>
<div class=c><h3>Day-by-day plan</h3>${plan().map((x,i)=>`<p>Day ${i+1}: <a href="#${x.h}">${x.t}</a> ${x.ok?'✅':''}</p>`).join('')}<p class=n>The plan grows as you add lessons. No pass date is promised; follow your quiz results.</p></div>`};
function chk(i){const d=ld();S.chk[d]=S.chk[d]||[];S.chk[d][i]=!S.chk[d][i];S.days[d]=items.reduce((a,x,j)=>a+(S.chk[d][j]?x[1]:0),0);act();go()}
// vocab
const vlist=()=>{const q=VS.q.toLowerCase();return(VS.m=='rev'?dueV():V.map((_,i)=>i)).filter(i=>(VS.ch=='all'||V[i][8]==VS.ch)&&(!q||V[i].slice(0,4).join(' ').toLowerCase().includes(q)))};
VW.vocab=()=>`<h1>Vocabulary</h1><p>Today: <b>${S.vd[ld()]||0}/10</b> words (daily goal)</p><div class=row><input id=vs placeholder="Search Japanese or English" value="${VS.q}" oninput="VS.q=this.value;VS.i=0;vcard()"><select onchange="VS.ch=this.value;VS.i=0;vcard()"><option value=all>All lessons</option>${L.map((_,i)=>`<option value=${i+1} ${VS.ch==i+1?'selected':''}>Lesson ${i+1}</option>`).join('')}</select><select onchange="VS.m=this.value;VS.i=0;vcard()"><option value=all>All words</option><option value=rev ${VS.m=='rev'?'selected':''}>Revision (due/forgotten)</option></select></div><div id=card></div>`;
function vcard(){const l=vlist(),e=$('#card');if(!e)return;if(!l.length){e.innerHTML=`<div class=c>No words match${VS.m=='rev'?' (nothing due: mark some cards first)':''}.</div>`;return}
VS.i=(VS.i+l.length)%l.length;const i=l[VS.i],v=V[i],s=S.v[i];
e.innerHTML=`<p class=n>Card ${VS.i+1}/${l.length}${s?' · box '+s.b+'/4':''}</p><div class="c card" onclick="VS.f=!VS.f;vcard()">${VS.f?`<div class=jp>${v[1]}</div><div class=ro>${v[2]}</div><h2>${v[3]}</h2>${v[4]?`<p class=jp>${r(v[4])}</p><p class=ro>${v[5]}</p><p>${v[6]}</p>${BD[v[0]]?`<div class=tbl style="text-align:left"><table>${BD[v[0]].map(t=>`<tr><td class=jp>${r(t[0])}</td><td class=ro>${t[1]}</td><td>${t[2]||WM[t[0].replace(/\{[^}]*\}/g,'')]||''}</td></tr>`).join('')}</table></div>`:''}`:''}<p class=n>💡 ${v[7]}</p>`:`<div class=k>${v[0]}</div><p class=n>Tap to flip</p>`}</div><button onclick="vn(-1)">← Prev</button><button onclick="vn(1)">Next →</button><button class=pri onclick="vm(${i},1)">✔ Known</button><button class=red onclick="vm(${i},0)">✘ Needs practice</button>`}
function vn(d){VS.i+=d;VS.f=0;vcard()}
function vm(i,k){const s=S.v[i]||{b:0,w:0,d:ld()};if(k){s.b=Math.min(4,s.b+1);s.d=ad(ld(),[0,1,2,4,8][s.b])}else{s.b=0;s.w++;s.d=ld()}S.v[i]=s;S.vd[ld()]=(S.vd[ld()]||0)+1;act();VS.f=0;VS.i++;go();vcard()}

const plain=s=>String(s).replace(/\{[^}]*\}/g,'');
function say(i){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(plain(RD[i].jp));u.lang='ja-JP';u.rate=.75;speechSynthesis.speak(u)}catch(e){}}
function mark(i){S.rd[i]=1;act();go()}
function passage(i){const p=RD[i];if(!p)return '<p>Not found.</p>';const ss=p.jp.split(/(?<=。)/).filter(x=>x.trim());return `<a href="#read">← Reading</a><h1>${p.t} <small>(${p.lv})</small></h1><div class=c><p class=n>Step 1: read each line slowly. Step 2: listen. Step 3: check meanings.</p>${ss.map(x=>`<p class=jp style="line-height:2.6;margin:.5em 0">${r(x)}</p>`).join('')}<button onclick="say(${i})">🔊 Listen</button><button onclick="UI.ro=!UI.ro;go()">${UI.ro?'Hide':'Show'} romaji</button><button onclick="UI.en=!UI.en;go()">${UI.en?'Hide':'Show'} English</button>${UI.ro?`<p class=ro style="display:block">${p.ro}</p>`:''}${UI.en?`<p>${p.en}</p>`:''}</div><div class=c><h3>Key parts</h3><table>${p.p.map(x=>`<tr><td class=jp>${r(x[0])}</td><td>${x[1]}</td></tr>`).join('')}</table></div><button class=pri onclick="startQuiz(RQ.filter(x=>x.pi==${i}),'Reading: ${p.t}')">Questions (${1+(p.x||[]).length})</button><button onclick="mark(${i})">${S.rd[i]?'✅ Read':'Mark as read'}</button>${i>0?`<a href="#read-${i-1}">← Previous</a> `:''}${i<RD.length-1?`<a href="#read-${i+1}">Next →</a>`:''}`}
// quiz
function prep(q){const s=shuf(q.o.map((t,i)=>[t,i==q.a]));return{...q,o:s.map(x=>x[0]),a:s.findIndex(x=>x[1])}}
function startQuiz(l,t,timed){if(!l.length)return alert('No questions');Q={list:shuf(l).map(prep),title:t,timed,i:0,a:[],end:Date.now()+1500000};nav('quiz')}
VW.quiz=()=>Q?(Q.done?res():qv()):`<h1>Quizzes</h1><p>Instant feedback and explanations. Questions come from the lessons, vocabulary and reading passages.</p>${L.map((_,i)=>`<button onclick="startQuiz(QS.filter(q=>q.t==${i+1}),'Lesson ${i+1} quiz')">Lesson ${i+1}</button>`).join('')}<br><button onclick="startQuiz(ALL.filter(q=>q.id[0]=='v'&&q.id[1]=='a').slice(0,15),'Vocabulary: Japanese to English')">Japanese → English</button><button onclick="startQuiz(ALL.filter(q=>q.id[0]=='v'&&q.id[1]=='b').slice(0,15),'Vocabulary: English to Japanese')">English → Japanese</button><button onclick="startQuiz(RQ,'Reading comprehension')">Reading</button><button class=pri onclick="startQuiz(shuf(ALL).slice(0,15),'Mixed quiz')">Mixed (15)</button>`;
function qv(){const q=Q.list[Q.i],a=Q.a[Q.i],fb=a!=null&&!Q.timed;return `<h2>${Q.title}</h2>${bar(Q.i/Q.list.length*100)}<p>Question ${Q.i+1}/${Q.list.length} <b id=tm></b></p><p class=jp>${r(q.q)}</p>${q.o.map((o,k)=>`<button class="op ${fb?(k==q.a?'ok':k==a?'bad':''):a==k?'sel':''}" ${fb?'disabled':''} onclick="pick(${k})">${r(o)}</button>`).join('')}${fb?`<div class=c><b>${a==q.a?'✔ Correct':'✘ Not quite'}</b><br>${r(q.e)}</div>`:''}${a!=null?`<button class=pri onclick="nq()">${Q.i+1<Q.list.length?'Next':'Finish'}</button>`:''}`}
function pick(k){if(Q.a[Q.i]!=null&&!Q.timed)return;Q.a[Q.i]=k;$('#main').innerHTML=qv();tick()}
function nq(){Q.i++;if(Q.i>=Q.list.length)fin();else{$('#main').innerHTML=qv();tick()}}
function tick(){if(!Q||!Q.timed||Q.done)return;const s=Math.max(0,Math.round((Q.end-Date.now())/1000)),e=$('#tm');if(e)e.textContent='⏱ '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0');if(!s)fin()}
function fin(){clearInterval(TM);Q.done=1;let c=0;Q.list.forEach((q,i)=>{const w=S.wrong[q.id];if(Q.a[i]===q.a){c++;if(w&&--w.n<=0)delete S.wrong[q.id]}else S.wrong[q.id]={n:(w?w.n:0)+1,t:q.t}});Q.c=c;S.quiz.push({d:ld(),n:Q.list.length,c,t:Q.title});act();save();$('#main').innerHTML=res()}
function res(){const bt={};Q.list.forEach((q,i)=>{bt[q.t]=bt[q.t]||[0,0];bt[q.t][1]++;if(Q.a[i]===q.a)bt[q.t][0]++});const bad=Q.list.map((q,i)=>[q,i]).filter(x=>Q.a[x[1]]!==x[0].a);
return `<h1>Results: ${Q.c}/${Q.list.length} (${Math.round(Q.c/Q.list.length*100)}%)</h1><div class=c><h3>By topic</h3>${Object.entries(bt).map(([t,x])=>`${TN(t)}: ${x[0]}/${x[1]}`).join('<br>')}</div><h3>Review mistakes (${bad.length})</h3>${bad.map(([q,i])=>`<div class=c><p class=jp>${r(q.q)}</p>Your answer: ${Q.a[i]==null?'(none)':r(q.o[Q.a[i]])}<br>Correct: <b>${r(q.o[q.a])}</b><br>${r(q.e)}</div>`).join('')||'<p>No mistakes. 🎉</p>'}${bad.length?`<button class=pri onclick="startQuiz(Q.list.filter((q,i)=>Q.a[i]!==q.a),'Retry incorrect')">Retry incorrect answers</button>`:''}<button onclick="Q=null;go()">Back to quizzes</button>`}
VW.mock=()=>`<h1>Practice Mock Test</h1><div class="c warn">This is NOT the official exam. I could not verify the official question count, time or pass mark, so this is my own 20-question, 25-minute practice format. JAC's own 2023-2024 exam notices (PDF) confirm: a written (学科) plus practical (実技) test, one category only (土木 / 建築 / ライフライン・設備), and for SSW No.1 you also need JFT-Basic or JLPT N4+. A third-party site (not JAC) reports the written part as 30 questions in 60 minutes, true/false and 2-4 choice, CBT, 65% to pass. I could not confirm those numbers on a JAC page, so check JAC / Prometric before relying on them.</div><p>No explanations until you finish. Each test is newly randomised.</p><button class=red onclick="startQuiz(shuf(ALL).slice(0,20),'Practice Mock Test',1)">Start Practice Mock Test</button>`;
VW.rev=()=>{const d=dueV().length,w=Object.keys(S.wrong);return `<h1>Revision Center</h1><div class=c><h3>Vocabulary due</h3>${d} words (forgotten words come back sooner: 0, 1, 2, 4, 8 days)<br><button class=pri onclick="VS.m='rev';VS.i=0;nav('vocab')">Revise vocabulary</button></div><div class=c><h3>Questions you got wrong</h3>${w.length} questions<br><button class=pri onclick="startQuiz(ALL.filter(q=>S.wrong[q.id]),'Mistake revision')">Retry my mistakes</button></div><div class=c><h3>Weak topics</h3>${weak().map(x=>`${TN(x[0])}: ${x[1]}`).join('<br>')||'None yet'}</div>`};
VW.prog=()=>{const kn=Object.values(S.v);return `<h1>Progress Report</h1><div class=g><div class=c>Lessons<div class=big>${nd()}/${L.length}</div></div><div class=c>Study sessions<div class=big>${Object.values(S.act).reduce((a,b)=>a+b,0)}</div></div><div class=c>Streak<div class=big>${streak()}</div></div><div class=c>Mastered words<div class=big>${kn.filter(x=>x.b>=3).length}</div>of ${V.length}</div><div class=c>Open mistakes<div class=big>${Object.keys(S.wrong).length}</div></div></div><div class=c><h3>Weak chapters/topics</h3>${weak().map(x=>`${TN(x[0])}: ${x[1]}`).join('<br>')||'None'}</div><div class=c><h3>Quiz history</h3><div class=tbl><table>${S.quiz.slice(-15).reverse().map(q=>`<tr><td>${q.d}</td><td>${q.t}</td><td>${q.c}/${q.n}</td></tr>`).join('')||'<tr><td>No quizzes yet</td></tr>'}</table></div></div>`};
VW.set=()=>`<h1>Settings</h1><div class=c><h3>Account and cloud auto-save</h3><p class=cs>${cst()}</p><p>Signed in as: <b id=cloudEmail>${AUTH?.email||'Not signed in'}</b></p><p class=n>Your progress is saved to your Firebase Firestore account after changes and restored when you sign in on another device.</p><div class=auth-tools><button onclick="FA?.signOut()">Sign out</button><button onclick="push()">Sync now</button></div></div><div class=c><label><input type=checkbox ${S.furi?'checked':''} onchange="S.furi=this.checked;save();ap()"> Show furigana</label><br><label><input type=checkbox ${S.rom?'checked':''} onchange="S.rom=this.checked;save();ap()"> Show romaji</label></div><div class=c><h3>Export / import progress</h3><p class=n>Progress is saved to your Firebase account when signed in, with a local browser backup. Export a copy before making major changes.</p><button onclick="$('#ex').value=JSON.stringify(S)">Show export</button><button onclick="imp()">Import</button><br><textarea id=ex rows=5 style="width:100%"></textarea></div><div class=c><h3>Reset</h3><button class=red onclick="if(UI.rs){S=null;localStorage.removeItem('ssw1');location.reload()}else{UI.rs=1;this.textContent='Tap again to erase all progress'}">Reset progress</button></div><div class=c><h3>About</h3><p>Content lives in the V, L, QS and RD arrays at the top of the script, so lessons are easy to add. Sources: JAC textbook (建築) Ver.20220908, jac-skill.or.jp. Uses Firebase Authentication and Cloud Firestore; internet is required for account login and cloud synchronisation.</p></div>`;
function imp(){try{const o=JSON.parse($('#ex').value);if(!o.done||!o.v)throw 0;S=Object.assign(S,o);save();alert('Imported');go()}catch(e){alert('That text is not valid exported progress.')}}
function ap(){document.body.classList.toggle('nf',!S.furi);document.body.classList.toggle('nr',!S.rom)}
function go(){clearInterval(TM);const h=location.hash.slice(1)||'dash',m=h.match(/^lesson-(\d+)$/),rd=h.match(/^read-(\d+)$/),k=m?'course':rd?'read':h;ap();
$('#nav').innerHTML=R.map(x=>`<a href="#${x[0]}" class="${x[0]==k?'on':''}"><span>${x[2]}</span>${x[1]}</a>`).join('');
let out;try{out=m?lesson(+m[1]):rd?passage(+rd[1]):(VW[h]||VW.dash)()}catch(e){out='<h1>Something went wrong</h1><p>'+e.message+'</p>'}
$('#main').innerHTML=out;if(h=='vocab')vcard();if(h=='quiz'&&Q&&Q.timed&&!Q.done){TM=setInterval(tick,1000);tick()}scrollTo(0,0)}
addEventListener('hashchange',go);go();cinit();
</script></body></html>
