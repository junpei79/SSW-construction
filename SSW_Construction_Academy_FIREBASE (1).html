<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>SSW Construction Academy</title>
<style>
:root{--bg:#fff;--fg:#1b2438;--nv:#14284b;--rd:#c8102e;--cd:#f4f6fa;--bd:#d9dfea;--ok:#177a3c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#10151f;--fg:#e8ebf2;--nv:#8fb0ee;--rd:#ff6b7d;--cd:#1a2230;--bd:#2d3748;--ok:#5fd38a}}
:root[data-theme=dark]{--bg:#10151f;--fg:#e8ebf2;--nv:#8fb0ee;--rd:#ff6b7d;--cd:#1a2230;--bd:#2d3748;--ok:#5fd38a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,"Noto Sans JP","Hiragino Sans",sans-serif;font-size:clamp(16px,.4vw + 14px,19px);line-height:1.6;overflow-x:hidden}*{box-sizing:border-box}p,td,li,h1,h2,h3{overflow-wrap:anywhere}
#app{display:flex;min-height:100dvh;width:100%}
#nav{width:190px;flex:none;background:var(--cd);border-right:1px solid var(--bd);padding:12px 8px;position:sticky;top:0;height:100dvh;box-sizing:border-box;overflow:auto}
#nav a{display:block;padding:9px 12px;border-radius:8px;color:var(--fg);text-decoration:none}
#nav a span{margin-right:8px}#nav a.on{background:var(--nv);color:var(--bg);font-weight:600}
main{flex:1;width:100%;max-width:1040px;margin:0 auto;padding:clamp(12px,2vw,28px) clamp(12px,2.5vw,32px) 40px;min-width:0}.row input{flex:1;min-width:140px}select,textarea{max-width:100%}
h1{color:var(--nv);margin:.2em 0;font-size:1.6em}h2,h3{color:var(--nv);margin:.6em 0 .3em}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:12px 16px;margin:12px 0}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.g .c{margin:0}.big{font-size:1.9em;font-weight:700;color:var(--rd)}
button,select,input,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px 14px;margin:3px 3px 3px 0}
button{cursor:pointer;background:var(--cd)}button.pri{background:var(--nv);color:var(--bg);border-color:var(--nv)}button.red{background:var(--rd);color:#fff;border-color:var(--rd)}
.op{display:block;width:100%;text-align:left;margin:8px 0}.op.ok{border-color:var(--ok);background:rgba(23,122,60,.15)}.op.bad{border-color:var(--rd);background:rgba(200,16,46,.13)}.op.sel{border-color:var(--nv);border-width:2px}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--rd)}
.jp{font-size:1.25em}rt{font-size:.55em;color:var(--rd)}.ro{color:var(--nv);font-style:italic}.n{font-size:.85em;opacity:.75}
body.nf rt{display:none}body.nr .ro{display:none}
.card{text-align:center;padding:28px 12px;cursor:pointer;min-height:170px}.card .k{font-size:clamp(1.8em,7vw,2.8em)}
table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid var(--bd);padding:6px;text-align:left;vertical-align:top}
.tbl{overflow-x:auto}.row{display:flex;flex-wrap:wrap;gap:4px;align-items:center}.warn{border-left:4px solid var(--rd)}
a{color:var(--nv)}
@media(max-width:800px){#app{display:block}#nav{position:fixed;bottom:0;left:0;right:0;width:auto;height:auto;display:flex;overflow-x:auto;padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));z-index:5;border-top:1px solid var(--bd);border-right:0}#nav a{flex:none;text-align:center;font-size:.72em;padding:4px 10px}#nav a span{display:block;margin:0;font-size:1.5em}main{padding-bottom:90px}}

#authGate{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:18px;overflow:auto}
#authCard{width:min(100%,440px);background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:22px;box-shadow:0 12px 40px rgba(0,0,0,.12)}
#authCard input{width:100%;margin:6px 0 12px}#authCard button{width:100%;margin:5px 0}#authMsg{min-height:1.5em;font-size:.9em;color:var(--rd)}#app.auth-locked{visibility:hidden}
.auth-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.auth-tools button{width:auto}
</style></head><body>
<div id="authGate"><div id="authCard"><h1>SSW Construction Academy</h1><p>Sign in with Google to save your lessons, quiz results and vocabulary progress to your cloud account.</p>
<button class="pri" id="googleSignIn">Continue with Google</button>
<div style="text-align:center;margin:12px 0">— or use email —</div>
<label for="authEmail">Email address</label><input id="authEmail" type="email" autocomplete="email" placeholder="you@example.com">
<label for="authPassword">Password</label><input id="authPassword" type="password" autocomplete="current-password" placeholder="At least 8 characters">
<button id="authSubmit">Sign in with email</button><button id="authToggle">Create an email account</button><button id="authReset">Forgot password?</button>
<div id="authMsg" role="status" aria-live="polite"></div><p class="n">Your progress is private to your account. Google sign-in opens a secure Google window. Email confirmation may be required for email accounts.</p></div></div>
<div id="app" class="auth-locked"><nav id="nav"></nav><main id="main"></main></div>

<script>
const $=s=>document.querySelector(s);
const fm=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const ld=()=>fm(new Date());const ad=(d,n)=>{const x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return fm(x)};
const r=s=>String(s).replace(/([一-龥々]+)\{([^}]+)\}/g,'<ruby>$1<rt>$2</rt></ruby>');
const shuf=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
const firebaseConfig={
 apiKey:"AIzaSyDEc8FRErTqj4uXutIsBsLbcRN5c_uImEA",
 authDomain:"ssw-construction-30c86.firebaseapp.com",
 projectId:"ssw-construction-30c86",
 storageBucket:"ssw-construction-30c86.firebasestorage.app",
 messagingSenderId:"473220019995",
 appId:"1:473220019995:web:ebacbebfe8e68d300a85be",
 measurementId:"G-C1SW54QHKQ"
};
let FB=null,FA=null,DB=null,AUTH=null,PT=null,AUTH_MODE='login',CLOUD_STATUS='Not signed in',CLOUD_BUSY=false,LOADING_CLOUD=false;
let S={};try{S=JSON.parse(localStorage.getItem('ssw1'))||{}}catch(e){}
S=Object.assign({done:{},v:{},vd:{},quiz:[],wrong:{},days:{},act:{},chk:{},furi:1,rom:1,ts:0},S);
const save=()=>{S.ts=Date.now();try{localStorage.setItem('ssw1',JSON.stringify(S))}catch(e){}push()};
function push(){if(!DB||!AUTH||LOADING_CLOUD)return;clearTimeout(PT);PT=setTimeout(async()=>{if(CLOUD_BUSY)return;CLOUD_BUSY=true;try{await DB.collection('users').doc(AUTH.uid).collection('progress').doc('main').set({progress:S,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});CLOUD_STATUS='☁ Saved to your Firebase account'}catch(e){CLOUD_STATUS='⚠ Cloud save failed: '+(e.message||'Check Firestore rules')}finally{CLOUD_BUSY=false;ui()}},900)}
const cst=()=>AUTH?CLOUD_STATUS:'Sign in to enable cloud saving';
function ui(){document.querySelectorAll('.cs').forEach(e=>e.textContent=cst());const e=$('#cloudEmail');if(e)e.textContent=AUTH?.email||'Not signed in'}
function authMessage(t){const e=$('#authMsg');if(e)e.textContent=t}
function setAuthMode(m){AUTH_MODE=m;$('#authSubmit').textContent=m==='signup'?'Create email account':'Sign in with email';$('#authToggle').textContent=m==='signup'?'I already have an account':'Create an email account';$('#authReset').style.display=m==='signup'?'none':'block';$('#authPassword').autocomplete=m==='signup'?'new-password':'current-password';authMessage('')}
function showGate(show){$('#authGate').style.display=show?'flex':'none';$('#app').classList.toggle('auth-locked',show)}
async function authSubmit(){const email=$('#authEmail').value.trim(),password=$('#authPassword').value;if(!email||!password)return authMessage('Enter your email and password.');if(password.length<6)return authMessage('Firebase requires at least 6 characters.');authMessage('Please wait…');try{if(AUTH_MODE==='signup'){await FA.createUserWithEmailAndPassword(email,password);authMessage('Account created.')}else await FA.signInWithEmailAndPassword(email,password)}catch(e){authMessage(e.message||'Authentication failed.')}}
async function googleSignIn(){authMessage('Opening Google sign-in…');const provider=new firebase.auth.GoogleAuthProvider();try{provider.setCustomParameters({prompt:'select_account'});await FA.signInWithPopup(provider)}catch(e){if(e.code==='auth/popup-blocked'){try{await FA.signInWithRedirect(provider)}catch(x){authMessage(x.message)}}else authMessage(e.message||'Google sign-in failed.')}}
async function authReset(){const email=$('#authEmail').value.trim();if(!email)return authMessage('Enter your email address first.');try{await FA.sendPasswordResetEmail(email);authMessage('Password reset email sent. Check your inbox.')}catch(e){authMessage(e.message||'Could not send reset email.')}}
async function afterLogin(user){AUTH=user;showGate(false);CLOUD_STATUS='☁ Loading your cloud progress…';ui();LOADING_CLOUD=true;try{const ref=DB.collection('users').doc(user.uid).collection('progress').doc('main');const snap=await ref.get();if(snap.exists&&snap.data()?.progress){const cloud=snap.data().progress;if((cloud.ts||0)>(S.ts||0)){S=Object.assign(S,cloud);try{localStorage.setItem('ssw1',JSON.stringify(S))}catch(e){}CLOUD_STATUS='☁ Loaded your latest cloud progress'}else{CLOUD_STATUS='☁ Signed in; syncing this device'}}else CLOUD_STATUS='☁ Creating your cloud progress record';}catch(e){CLOUD_STATUS='⚠ Cloud database error: '+(e.message||'check Firestore rules')}finally{LOADING_CLOUD=false}if(!CLOUD_STATUS.includes('error'))push();go();ui()}
async function cinit(){try{if(!window.firebase)throw new Error('Firebase SDK did not load. Check your internet connection.');FB=firebase.initializeApp(firebaseConfig);FA=firebase.auth();DB=firebase.firestore();$('#googleSignIn').addEventListener('click',googleSignIn);$('#authSubmit').addEventListener('click',authSubmit);$('#authToggle').addEventListener('click',()=>setAuthMode(AUTH_MODE==='login'?'signup':'login'));$('#authReset').addEventListener('click',authReset);$('#authPassword').addEventListener('keydown',e=>{if(e.key==='Enter')authSubmit()});await FA.getRedirectResult();FA.onAuthStateChanged(async user=>{AUTH=user;if(user)await afterLogin(user);else{showGate(true);CLOUD_STATUS='Not signed in';ui()}})}catch(e){showGate(true);authMessage('Firebase connection error: '+(e.message||'Could not initialise Firebase'))}}
const act=()=>{S.act[ld()]=(S.act[ld()]||0)+1;save()};

// vocab row: [word, kana, romaji, English, example(JP with kanji{reading}), example romaji, example English, memory trick, lesson#]
const V=[
[`チームワーク`,`チームワーク`,`chiimuwaaku`,`teamwork`,`チームワークが大切{たいせつ}です。`,`Chiimuwaaku ga taisetsu desu.`,`Teamwork is important.`,`Same as English "team + work".`,1],
[`建設工事`,`けんせつこうじ`,`kensetsu kouji`,`construction work`,`建設工事{けんせつこうじ}では、安全{あんぜん}が大切{たいせつ}です。`,`Kensetsu kouji dewa, anzen ga taisetsu desu.`,`Safety is important in construction work.`,`建設 = building up, 工事 = a work project.`,1],
[`現場`,`げんば`,`genba`,`work site`,`現場{げんば}で働{はたら}きます。`,`Genba de hatarakimasu.`,`I work at the site.`,`現 = actual, 場 = place: "the actual place".`,1],
[`現場監督`,`げんばかんとく`,`genba kantoku`,`site supervisor`,`現場監督{げんばかんとく}と打{う}ち合{あ}わせをします。`,`Genba kantoku to uchiawase wo shimasu.`,`I hold a meeting with the site supervisor.`,`監督 (kantoku) is also the word for a film director: the person who directs.`,1],
[`職長`,`しょくちょう`,`shokuchou`,`foreman (leader of a trade crew)`,`職長{しょくちょう}が指示{しじ}を出{だ}します。`,`Shokuchou ga shiji wo dashimasu.`,`The foreman gives instructions.`,`職 = job, 長 = chief: "job chief".`,1],
[`技能者`,`ぎのうしゃ`,`ginousha`,`skilled worker`,`技能者{ぎのうしゃ}は現場{げんば}で働{はたら}きます。`,`Ginousha wa genba de hatarakimasu.`,`Skilled workers work at the site.`,`技能 = skill, 者 = person.`,1],
[`発注者`,`はっちゅうしゃ`,`hacchuusha`,`client (the one who orders the work)`,`発注者{はっちゅうしゃ}は工事{こうじ}を注文{ちゅうもん}します。`,`Hacchuusha wa kouji wo chuumon shimasu.`,`The client orders the construction work.`,`注 sounds like chuu in 注文 (order). 発注 = send out an order.`,1],
[`設計者`,`せっけいしゃ`,`sekkeisha`,`designer`,`設計者{せっけいしゃ}が図面{ずめん}を作{つく}ります。`,`Sekkeisha ga zumen wo tsukurimasu.`,`The designer makes the drawings.`,`設計 = design. Designer first, then builder.`,1],
[`監理者`,`かんりしゃ`,`kanrisha`,`work supervisor (checks work matches the drawings)`,`監理者{かんりしゃ}は図面{ずめん}通{どお}りか確認{かくにん}します。`,`Kanrisha wa zumen doori ka kakunin shimasu.`,`The supervisor checks whether it matches the drawings.`,`Starts with 監 = "watch", like 監督. Not 管理 (kanri = management).`,1],
[`ゼネコン`,`ゼネコン`,`zenekon`,`general contractor`,`ゼネコンが工事{こうじ}全体{ぜんたい}をまとめます。`,`Zenekon ga kouji zentai wo matomemasu.`,`The general contractor manages the whole project.`,`Short for "general contractor": ゼネ + コン.`,1],
[`専門工事業者`,`せんもんこうじぎょうしゃ`,`senmon kouji gyousha`,`specialist subcontractor`,`専門工事業者{せんもんこうじぎょうしゃ}が仕事{しごと}を請{う}け負{お}います。`,`Senmon kouji gyousha ga shigoto wo ukeoimasu.`,`The specialist contractor takes on the work.`,`専門 (specialty) + 工事 (work) + 業者 (business).`,1],
[`施工`,`せこう`,`sekou`,`construction (carrying out the work)`,`施工{せこう}は図面{ずめん}通{どお}りに行{おこな}います。`,`Sekou wa zumen doori ni okonaimasu.`,`Construction is done according to the drawings.`,`Read せこう (se-kou), not しこう.`,1],
[`図面`,`ずめん`,`zumen`,`drawing / plan`,`図面{ずめん}を見{み}ます。`,`Zumen wo mimasu.`,`I look at the drawing.`,`図 = diagram, 面 = surface: a diagram on paper.`,1],
[`朝礼`,`ちょうれい`,`chourei`,`morning meeting`,`朝礼{ちょうれい}は作業{さぎょう}の前{まえ}にあります。`,`Chourei wa sagyou no mae ni arimasu.`,`The morning meeting is before work.`,`朝 = morning, 礼 = courtesy/greeting.`,3],
[`安全`,`あんぜん`,`anzen`,`safety`,`安全{あんぜん}が一番{いちばん}大切{たいせつ}です。`,`Anzen ga ichiban taisetsu desu.`,`Safety is the most important.`,`安 = calm, 全 = whole: "wholly calm".`,3],
[`危険`,`きけん`,`kiken`,`danger`,`危険{きけん}な場所{ばしょ}です。`,`Kiken na basho desu.`,`It is a dangerous place.`,`Think "key + ken": a key danger. 危 looks like a person at a cliff edge.`,3],
[`事故`,`じこ`,`jiko`,`accident`,`事故{じこ}を防{ふせ}ぎます。`,`Jiko wo fusegimasu.`,`We prevent accidents.`,`事 = matter, 故 = trouble: a "trouble matter".`,3],
[`防ぐ`,`ふせぐ`,`fusegu`,`to prevent`,`けがを防{ふせ}ぎます。`,`Kega wo fusegimasu.`,`We prevent injuries.`,`"fusegu" ~ "fence-goo": a fence prevents things.`,3],
[`危険予知活動`,`きけんよちかつどう`,`kiken yochi katsudou`,`hazard prediction activity (KY)`,`KY活動{かつどう}で危険{きけん}を考{かんが}えます。`,`KY katsudou de kiken wo kangaemasu.`,`We think about dangers in KY activity.`,`KY = Kiken Yochi. 予知 = knowing in advance.`,3],
[`ご安全に`,`ごあんぜんに`,`go-anzen ni`,`"Stay safe" (site greeting)`,`今日{きょう}もご安全{あんぜん}に！`,`Kyou mo goanzen ni!`,`Stay safe today too!`,`ご (polite) + 安全 (safety) + に.`,2],
[`おつかれさまです`,`おつかれさまです`,`otsukaresama desu`,`greeting between workers ("thank you for your effort")`,`おつかれ様{さま}です。`,`Otsukaresama desu.`,`Thank you for your hard work. (a greeting)`,`"o-tsukare" = tiredness: you honour the other person's effort.`,2],
[`指差呼称`,`しさこしょう`,`shisa koshou`,`pointing and calling`,`指差{しさ}呼称{こしょう}で「ヨシ！」と言{い}います。`,`Shisa koshou de "Yoshi!" to iimasu.`,`We say "Yoshi!" while pointing and calling.`,`指差 = point a finger, 呼称 = call out. Textbook reading: しさ.`,3],
[`新規入場者`,`しんきにゅうじょうしゃ`,`shinki nyuujousha`,`new entrant (new worker on site)`,`新規入場者{しんきにゅうじょうしゃ}は名前{なまえ}を言{い}います。`,`Shinki nyuujousha wa namae wo iimasu.`,`A new entrant says their name.`,`新規 = new, 入場 = entering, 者 = person.`,3],
[`ラジオ体操`,`ラジオたいそう`,`rajio taisou`,`radio exercises (warm-up)`,`朝礼{ちょうれい}でラジオ体操{たいそう}をします。`,`Chourei de rajio taisou wo shimasu.`,`We do radio exercises at the morning meeting.`,`Exercise to radio music; warming up prevents injury.`,3],
[`作業員`,`さぎょういん`,`sagyouin`,`worker`,`作業員{さぎょういん}が集{あつ}まります。`,`Sagyouin ga atsumarimasu.`,`The workers gather.`,`作業 = work, 員 = member.`,1],
[`建設キャリアアップシステム`,`けんせつきゃりああっぷしすてむ`,`kensetsu kyaria appu shisutemu`,`Construction Career-Up System (CCUS)`,`建設{けんせつ}キャリアアップシステムに登録{とうろく}します。`,`Kensetsu kyaria appu shisutemu ni touroku shimasu.`,`You register in the Construction Career-Up System.`,`"Career up" = move up in your career; a card shows your level.`,2],
[`元請け`,`もとうけ`,`motouke`,`main contractor`,`工務店{こうむてん}が元{もと}請{う}けです。`,`Koumuten ga motouke desu.`,`The local builder is the main contractor.`,`元 = origin/main + 請ける = take on an order.`,1],
[`施主`,`せしゅ`,`seshu`,`building owner (who orders the house)`,`施主{せしゅ}は工務店{こうむてん}に発注{はっちゅう}します。`,`Seshu wa koumuten ni hacchuu shimasu.`,`The owner places an order with the builder.`,`主 = owner (as in 主人).`,1],
[`労働基準法`,`ろうどうきじゅんほう`,`roudou kijunhou`,`Labour Standards Act`,`労働基準法{ろうどうきじゅんほう}は最低{さいてい}の労働条件{ろうどうじょうけん}を決{き}めます。`,`Roudou kijunhou wa saitei no roudou jouken wo kimemasu.`,`The Labour Standards Act sets the minimum working conditions.`,`労働 = labour, 基準 = standard, 法 = law.`,4],
[`労働条件`,`ろうどうじょうけん`,`roudou jouken`,`working conditions`,`労働条件{ろうどうじょうけん}を確認{かくにん}します。`,`Roudou jouken wo kakunin shimasu.`,`I check the working conditions.`,`条件 = condition, like the conditions in a contract.`,4],
[`労働者`,`ろうどうしゃ`,`roudousha`,`worker (employee)`,`労働者{ろうどうしゃ}は安全{あんぜん}に働{はたら}きます。`,`Roudousha wa anzen ni hatarakimasu.`,`Workers work safely.`,`労働 (labour) + 者 (person), like 技能者.`,4],
[`賃金`,`ちんぎん`,`chingin`,`wages`,`賃金{ちんぎん}は毎月{まいつき}支払{しはら}われます。`,`Chingin wa maitsuki shiharawaremasu.`,`Wages are paid every month.`,`賃 = pay, 金 = money (same 金 as お金).`,4],
[`解雇`,`かいこ`,`kaiko`,`dismissal (being fired)`,`解雇{かいこ}の前{まえ}に予告{よこく}が必要{ひつよう}です。`,`Kaiko no mae ni yokoku ga hitsuyou desu.`,`Notice is needed before dismissal.`,`解 = release, 雇 = hire: "release from hire".`,4],
[`休憩`,`きゅうけい`,`kyuukei`,`break (rest during work)`,`八時間{はちじかん}を超{こ}えると一時間{いちじかん}の休憩{きゅうけい}があります。`,`Hachijikan wo koeru to ichijikan no kyuukei ga arimasu.`,`Over eight hours, there is a one-hour break.`,`Both 休 and 憩 mean rest: double rest.`,4],
[`残業`,`ざんぎょう`,`zangyou`,`overtime`,`残業{ざんぎょう}には割増賃金{わりましちんぎん}を払{はら}います。`,`Zangyou ni wa warimashi chingin wo haraimasu.`,`Extra pay is paid for overtime.`,`残 = remain, 業 = work: work that remains after hours. The textbook also calls it 時間外労働.`,4],
[`法定労働時間`,`ほうていろうどうじかん`,`houtei roudou jikan`,`legal working hours`,`原則{げんそく}、一日{いちにち}八時間{はちじかん}までです。`,`Gensoku, ichinichi hachijikan made desu.`,`In principle, up to eight hours a day.`,`法定 = set by law. Numbers: 8 per day, 40 per week.`,4],
[`年次有給休暇`,`ねんじゆうきゅうきゅうか`,`nenji yuukyuu kyuuka`,`annual paid leave`,`年次有給休暇{ねんじゆうきゅうきゅうか}を取{と}ります。`,`Nenji yuukyuu kyuuka wo torimasu.`,`I take annual paid leave.`,`有給 = "has pay", 休暇 = holiday.`,4],

const L=[
{t:`Teamwork and who does what on a site (Textbook 1.1-1.2)`,jp:`現場{げんば}のチームワーク`,
o:[`Explain why teamwork matters on a Japanese site`,`Name the roles: 発注者, 設計者, 監理者, ゼネコン, 現場監督, 職長, 専門工事業者`,`Understand how a small house project is organised (施主 to 工務店)`],
x:`<p>A building has many steps. Each <b>specialist contractor</b> (専門工事業者) does one kind of work, then the site passes to the next trade. For this to run smoothly they must cooperate: that is <b>teamwork</b>.</p><p><b>Large project:</b> the <b>client</b> (発注者: e.g. the ministry, a local government, a company or a person) orders the work. The <b>designer</b> (設計者) makes the design documents. The <b>supervisor</b> (監理者) checks the work follows the drawings. The <b>general contractor</b> (ゼネコン) manages the whole project and the <b>site supervisor</b> (現場監督) directs the site. After meeting the 現場監督, the <b>foreman</b> (職長) gives instructions to the skilled workers (技能者). Senior workers also advise junior ones.</p><p><b>Small project (a house):</b> the owner (施主) orders from a local builder (工務店), who becomes the main contractor (元請け) and manages the specialist companies.</p>`,
s:{jp:`流{なが}れよく工事{こうじ}を進{すす}めるには、チームワークが大切{たいせつ}です。`,ro:`Nagare yoku kouji wo susumeru ni wa, chiimuwaaku ga taisetsu desu.`,en:`To run the work smoothly, teamwork is important.`,p:[[`流{なが}れよく`,`smoothly (flowing well)`],[`工事{こうじ}を進{すす}める`,`move the construction forward`],[`には`,`in order to`],[`チームワーク`,`teamwork`],[`が大切{たいせつ}です`,`is important (が marks the subject)`]]},
p:`Teaching example (not from the textbook): at a house site the carpentry team cannot start until the foundation team finishes. The foremen talk to the 現場監督 each morning to agree who works where.`,
m:`Role chain: 発注者 orders, 設計者 designs, ゼネコン manages, 職長 instructs, 技能者 builds, 監理者 checks.`,
u:`Specialist teams hand the site on one after another. A 職長 instructs workers after meeting the 現場監督. 監理者 checks drawings, 設計者 designs, ゼネコン manages. On small jobs, 施主 orders from a 工務店 (元請け).`},
{t:`Career-Up System and greetings (Textbook 1.3-1.4)`,jp:`建設{けんせつ}キャリアアップシステムとあいさつ`,
o:[`Explain what CCUS records and why`,`Know CCUS has 4 levels and new workers start at Level 1`,`Understand why greetings matter; use ご安全に and おつかれさまです`],
x:`<p><b>CCUS</b> (建設キャリアアップシステム) records each skilled worker's work history and qualifications. Goals: fair evaluation of skill, better quality, more efficient site work. Registered workers get a card showing their level. There are <b>4 levels</b>.</p><p>Evaluation looks at experience (days worked), knowledge, skill (qualifications) and management ability (e.g. foreman experience).</p><p>Level 2 needs <b>645+ working days (about 3 years)</b> after registration, so beginners start at <b>Level 1</b>.</p><p><b>Greetings:</b> what Japanese sites value most is <b>preventing accidents</b>, and the most basic step is greeting. Greet people you pass: おはようございます in the morning, おつかれさまです, or ご安全に. Greeting workers of other trades builds unity and makes work pleasant.</p>`,
s:{jp:`日本{にほん}の現場{げんば}で大切{たいせつ}にしていることは、事故{じこ}を防{ふせ}ぐことです。`,ro:`Nihon no genba de taisetsu ni shite iru koto wa, jiko wo fusegu koto desu.`,en:`What is valued at Japanese sites is preventing accidents.`,p:[[`日本{にほん}の現場{げんば}で`,`at Japanese sites`],[`大切{たいせつ}にしていること`,`the thing that is valued`],[`は`,`topic marker`],[`事故{じこ}を防{ふせ}ぐこと`,`preventing accidents`],[`です`,`is`]]},
p:`Teaching example: you pass a worker from another trade in the corridor. Bow slightly and say おはようございます (morning) or おつかれさまです.`,
m:`CCUS = Career card, 4 levels, you start at 1, Level 2 = 645 days (3 years).`,
u:`CCUS records work and qualifications in 4 levels; beginners start at Level 1. Greetings build unity and support the real goal: preventing accidents.`},
{t:`Morning meeting (朝礼) and KY activity (Textbook 1.5)`,jp:`朝礼{ちょうれい}とKY活動{かつどう}`,
o:[`Describe the two kinds of 朝礼 and their purpose`,`List the steps of 全体朝礼`,`Explain KY activity and its four steps`],
x:`<p>Every day before work all workers meet for <b>朝礼</b>. Its main purpose is to <b>prevent accidents</b>, so it is also called 安全朝礼. There are two: <b>全体朝礼</b> (everyone) and a <b>trade-by-trade 朝礼</b>.</p><p><b>全体朝礼, in order:</b> 1) site supervisor's greeting, 2) radio exercises (no music: count 1-2-3-4 aloud), 3) confirm today's work (new entrants say name and company loudly), 4) KY activity, 5) pair safety check aloud, 6) everyone says 今日もご安全に！ and starts.</p><p><b>Trade 朝礼:</b> 安全唱和 (a safety slogan said together while pointing, e.g. ゼロ災で行こう、ヨシ！), then KY: (1) find dangers, (2) discuss countermeasures and write them on the KY sheet, (3) decide an action goal, (4) call it out with 指差呼称.</p><p><b>KY</b> (Kiken Yochi) = imagine where an accident could happen and stop it before it happens.</p>`,
s:{jp:`朝礼{ちょうれい}では、全員{ぜんいん}で安全{あんぜん}を確認{かくにん}します。`,ro:`Chourei dewa, zenin de anzen wo kakunin shimasu.`,en:`At the morning meeting, everyone confirms safety together.`,p:[[`朝礼では`,`at the morning meeting`],[`全員{ぜんいん}で`,`all together (で = by/with)`],[`安全{あんぜん}を`,`safety (を marks the object)`],[`確認{かくにん}します`,`confirm (polite verb)`]]},
p:`Teaching example: a delivery truck will bring materials today. In KY the crew names the danger (people near the truck), agrees a countermeasure (keep out of the area), sets a goal and calls it out while pointing.`,
m:`KY steps = Find, Fix (countermeasure), Focus (goal), Call out. Four F-F-F-C.`,
u:`朝礼 happens daily to prevent accidents: 全体朝礼 first, then trade 朝礼. KY has four steps: find dangers, countermeasures, action goal, call out with 指差呼称.`}
,{c:1,t:`Labour Standards Act: your rights at work (Textbook 2.1.1)`,jp:`労働基準法{ろうどうきじゅんほう}`,
o:[`Explain what the Labour Standards Act does`,`Know the 6 items an employer must state clearly`,`Remember the key numbers: hours, breaks, notice, overtime, paid leave`],
x:`<p>労働法 is the name for all laws about work. The <b>労働基準法</b> sets the <b>minimum</b> working conditions. If a contract is worse than the law, the law's rule applies instead. 労働条件 means everything about how you are treated at work: wages, hours, dismissal, accident compensation, safety and health, dormitories.</p><p><b>Basic principles:</b> equal treatment (no unfair difference in wages or hours because of nationality, belief or social status); no forced labour; prevention of power harassment (using a higher position to cause mental or physical pain beyond proper work).</p><p><b>6 things the employer must state clearly (労働条件の明示):</b> (1) contract period, (2) rules for renewing, (3) workplace and duties, (4) finishing time, overtime, breaks, days off and leave, (5) wages (how decided, how paid, closing day, pay day, raises), (6) retirement and dismissal.</p><p><b>Key rules:</b> no fixed penalty for breaking the contract. No dismissal while hurt or ill from work, or for 30 days after. 30 days' notice before dismissal. <b>Wages, 5 principles:</b> in currency, directly to the worker, in full, at least once a month, on a fixed date. <b>Hours:</b> in principle 40 hours a week and 8 a day. <b>Breaks:</b> over 6 hours gives 45 minutes; over 8 hours gives 1 hour, during work and for everyone at once. <b>Days off:</b> at least one a week. <b>Overtime:</b> premium pay; limit 45 hours a month and 360 a year. <b>Paid leave:</b> after 6 months of work with 80% or more attendance you get 10 days; plus 1 day each year; after 2.5 years plus 2 days each year; maximum 20.</p><p class=n>Source: uploaded textbook pp.7-9, summarised in my own words.</p>`,
s:{jp:`労働時間{ろうどうじかん}が六時間{ろくじかん}を超{こ}える場合{ばあい}は、四十五分{よんじゅうごふん}の休憩{きゅうけい}を与{あた}えなければなりません。`,ro:`Roudou jikan ga rokujikan wo koeru baai wa, yonjuugo fun no kyuukei wo ataenakereba narimasen.`,en:`If working time exceeds 6 hours, a 45-minute break must be given.`,p:[[`労働時間{ろうどうじかん}が`,`working hours (subject)`],[`六時間{ろくじかん}を超{こ}える場合{ばあい}は`,`in the case of going over 6 hours`],[`四十五分{よんじゅうごふん}の休憩{きゅうけい}を`,`a 45-minute break (object)`],[`与{あた}えなければなりません`,`must give (〜なければなりません = must do)`]]},
p:`Teaching example (not from the textbook): your pay slip shows overtime at the normal rate. The law requires premium pay for overtime, so politely ask your 職長 or the office to check.`,
m:`Breaks: 6 hours gives 45 minutes, 8 hours gives 60. Wage 5 = paid in currency, directly to me, in full, monthly, on a fixed date.`,
u:`The Act sets minimum conditions. Employers must state 6 items clearly. Dismissal needs 30 days' notice. Hours: 8 a day, 40 a week; breaks 45/60 minutes; overtime max 45 hours a month; paid leave starts at 10 days.`}
,{c:1,t:`Safety and health law, work accidents and insurance (Textbook 2.1.2, 2.1.4)`,jp:`労働安全衛生法{ろうどうあんぜんえいせいほう}と労災保険{ろうさいほけん}`,
o:[`Explain the goals of the Industrial Safety and Health Act`,`Know the main causes of construction deaths and the full-harness rule`,`Understand 労災保険, 業務災害 and 通勤災害`],
x:`<p>The <b>労働安全衛生法</b> has two goals: protect workers' safety and health, and create a comfortable workplace. Signs and flags such as <b>安全第一</b> remind everyone to aim for no accidents.</p><p>Workers must follow safety rules and cooperate with the employer's accident-prevention measures. <b>安全衛生教育</b> is required when you are newly hired or your work changes. Some jobs, like operating cranes, need special training or skill courses.</p><p><b>What causes deaths?</b> In FY2021 there were 288 work deaths in construction. Falls (墜落・転落) were by far the most common at 110, then collapse (31), being caught in machines (27), road accidents (25) and being struck (19). So in high-place work, a <b>full-harness</b> fall-arrest device is the rule in principle.</p><p><b>Heatstroke:</b> prepare shade, water, salt candy and emergency response. <b>Risk assessment and KY</b> find hazards before accidents happen. <b>Health checks:</b> once a year and when hired; workplaces with 50 or more people also do a yearly stress check.</p><p><b>労災保険:</b> pays when a worker is hurt, falls ill, is disabled or dies because of work (<b>業務災害</b>) or on the way to work (<b>通勤災害</b>). Hospital treatment is paid by 労災 insurance and the employer pays all premiums. If an accident happens: confirm safety, then rescue the injured first. The Labour Standards Inspection Office investigates to decide if it was a work accident. A commuting accident must be on a reasonable route and method: for example, registering to commute by bus but being hurt while cycling is not covered.</p><p class=n>Source: uploaded textbook pp.9-11.</p>`,
s:{jp:`高所作業{こうしょさぎょう}では、フルハーネス型{がた}の墜落制止用器具{ついらくせいしようきぐ}を使{つか}います。`,ro:`Kousho sagyou dewa, furu haanesu gata no tsuiraku seishi youki wo tsukaimasu.`,en:`In high-place work, you use a full-harness-type fall-arrest device.`,p:[[`高所作業{こうしょさぎょう}では`,`in high-place work`],[`フルハーネス型{がた}の`,`of the full-harness type`],[`墜落制止用器具{ついらくせいしようきぐ}を`,`fall-arrest equipment (object)`],[`使{つか}います`,`use`]]},
p:`Teaching example: before working on a roof edge, check that your harness is the full-body type, the hook is attached, and say 指差呼称 for it with your crew.`,
m:`Deaths FY2021: 288 total, falls 110. Remember "falls first". 労災: employer pays all premiums.`,
u:`The Act protects safety and health; training is needed on hiring and job change. Falls are the biggest killer, so use a full harness at height. 労災保険 covers work and commuting accidents, and the employer pays the premiums.`}
,{c:1,t:`Other laws you must know (Textbook 2.1.3, 2.1.5-2.5)`,jp:`最低賃金{さいていちんぎん}と建設{けんせつ}の法令{ほうれい}`,
o:[`Explain the minimum wage and employment insurance`,`Know the 5 aims of the Construction Business Act`,`Understand Building Standards Act rule types and waste rules`],
x:`<p><b>最低賃金法:</b> sets a lowest wage so living is stable and competition is fair. It is set per prefecture because prices differ, and published in the official gazette and on prefectural labour bureau sites.</p><p><b>雇用保険法:</b> employers must join. Payments after unemployment go to people who are willing and able to work but have no job, if insured 12 months or more in the 2 years before leaving. Premiums are paid by the worker and the employer.</p><p><b>建設業法:</b> five aims: better quality of contractors (permits), fair contracts (estimates, contracts), proper construction (chief and supervising engineers), protect clients, healthy industry.</p><p><b>建築基準法:</b> minimum rules for buildings. <b>単体規定</b> = safety of one building (strength, fire, earthquake, daylight, ventilation, toilets, electrics). <b>集団規定</b> = good city environment (site and road rules, building coverage ratio 建ぺい率, floor area ratio 容積率, height limits, fire-prevention zones).</p><p><b>廃棄物処理法 and 建設リサイクル法:</b> the main contractor (元請け) makes a <b>manifest</b> and checks waste until final disposal, including recycling. Workers handle waste following it. Waste is sorted by material and kept in the decided place.</p><p><b>Also:</b> 建設労働者雇用改善法 (10th plan 2021-2025: young workers, good workplaces, skill development, foreign workers) and 職業能力開発促進法 (job training and the national skills test 技能検定).</p><p class=n>Source: uploaded textbook pp.10-14.</p>`,
s:{jp:`最低賃金{さいていちんぎん}は、都道府県{とどうふけん}ごとに決{き}められています。`,ro:`Saitei chingin wa, todoufuken goto ni kimerarete imasu.`,en:`The minimum wage is set for each prefecture.`,p:[[`最低賃金{さいていちんぎん}は`,`the minimum wage (topic)`],[`都道府県{とどうふけん}ごとに`,`for each prefecture (ごとに = each)`],[`決{き}められています`,`is decided (passive, ongoing state)`]]},
p:`Teaching example: if you work in a prefecture, your hourly pay must not be below that prefecture's minimum wage.`,
m:`建設業法 = 5 aims. 単体 = one building; 集団 = a group of buildings (the town).`,
u:`Minimum wage is per prefecture. Employment insurance is paid by both worker and employer. 建築基準法 has 単体 and 集団 rules. The main contractor makes the waste manifest, and waste is sorted by material.`}
,{c:2,t:`Building structures and the construction flow (Textbook 3.1.2)`,jp:`建築工事{けんちくこうじ}の種類{しゅるい}と流{なが}れ`,
o:[`Name the 5 structure types`,`Follow the flow of a large building project`,`Know the 3 earthquake methods`],
x:`<p>Work is split into 土木工事 (civil: dams, rivers, roads, disaster recovery), 建築工事 (buildings) and ライフライン・設備工事 (utilities and equipment).</p><p><b>Structure types:</b> <b>鉄筋コンクリート造</b> (concrete poured into formwork with rebar), <b>鉄骨造</b> (steel columns and beams), <b>鉄骨鉄筋コンクリート造</b> (both), <b>木造</b> (wood, common for houses), コンクリートブロック造 (blocks with rebar through the holes).</p><p><b>Flow of a large building:</b> 準備工事 (fence, temporary offices, soil boring to find the 支持層) → 山留め → 杭工事 (場所打ちコンクリート杭 made on site, or 既成杭 made in a factory) → 土工事 (dig, pump out water) → 地下躯体工事 (rebar, 鉄筋継手, 型枠, コンクリート圧送) → 地上躯体工事 (steel frame by crane and bolts) → 内外装仕上げ (waterproofing, sheet metal, roof, tile, plaster, paint, fittings, stone).</p><p><b>Earthquake work:</b> 耐震 (strong columns and beams), 制振 (dampers absorb shaking), 免震 (isolators at the foundation stop energy reaching the building).</p><p class=n>Source: uploaded textbook pp.22-24.</p>`,
s:{jp:`建物{たてもの}を作{つく}る工事{こうじ}を「建築工事{けんちくこうじ}」と言{い}います。`,ro:`Tatemono wo tsukuru kouji wo "kenchiku kouji" to iimasu.`,en:`Work that builds buildings is called "kenchiku kouji".`,p:[[`建物{たてもの}を作{つく}る`,`that builds buildings`],[`工事{こうじ}を`,`the work (object)`],[`「建築工事{けんちくこうじ}」と`,`as "building construction"`],[`言{い}います`,`is called / say`]]},
p:`Teaching example: for a 10-storey RC building, the order is boring, piles, excavation, underground frame, frame above ground, then finishing.`,
m:`Flow: Prepare, Shore, Pile, Dig, Frame, Finish.`,
u:`Five structure types; RC uses rebar plus concrete. The flow runs from preparation to finishing. 耐震 resists, 制振 absorbs, 免震 isolates.`}
,{c:2,t:`Key structural and finishing trades (Textbook 3.2)`,jp:`主{おも}な専門工事{せんもんこうじ}`,
o:[`Know what とび, 鉄骨, 鉄筋, 型枠, 左官 and 大工 do`,`Understand 支保工 and 雨仕舞`,`Tell the two steel erection methods apart`],
x:`<p><b>とび工事:</b> 足場とび build scaffolds; 鉄骨とび assemble the steel frame of tall buildings; 町場とび build scaffolds for houses.</p><p><b>鉄骨工事:</b> 建て逃げ方式 uses a mobile crane, working from the back of the site to the front. 水平積上げ方式 uses a tower crane, floor by floor (for high-rises).</p><p><b>鉄筋工事:</b> builds the rebar skeleton of concrete structures. Welding types: 融接, 圧接 (gas pressure welding joins rebar) and ろう接.</p><p><b>型枠工事:</b> formwork covers the rebar and holds the concrete. Concrete pushes hard from inside, so steel pipes support it from outside: that is <b>支保工</b>. Formwork carpenters read 加工図 (shop drawings).</p><p><b>左官工事:</b> plaster work on walls with mortar, 漆喰 and more; the finish must look beautiful.</p><p><b>建築大工:</b> 町大工 (wooden houses), 造作大工 (interior fittings), 宮大工 (temples and shrines), 型枠大工. <b>屋根工事:</b> roofs, often 瓦 (clay tiles); knowing 雨仕舞 (keeping rain out) is vital.</p><p class=n>Source: uploaded textbook pp.31-37.</p>`,
s:{jp:`型枠{かたわく}の中{なか}にコンクリートを流{なが}し込{こ}みます。`,ro:`Katawaku no naka ni konkuriito wo nagashikomimasu.`,en:`Concrete is poured into the formwork.`,p:[[`型枠{かたわく}の中{なか}に`,`into the inside of the formwork`],[`コンクリートを`,`concrete (object)`],[`流{なが}し込{こ}みます`,`pour in`]]},
p:`Teaching example: formwork workers set the panels, rebar workers tie bars, concrete is pumped in, and 支保工 pipes stop the panels from bursting.`,
m:`型枠 = "mould frame"; 支保工 = "support pipes" outside. Burst = パンク.`,
u:`とび build scaffolds and steel frames; 鉄筋 makes the skeleton; 型枠 holds the concrete with 支保工; 左官 plasters; 大工 build in wood; roofs need 雨仕舞.`}
,{c:3,t:`Greetings and emergency calls (Textbook 4.1)`,jp:`あいさつと呼{よ}びかけ`,
o:[`Use おはようございます, ご安全に and おつかれさまです correctly`,`Know when ご苦労さま is not polite`,`React to 危ない！`],
x:`<p>People like those who greet them, so greet cheerfully even strangers. <b>おはようございます</b> is the basic morning greeting. <b>ご安全に</b> wishes the other person a safe day: say it at the end of 朝礼 and to someone starting dangerous work. <b>おつかれさまです</b> thanks someone for their work and works anywhere with workers; say おつかれさまでした to someone leaving.</p><p><b>ご苦労さま</b> also thanks, but many Japanese think it rude to a superior (現場監督, 職長, senior), so do not use it upwards. If a superior says it to you, answer ありがとうございます.</p><p><b>失礼します</b> is used entering a room or interrupting; <b>お先に失礼します</b> when leaving before others (reply おつかれさまでした). <b>危ない！</b> is the shout for danger; for falling or flying objects: 危ない！よけろっ！ React at once.</p><p class=n>Source: uploaded textbook pp.48-50.</p>`,
s:{jp:`危{あぶ}ない！よけろっ！`,ro:`Abunai! Yokero!`,en:`Danger! Dodge!`,p:[[`危{あぶ}ない`,`dangerous / watch out`],[`よけろっ`,`dodge! (command form of よける, with a small っ for force)`]]},
p:`Teaching example: you hear 危ない！ from above. Do not look up and wait; step away first.`,
m:`ご苦労さま goes down (to juniors); おつかれさま goes anywhere.`,
u:`Greet everyone. ご安全に wishes safety. Do not say ご苦労さま to superiors. 失礼します / お先に失礼します are polite exits and entries. Move at once at 危ない！.`}
,{c:3,t:`Site terms: marking out, formwork and foundations (Textbook 4.2)`,jp:`現場{げんば}の用語{ようご}`,
o:[`Understand 墨出し terms`,`Know 遣り方, foundation and scaffold terms`,`Know rebar and formwork terms`],
x:`<p><b>墨出し</b> = drawing the reference lines for the work. 基準墨 is the base line; 通り芯 is the centre line (壁芯, 柱芯); 地墨 on floors; 立て墨 vertical on walls and columns; 仕上げ墨 shows finished dimensions.</p><p><b>遣り方</b> = a temporary frame of wooden stakes and 水貫 boards that shows positions, right angles and heights; 水糸 is the horizontal string; 水盛り fixes the level. (Civil work says 丁張り.)</p><p><b>Earth and foundations:</b> 盛り土, 段切り, 締固め. 地業 is the work under the foundation slab. 直接基礎 (ベタ基礎, フーチング) is for firm ground; <b>杭基礎</b> is for weak ground. 足場, 作業床 and 仮囲い are temporary works.</p><p><b>Rebar and formwork:</b> 配筋 (placing rebar), あき (gap between bars), かぶり厚さ (cover), 捨てコン (blinding concrete used as a clean, level working base; thickness is project-specific), 結束 (tying), 建込み (standing formwork), ノロ (cement slurry or leakage), 転用 (reusing formwork), <b>パンク</b> (formwork bursts and concrete leaks, when 支保工 is weak), 釘仕舞 (pulling nails to reuse).</p><p class=n>Source: uploaded textbook pp.50-54.</p>`,
s:{jp:`墨出{すみだ}しで、基準{きじゅん}の線{せん}を引{ひ}きます。`,ro:`Sumidashi de, kijun no sen wo hikimasu.`,en:`In marking-out, you draw the reference lines.`,p:[[`墨出{すみだ}しで`,`by / in marking-out`],[`基準{きじゅん}の線{せん}を`,`the reference lines (object)`],[`引{ひ}きます`,`draw (a line)`]]},
p:`Teaching example: first 捨てコン is poured, then 墨出し is drawn on it, then formwork is stood on the lines.`,
m:`あき = gap, かぶり = cover (hat), パンク = tyre burst.`,
u:`Marking terms (墨出し, 通り芯), 遣り方, foundations (杭基礎 for weak ground), and rebar/formwork terms (かぶり厚さ, 捨てコン, パンク).`}
,{c:3,t:`Shared living: 5S, clothes and communication (Textbook 4.3)`,jp:`共同生活{きょうどうせいかつ}の注意{ちゅうい}`,
o:[`Explain 5S`,`Follow the workers' room and clothing rules`,`Use ほうれんそう`],
x:`<p><b>5S:</b> 整理 (separate and dispose of unneeded things), 整頓 (put needed things in set places; return tools), 清掃 (clean after work), 清潔 (keep clean), しつけ (rules and training everyone follows).</p><p><b>作業員詰め所</b> (for changing, eating, resting): smoke only in the set place; no ポイ捨て; helmets and harnesses in set places; personal items in lockers; wash hands, disinfect and gargle; check the notice board.</p><p><b>Clothing:</b> no short sleeves or shorts; do not leave jackets open (snagging); no rolled sleeves; no hands in pockets while walking (you cannot react to a sudden fall).</p><p><b>ほうれんそう</b> = 報告 (progress, results), 連絡 (information, schedule), 相談 (trouble, things you do not understand). Say the conclusion first. <b>後片付け:</b> always tidy up after work; confirm any fire is out.</p><p class=n>Source: uploaded textbook pp.59-62.</p>`,
s:{jp:`分{わ}からない時{とき}は、相談{そうだん}します。`,ro:`Wakaranai toki wa, soudan shimasu.`,en:`When I do not understand, I consult.`,p:[[`分{わ}からない時{とき}は`,`when (I) do not understand`],[`相談{そうだん}します`,`consult (my senior)`]]},
p:`Teaching example: you do not understand a drawing. Do not guess; ask your 職長 (相談).`,
m:`5S: Seiri, Seiton, Seisou, Seiketsu, Shitsuke.`,
u:`5S keeps the site tidy. Follow the workers' room rules, dress safely, and use ほうれんそう with the conclusion first. Tidy up and check fire after work.`}
,{c:1,t:`Environment and fire laws (Textbook 2.6-2.9)`,jp:`環境{かんきょう}と消防{しょうぼう}の法令{ほうれい}`,
o:[`Know what the air, noise/vibration and water laws control`,`Know the aims of the Fire Service Act`,`Recognise fire-fighting and alarm equipment`],
x:`<p><b>大気汚染防止法:</b> sets emission standards for air pollutants from factories and sites, by substance and by size of facility.</p><p><b>騒音規制法・振動防止法:</b> control noise and vibration from factories and construction, and set limits for car noise, to protect living conditions and health. When designing construction work, the surroundings must be studied to reduce noise and vibration.</p><p><b>水質汚濁防止法:</b> prevents pollution of public waters and groundwater. Dirty water from a site that goes to a sewer or river must follow the standards set by each prefecture.</p><p><b>消防法:</b> (1) prevent, warn of and put out fires to protect life, body and property; (2) reduce damage from fire or earthquakes; (3) carry the injured properly and keep order. For buildings it sets rules for fire-fighting equipment (extinguishers, indoor hydrants, sprinklers), escape equipment (escape ladders) and alarms.</p><p class=n>Source: uploaded textbook pp.15-16.</p>`,
s:{jp:`工事現場{こうじげんば}の汚水{おすい}は、基準{きじゅん}に従{したが}って流{なが}します。`,ro:`Kouji genba no osui wa, kijun ni shitagatte nagashimasu.`,en:`Dirty water from a work site is drained according to the standard.`,p:[[`工事現場{こうじげんば}の汚水{おすい}は`,`dirty water of the work site (topic)`],[`基準{きじゅん}に従{したが}って`,`following the standard`],[`流{なが}します`,`drain / let flow`]]},
p:`Teaching example: washing water from concrete tools must not go straight into a river; follow the prefecture standard.`,
m:`Laws by pollution type: air, noise, vibration, water, fire.`,
u:`Separate laws control air, noise/vibration and water pollution. 消防法 protects life and property from fire and covers extinguishers, sprinklers, escape ladders and alarms.`}
,{c:1,t:`Utility, radio, aviation and parking laws (Textbook 2.10-2.17)`,jp:`ライフラインなどの法令{ほうれい}`,
o:[`Know what each utility law protects`,`Remember the numbers: 60 m and 100 g`,`Know that licences and qualifications are required`],
x:`<p><b>水道法:</b> clean, plentiful, cheap water; qualified engineers must be placed and work under their instructions. <b>下水道法:</b> develops sewers; water with pH, suspended solids, cadmium, lead, total chromium, copper or zinc above the standard must not be discharged. <b>ガス事業法:</b> safety for city gas; gas leaks and poor ventilation can cause deaths.</p><p><b>電気事業法:</b> electricity can cause fire, equipment accidents and injury; 漏電 can cause fire and shock. <b>電気通信事業法:</b> covers wired, wireless and optical fibre; connection work needs a <b>工事担任者</b> qualification.</p><p><b>電波法:</b> licences are needed depending on power and frequency. Using a licence-required transceiver without a licence is illegal, and overseas radios not approved in Japan are illegal too.</p><p><b>航空法:</b> structures and cranes can block aircraft; objects <b>60 m or higher</b> need aviation obstruction lights. Drones of <b>100 g or more</b> must be registered. <b>駐車場法:</b> notify the local government before parking-lot construction starts.</p><p class=n>Source: uploaded textbook pp.16-18.</p>`,
s:{jp:`免許{めんきょ}が必要{ひつよう}なトランシーバーを、免許{めんきょ}なしで使{つか}ってはいけません。`,ro:`Menkyo ga hitsuyou na toranshiibaa wo, menkyo nashi de tsukatte wa ikemasen.`,en:`You must not use a licence-required walkie-talkie without a licence.`,p:[[`免許{めんきょ}が必要{ひつよう}な`,`which needs a licence`],[`トランシーバーを`,`walkie-talkie (object)`],[`免許{めんきょ}なしで`,`without a licence`],[`使{つか}ってはいけません`,`must not use (〜てはいけません)`]]},
p:`Teaching example: a tower crane over 60 m needs lights so planes can see it.`,
m:`60 m = lights; 100 g = drone registration.`,
u:`Each utility law protects safety and service. Licences or qualifications are required for radios and telecom work. Aviation lights at 60 m; drone registration at 100 g.`}
,{c:2,t:`Civil works and lifeline works (Textbook 3.1.1, 3.1.3)`,jp:`土木工事{どぼくこうじ}とライフライン`,
o:[`Name the main kinds of civil work`,`Know the 4 tunnel types and the 2 bridge stages`,`Know the lifeline and equipment works`],
x:`<p><b>Civil work (土木):</b> <b>ダム</b> (治水 and 利水); rivers and coasts (防波堤, 防潮堤, 護岸, 堤防); roads (paving, signs, signals, lights, landscaping); <b>tunnels</b>: 山岳 (NATM: sprayed concrete, steel supports, rock bolts), 開削 (dig from the surface then backfill), シールド (shield machine, soft ground), 推進 (pipes pushed by jacks from a shaft); <b>橋梁</b> (下部工 foundations, 上部工 deck); 海洋土木 (岸壁, 防波堤, shipping routes; work boats and divers 潜水士); 鉄道工事; water and sewer works; 災害復旧工事; airports, land readjustment, farm, erosion-control and forest civil works.</p><p><b>Lifeline works:</b> <b>電気工事</b> (power plant → transmission lines → substation → poles or underground → 配電盤); shock risk: confirm power on/off and check with a voltage detector (検電). <b>都市ガス工事</b> (pipes and equipment). <b>上下水道工事</b>. <b>電気通信工事</b> (metal or optical fibre cable).</p><p><b>Equipment works:</b> 冷凍空調, 給排水衛生, 保温保冷, 消防設備.</p><p class=n>Source: uploaded textbook pp.19-27.</p>`,
s:{jp:`ダムの目的{もくてき}は、治水{ちすい}と利水{りすい}です。`,ro:`Damu no mokuteki wa, chisui to risui desu.`,en:`The purposes of a dam are flood control and water use.`,p:[[`ダムの目的{もくてき}は`,`the purpose of a dam (topic)`],[`治水{ちすい}と利水{りすい}`,`flood control and water use`],[`です`,`is / are`]]},
p:`Teaching example: in heavy rain a dam stores water so the river does not flood (治水); in dry months it supplies water to farms (利水).`,
m:`治 = control, 利 = use. 下部 = lower (foundation), 上部 = upper (deck).`,
u:`Civil work includes dams, rivers, roads, four tunnel types, bridges, ports, railways and waterworks. Lifeline works bring electricity, gas, water and communications.`}
,{c:2,t:`Earthwork, tunnel, marine, well and paving trades (Textbook 3.2.1-3.2.7)`,jp:`土工事{どこうじ}と舗装{ほそう}`,
o:[`Know earthwork steps and terms`,`Know the 4 pavement layers`,`Know the machines for earthwork`],
x:`<p><b>土工事:</b> digging (掘削; blasting 発破; foundation digging 根切り), loading and hauling, banking (盛り土) and cutting (切り土), backfilling (埋め戻し), compaction (締固め), dewatering by pumps, and sprayed mortar or planted mats on slopes (法面).</p><p><b>推進トンネル:</b> factory-made pipes are connected to a digging machine and pushed by jacks from the starting shaft. <b>海洋土木:</b> 浚渫 (remove seabed soil), 埋立 (make land), 岸壁, 防波堤. <b>さく井:</b> wells: water, observation, hot spring, geothermal. <b>ウェルポイント:</b> many pipes driven in and groundwater pumped out by a vacuum pump.</p><p><b>舗装 (4 layers from the bottom):</b> 路床 (bottom, takes all weight) → 路盤 (crushed stone, rolled) → 基層 (asphalt by finisher) → 表層 (durable, non-slip asphalt).</p><p><b>機械土工:</b> hydraulic excavator digs; bulldozer pushes soil (押土); dump truck hauls; wheel loader loads. Operators must complete skill courses and safety education.</p><p class=n>Source: uploaded textbook pp.27-30.</p>`,
s:{jp:`地面{じめん}を掘{ほ}ることを「根切{ねぎ}り」と言{い}います。`,ro:`Jimen wo horu koto wo "negiri" to iimasu.`,en:`Digging the ground is called "negiri".`,p:[[`地面{じめん}を`,`the ground (object)`],[`掘{ほ}ること`,`digging (the act)`],[`「根切{ねぎ}り」と`,`as "negiri"`],[`言{い}います`,`is called`]]},
p:`Teaching example: first 根切り, then foundation work, then 埋め戻し and 締固め.`,
m:`Road layers: Subgrade, Base, Binder, Surface = 路床 路盤 基層 表層.`,
u:`Earthwork digs, hauls, banks, cuts, backfills and compacts. Paving has four layers. Machines: excavator, bulldozer, dump truck, wheel loader.`}
,{c:2,t:`Concrete, rebar joints, welding, painting and landscaping (Textbook 3.2.8-3.2.17)`,jp:`コンクリート・鉄筋継手・塗装{とそう}`,
o:[`Know the 4 rebar joint types`,`Know how concrete is delivered and placed`,`Know the painting methods and landscaping jobs`],
x:`<p><b>杭工事:</b> 既成杭 (factory-made, driven in) and 場所打ち杭 (hole dug on site, rebar cage, fresh concrete).</p><p><b>鉄筋継手 (joining bars):</b> ガス圧接継手 (heat plus pressure), 溶接継手 (arc welding, for thick bars and some precast members), 機械式継手 (threaded bars and a coupler), 重ね継手 (thin bars lapped and united). <b>溶接:</b> 融接 (most common), 圧接, ろう接.</p><p><b>コンクリート圧送:</b> 生コン arrives by truck agitator, moves to a pump truck, and is pumped into the formwork (打設). A <b>vibrator</b> removes air bubbles and spreads the concrete into every corner (締固め).</p><p><b>塗装:</b> はけ塗り (brush), ローラー塗り (roller; large walls), エアスプレー塗装 (spray). <b>造園:</b> 植栽 (planting on the 外構), 屋上緑化, 広場, 公園設備, 緑地育成.</p><p class=n>Source: uploaded textbook pp.31-36.</p>`,
s:{jp:`バイブレータでコンクリートの空気{くうき}を抜{ぬ}きます。`,ro:`Baiburreta de konkuriito no kuuki wo nukimasu.`,en:`We remove air from the concrete with a vibrator.`,p:[[`バイブレータで`,`with a vibrator`],[`コンクリートの空気{くうき}を`,`the air in the concrete (object)`],[`抜{ぬ}きます`,`remove`]]},
p:`Teaching example: concrete is poured, then the vibrator is pushed in quickly and pulled out slowly so no air pockets remain (teaching tip).`,
m:`Joints: Gas, Weld, Mechanical, Lap = G-W-M-L.`,
u:`Piles are factory-made or cast on site. Rebar is joined by gas pressure, welding, couplers or laps. Concrete is pumped and vibrated. Painting uses brush, roller or spray.`}
,{c:2,t:`Finishing trades: roofs, metal, tile, interiors, fittings, waterproofing, stone (Textbook 3.2.18-3.2.29)`,jp:`仕上{しあ}げ工事{こうじ}`,
o:[`Know what each finishing trade does`,`Know interior framing and board terms`,`Know the 5 waterproofing types`],
x:`<p><b>左官:</b> trowel (こて) work with finishing materials. <b>屋根:</b> 瓦 or metal; work includes re-roofing (ふき替え), overlay (重ねぶき), 漆喰 repair, gutter replacement, roof painting. <b>建築板金:</b> thin metal plates are cut, bent and attached: metal roofs, 雨仕舞 fittings, ダクト (smoke, air-conditioning, exhaust), exterior walls, signs.</p><p><b>タイル張り:</b> walls and floors. <b>内装仕上げ:</b> 鋼製下地 (LGS, 軽天) → ボード貼り (plasterboard; joints smoothed with パテ) → クロス貼り or paint; floors (tile, carpet, tatami); curtains. <b>表装工事:</b> interior finishing except steel framing and boards.</p><p><b>建具:</b> doors, windows, fusuma, shoji and frames, installed on site; <b>サッシ工事:</b> metal fittings. <b>吹付けウレタン断熱:</b> sprayed foam makes a gap-free insulation layer.</p><p><b>防水 (5 types):</b> ウレタン (liquid, complex shapes), FRP (glass mat + resin), シート (rubber/resin sheets), アスファルト (asphalt sheets with primer), シーリング (joint gaps). <b>石工事:</b> marble, granite, artificial stone, blocks.</p><p class=n>Source: uploaded textbook pp.36-43.</p>`,
s:{jp:`石膏{せっこう}ボードの上{うえ}にクロスを貼{は}ります。`,ro:`Sekkou boudo no ue ni kurosu wo harimasu.`,en:`We stick cloth on the plasterboard.`,p:[[`石膏{せっこう}ボードの上{うえ}に`,`on top of the plasterboard`],[`クロスを`,`cloth/wall covering (object)`],[`貼{は}ります`,`stick on`]]},
p:`Teaching example: LGS frame, then plasterboard, then putty on the joints, then wall cloth.`,
m:`Interior order: Frame (軽天) → Board → Putty → Cloth.`,
u:`Finishing trades make surfaces and fittings. Interior order is frame, board, putty, cloth. Waterproofing has 5 types by material.`}
,{c:2,t:`Equipment trades, demolition and qualifications (Textbook 3.2.30-3.3)`,jp:`設備工事{せつびこうじ}と資格{しかく}`,
o:[`Know electrical, telecom, piping, air-conditioning and plumbing work`,`Know demolition care points`,`Know the 3 qualification types and the 作業主任者`],
x:`<p><b>電気設備:</b> needs an <b>電気工事士</b> licence (一種 for large buildings and factories, 二種). <b>外線工事</b> (poles, underground, supply to the building) and <b>内線工事</b> (inside: earthing, substations, power, distribution boards 分電盤, lighting, switches, outlets). <b>電気通信:</b> wired or wireless; metal or optical cables; some work needs a 工事担任者 or 電気通信主任技術者.</p><p><b>配管:</b> cutting, joining and assembling pipes accurately (water, oil, gas, steam, fire and air-conditioning pipes). <b>冷凍空調:</b> air-conditioners, freezers and refrigerant piping. <b>給排水衛生:</b> 給水, 排水・通気, 給湯, 衛生器具. <b>保温保冷:</b> insulate ducts and pipes to save energy and prevent burns. <b>築炉:</b> incinerators, cupolas, annealing, deodorising and aluminium melting furnaces. <b>消防設備:</b> extinguishing, alarm and escape equipment.</p><p><b>解体工事:</b> take care of vibration, noise and falling debris in crowded areas; demolition waste (解体ガラ) is sorted into concrete, steel and so on.</p><p><b>Qualifications (労働安全衛生法):</b> 国家資格 (licence), 技能講習 (by registered bodies), 特別教育. A <b>作業主任者</b> must be placed on site to direct workers for designated work.</p><p class=n>Source: uploaded textbook pp.43-47.</p>`,
s:{jp:`作業主任者{さぎょうしゅにんしゃ}が作業員{さぎょういん}を指揮{しき}します。`,ro:`Sagyou shuninsha ga sagyouin wo shiki shimasu.`,en:`The work chief directs the workers.`,p:[[`作業主任者{さぎょうしゅにんしゃ}が`,`the work chief (subject)`],[`作業員{さぎょういん}を`,`the workers (object)`],[`指揮{しき}します`,`directs / commands`]]},
p:`Teaching example: before operating certain machines you need the matching skill course or special education, not only experience.`,
m:`3 qualification types: Licence, Course, Education.`,
u:`Equipment trades cover electricity, telecom, piping, air-conditioning, plumbing, insulation, furnaces and fire equipment. Demolition needs care. Three qualification types exist and a 作業主任者 directs designated work.`}
,{c:3,t:`Site terms 2: earth, concrete, condition and length terms (Textbook 4.2.3-4.2.9)`,jp:`現場{げんば}の用語{ようご}(2)`,
o:[`Know earth and shoring terms`,`Understand fit, flush and tolerance terms`,`Know 一間, 一坪 and the structure abbreviations`],
x:`<p><b>Earth:</b> 締固め (密実 = dense), 転圧 (rolling), 埋め戻し, 突き固め (rammer), 根切り, 土留め (retaining; wall-type = 擁壁), 打つ = 打設 (pour concrete), 段跳ね (step-throwing soil out, 排土), 法面, <b>山留め</b> (sheet piles 矢板, 鋼矢板; オープンカット), 水替え (pump out water; 釜場 = the pump pit).</p><p><b>Concrete:</b> 打ち込み, 締固め (vibrator or hammer), タンピング, 練り混ぜ, 配合.</p><p><b>Condition words:</b> 納まり, 取合い, 通り (straightness), 面一 (flush), 反り (concave) and 起り (convex), 逃げ (allowance), ベタ, ふかし, <b>手戻り</b> (redo), <b>段取り</b> (planning), 手直し (partial correction), 駄目 (leftover items; 駄目直し).</p><p><b>Length:</b> ピッチ (spacing), 追う (measure from a reference), 寸法, 一間 (about 1.8 m = 1818 mm), 一坪 (1 ken x 1 ken). <b>Structures:</b> RC造, S造, SRC造, 木造.</p><p class=n>Source: uploaded textbook pp.52, 55-57.</p>`,
s:{jp:`段取{だんど}りが悪{わる}いと、手戻{てもど}りが出{で}ます。`,ro:`Dandori ga warui to, temodori ga demasu.`,en:`If the planning is poor, redoing work appears.`,p:[[`段取{だんど}りが悪{わる}いと`,`if planning is bad (と = if/when)`],[`手戻{てもど}りが`,`redoing work (subject)`],[`出{で}ます`,`comes out / occurs`]]},
p:`Teaching example: if you drill before the marking is checked, you may need 手直し; good 段取り prevents 手戻り.`,
m:`反り = sori (concave, like a smile), 起り = mukuri (convex).`,
u:`Learn earth-retaining terms, condition words (納まり, 面一, 手戻り, 段取り) and length units (一間 = about 1.8 m).`}
,{c:3,t:`Site terms 3: electrical and equipment words (Textbook 4.2.10-4.2.11)`,jp:`電気{でんき}・設備{せつび}の用語{ようご}`,
o:[`Know wiring and insulation terms`,`Know shock, leakage and earthing words`,`Know air-conditioning and plumbing test words`],
x:`<p><b>Electrical/telecom:</b> 接続 (結線 for communication lines), 配線, 離隔 (separation distance), 絶縁, 管路, 埋設, 架空配線, 配管する, 通線, MDF, <b>感電</b> (current through the body), <b>漏電</b> (leakage), <b>接地・アース</b> (protective earthing provides a fault-current path so protective devices can operate), 避雷針, 避雷器, 短絡 (ショート), 圧着, 被覆, 通電, あたる (check with a detector), かしめる, 振る (change route), ブレーカーが飛ぶ.</p><p><b>Equipment:</b> 空調, 温度 (°C), 湿度 (%), 換気, 排煙, 衛生, バリ (burr; バリ取り), ライニング / コーティング, 漏水, 水圧試験 (supply pipes), 満水試験 (drain pipes), 勾配.</p><p class=n>Source: uploaded textbook pp.57-59.</p>`,
s:{jp:`漏電{ろうでん}すると、感電{かんでん}の危険{きけん}があります。`,ro:`Rouden suru to, kanden no kiken ga arimasu.`,en:`If current leaks, there is a danger of electric shock.`,p:[[`漏電{ろうでん}すると`,`if electricity leaks`],[`感電{かんでん}の危険{きけん}`,`danger of electric shock`],[`があります`,`there is`]]},
p:`Teaching example: before touching wires, check with a voltage detector (あたる) to see whether they are live (通電).`,
m:`漏 = leak (water radical). 漏電 = leaking electricity; 漏水 = leaking water.`,
u:`Know electrical safety words (感電, 漏電, 接地, 絶縁), crimping and checking words, and the pipe tests (水圧 and 満水).`}

,{c:0,t:`Chapter 1 supplement: CCUS assessment, safety communication and the full morning routine (Textbook 1.3-1.5)`,jp:`CCUS・安全確認・朝礼の復習`,o:[`State the three CCUS assessment areas and explain the four skill levels without inventing promotion rules`,`Understand that the textbook says Level 2 requires at least 645 workdays after registration`,`Practise the safety communication sequence in a morning meeting`],x:`<h3>1. CCUS: what is evaluated?</h3><p>The Construction Career Up System (建設キャリアアップシステム, CCUS) records each skilled worker's work history and qualifications. The textbook identifies <b>three assessment areas</b>:</p><ol><li><b>経験（けいけん）</b> — work experience, measured by days worked (就業日数)</li><li><b>知識・技能（ちしき・ぎのう）</b> — knowledge and skills, including qualifications held (保有資格)</li><li><b>マネジメント能力</b> — management ability, including registered core-skill-worker training and foreman experience (職長経験)</li></ol><p>CCUS has four skill levels and issues a card showing the worker's level. The textbook figure identifies them as: <b>Level 1 — white</b> (初級技能者 / beginner or trainee); <b>Level 2 — blue</b> (中堅技能者 / independent, fully skilled worker); <b>Level 3 — silver</b> (a skilled worker able to work as a foreman); and <b>Level 4 — gold</b> (a skilled worker with advanced management ability, such as a registered core-skill worker). The textbook states that Level 2 requires at least <b>645 workdays (about 3 years) after registration</b>; new entrants therefore start at Level 1. Do not assume that one qualification alone automatically changes your level: the assessment uses the stated areas.</p><h3>2. Why greetings matter</h3><p>Greetings are not just politeness. The textbook connects greetings with preventing accidents, building unity between different trades and helping everyone work comfortably. Use the greeting appropriate to the situation: おはようございます (good morning), おつかれさまです (thank you for your work / good work), and ご安全に (stay safe).</p><h3>3. Morning meeting and safety checks</h3><p>Before work starts, workers gather for 朝礼. The textbook describes two kinds: <b>全体朝礼</b> (whole-site meeting) and <b>職種ごとの朝礼</b> (trade-specific meeting). The whole-site meeting commonly follows this sequence: (1) site supervisor's greeting; (2) radio taiso / warm-up exercise; (3) each foreman explains that day's work and staffing, so other trades know what will happen; (4) whole-site KY activity; (5) safety checks, often in pairs; (6) everyone says ご安全に and starts work. New entrants (新規入場者) may be introduced; say your name and company clearly and loudly. Follow the site leader's instructions and listen for the day's work locations, work sequence, hazards, safety measures and coordination with other trades. Confirm what applies to <b>your own task</b>; do not treat the meeting as background noise. If you do not understand an instruction, ask before starting.</p><p><b>KY活動</b> means 危険予知活動 (hazard prediction activity). In the trade-specific meeting, the textbook describes a simple sequence: <b>危険の発見</b> (identify possible hazards) → <b>対策の検討</b> (discuss preventive measures) → <b>行動目標の決定</b> (choose the key action goal) → <b>かけ声</b> (point, call and repeat the goal together). A common safety chant is 「ゼロ災で行こう、ヨシ！」. Example: “A worker may fall while working at height; inspect the scaffold, use the required fall-protection equipment and keep the work area clear.” This example illustrates the method; always follow the actual site rules.</p><h3>4. Simple site dialogue</h3><p>職長: 今日の作業は何ですか。 (What is today's work?)<br>技能者: 型枠を組み立てます。 (We will assemble formwork.)<br>職長: 危険なところはありますか。 (Are there any hazards?)<br>技能者: 足元に注意します。 (We will watch our footing.)</p><p class=n>Textbook basis: Chapter 1, sections 1.3-1.5. The sample dialogue and hazard example are teaching examples.</p>`,s:{jp:`安全{あんぜん}を確認{かくにん}してから作業{さぎょう}を始{はじ}めます。`,ro:`Anzen wo kakunin shite kara sagyou wo hajimemasu.`,en:`We start work after confirming safety.`,p:[[`安全{あんぜん}を`,`safety (object)`],[`確認{かくにん}してから`,`after confirming`],[`作業{さぎょう}を始{はじ}めます`,`begin work`]]},p:`Remember the three CCUS assessment areas as E-K-M: Experience, Knowledge/Skills, Management ability. Then practise saying one hazard and one preventive action for each task.`,m:`経験 = days worked; 知識・技能 = qualifications/skills; マネジメント能力 = registered training and foreman experience.`,u:`You should be able to name all three CCUS assessment areas, explain why greetings matter, and describe the purpose of 朝礼 and KY活動.`}
,{c:1,t:`Chapter 2 supplement: employment conditions, wage rules, leave, insurance and legal distinctions (Textbook 2.1-2.17)`,jp:`労働条件と関係法令`,o:[`Check the six items that must be stated in working conditions`,`Recall wage payment principles, standard hours, breaks, weekly rest and paid leave conditions from the textbook`,`Distinguish the main purpose of the construction, building, waste, recycling and environment laws`],x:`<h3>1. Working conditions: check the written terms</h3><p>The Labour Standards Act (労働基準法) sets minimum working conditions. The textbook lists six items that must be made clear: (1) contract period; (2) renewal criteria for a fixed-term contract; (3) workplace and job duties; (4) start/end time, overtime, breaks, holidays and leave; (5) wage calculation, payment method, closing date, payday and raises; (6) resignation and dismissal matters. Before accepting a job, compare the written terms with what the recruiter promised.</p><h3>2. Wage payment: five principles</h3><ol><li>通貨払い — paid in currency (money)</li><li>直接払い — paid directly to the worker</li><li>全額払い — paid in full</li><li>毎月1回以上 — at least once each month</li><li>一定期日払い — on a fixed, predetermined date</li></ol><p>The textbook gives the general statutory working-time standard as <b>8 hours per day and 40 hours per week</b>. It also states: when work exceeds 6 hours, at least 45 minutes' break; when it exceeds 8 hours, at least 1 hour. At least one day off per week is required. Overtime and holiday work have additional rules and premium-pay requirements; the textbook's stated general overtime limits are 45 hours per month and 360 hours per year, subject to statutory exceptions and special rules. This is study material, not individual legal advice.</p><h3>3. Annual paid leave</h3><p>The textbook states the initial entitlement as 10 working days after 6 months of continuous service when attendance is at least 80% of scheduled working days. Additional days accrue with continued service, up to 20 days. Check the current law and your employment record for your own entitlement.</p><h3>4. Employment and safety insurance</h3><p><b>労災保険</b> (workers' accident compensation insurance) concerns work-related injury/illness and related compensation. <b>雇用保険</b> (employment insurance) supports eligible workers in employment-related circumstances such as unemployment and certain leave/training situations. The employer's and worker's eligibility/coverage details depend on the applicable rules; do not assume that being a foreign worker removes legal protections.</p><h3>5. What the other laws broadly regulate</h3><ul><li><b>建設業法</b> — rules for the construction business, including proper contracting and construction-business administration.</li><li><b>建築基準法</b> — building safety and standards. The textbook distinguishes <b>単体規定</b> (requirements for an individual building) and <b>集団規定</b> (requirements relating to groups of buildings/urban conditions such as site and area controls).</li><li><b>廃棄物処理法</b> — proper handling and disposal of waste. Construction waste must be classified and managed appropriately; manifest (マニフェスト) records are used to track regulated industrial waste from generation through disposal.</li><li><b>建設リサイクル法</b> — recycling and separation of specified construction materials in covered projects.</li><li><b>大気汚染防止法・騒音規制法・振動規制法・水質汚濁防止法</b> — controls related to air pollution, noise, vibration and water pollution.</li><li><b>消防法</b> — fire prevention, fire equipment and related fire-safety requirements.</li><li><b>水道法・下水道法・ガス事業法・電気事業法・電気通信事業法・電波法・航空法・駐車場法</b> — regulate the respective utilities, communications/radio, aviation and parking fields.</li></ul><p>Do not confuse the purpose of each law. For exam revision, learn the Japanese name, the regulated subject and one practical example.</p><p class=n>Textbook basis: Chapter 2, sections 2.1-2.17. The summaries above are learning aids; confirm current legal provisions from official sources before making employment or compliance decisions.</p>`,s:{jp:`労働条件{ろうどうじょうけん}を契約書{けいやくしょ}で確認{かくにん}します。`,ro:`Roudou jouken wo keiyakusho de kakunin shimasu.`,en:`I check the working conditions in the contract.`,p:[[`労働条件{ろうどうじょうけん}を`,`working conditions (object)`],[`契約書{けいやくしょ}で`,`in the contract document`],[`確認{かくにん}します`,`check/confirm`]]},p:`Before signing: check contract dates, duties, workplace, hours, overtime, breaks, holidays, pay date, pay method and dismissal/resignation terms.`,m:`Five wage principles: currency, direct, full amount, at least monthly, fixed date.`,u:`Be able to explain the purpose of each major law group and recall the working-time, break, rest-day and initial paid-leave rules stated in the textbook.`}
,{c:2,t:`Chapter 3 supplement: all 38 specialist construction trades at a glance (Textbook 3.2)`,jp:`38の専門工事を整理する`,o:[`Recognise all 38 specialist trade names in the textbook`,`Group trades by earth/civil, structure, finishing, equipment and demolition work`,`Match each trade to its main task without confusing similar trades`],x:`<p>Chapter 3 lists 38 specialist trades. The descriptions below are short recognition cues; actual work scope can overlap and is determined by the contract, drawings, specifications and site instructions.</p><h3>Earth, civil and ground works</h3><ol><li><b>土工事</b> — excavation, filling, soil movement and compaction.</li><li><b>推進トンネル工事</b> — trenchless pipe/tunnel installation by jacking or pipe propulsion.</li><li><b>海洋土木工事</b> — marine/costal civil engineering such as ports and offshore structures.</li><li><b>さく井工事</b> — drilling wells/bores.</li><li><b>ウェルポイント工事</b> — groundwater lowering/dewatering around excavations.</li><li><b>舗装工事</b> — road and surface paving.</li><li><b>機械土工事</b> — earthmoving using construction machinery.</li><li><b>杭工事</b> — pile installation for foundations.</li></ol><h3>Structure and frame</h3><ol start="9"><li><b>とび工事</b> — temporary works, scaffolding, lifting/erection and work at height.</li><li><b>鉄骨工事</b> — erection and assembly of structural steel.</li><li><b>鉄筋工事</b> — placing and assembling reinforcing bars.</li><li><b>鉄筋継手工事</b> — joining reinforcing bars.</li><li><b>溶接工事</b> — welding metal components.</li><li><b>型枠工事</b> — making and installing forms to shape concrete.</li><li><b>コンクリート圧送工事</b> — pumping concrete to the placement point.</li></ol><h3>Exterior, interior and finishing</h3><ol start="16"><li><b>塗装工事</b> — applying paint/coatings.</li><li><b>造園工事</b> — landscaping and planting.</li><li><b>左官工事</b> — plastering/rendering and smoothing surfaces.</li><li><b>建築大工工事</b> — carpentry and timber construction.</li><li><b>屋根工事</b> — roof construction/coverings.</li><li><b>建築板金工事</b> — sheet-metal work on buildings.</li><li><b>タイル張り工事</b> — fixing tiles.</li><li><b>内装仕上げ工事</b> — interior finishing.</li><li><b>表装工事</b> — wall/fabric/paper covering and related finishing.</li><li><b>建具工事</b> — doors, windows and other building fittings.</li><li><b>サッシ工事</b> — installing sash/window frames.</li><li><b>吹付けウレタン断熱工事</b> — spray-applied urethane insulation.</li><li><b>防水工事</b> — waterproofing.</li><li><b>石工事</b> — stone installation/work.</li></ol><h3>Building services and specialist plant</h3><ol start="30"><li><b>電気設備工事</b> — electrical power and building electrical equipment.</li><li><b>電気通信工事</b> — telecommunications and communication cabling/equipment.</li><li><b>配管工事</b> — piping installation.</li><li><b>冷凍空気調和機器工事</b> — refrigeration and air-conditioning equipment.</li><li><b>給排水衛生設備工事</b> — water supply, drainage and sanitary equipment.</li><li><b>保温保冷工事</b> — thermal insulation and cold insulation for pipes/equipment.</li><li><b>築炉工事</b> — industrial furnace/kiln construction and lining.</li><li><b>消防設備工事</b> — fire-protection equipment installation.</li><li><b>解体工事</b> — demolition.</li></ol><p><b>How to avoid mixing them up:</b> 鉄筋工事 places the bars; 鉄筋継手工事 joins bars; 型枠工事 makes the mould; コンクリート圧送工事 pumps concrete; 左官工事 finishes/plasters surfaces. 電気設備 is not the same as 電気通信; 給排水衛生 is not the same as air-conditioning.</p><p class=n>Textbook basis: Chapter 3, section 3.2. The list follows the 38 headings in the uploaded textbook; the English cues are simplified study explanations.</p>`,s:{jp:`専門工事業者{せんもんこうじぎょうしゃ}は、それぞれの専門{せんもん}の仕事{しごと}をします。`,ro:`Senmon kouji gyousha wa, sorezore no senmon no shigoto wo shimasu.`,en:`Each specialist contractor performs its own specialist work.`,p:[[`専門工事業者{せんもんこうじぎょうしゃ}は`,`specialist contractors (topic)`],[`それぞれの専門{せんもん}の`,`each one's specialist`],[`仕事{しごと}をします`,`does the work`]]},p:`Revise in groups of five trades. For each, say: what material/system it works on, what action it performs, and which similar trade it is easy to confuse with.`,m:`鉄筋 = reinforcement bars; 型枠 = mould/form; 圧送 = pumping; 配管 = piping; 解体 = demolition.`,u:`You should recognise all 38 specialist trade names and distinguish the commonly confused pairs.`}
,{c:3,t:`Chapter 4 supplement: setting-out, scaffolds, reinforcement, concrete and site vocabulary (Textbook 4.2)`,jp:`墨出し・足場・鉄筋・コンクリート用語`,o:[`Explain the difference between 墨出し, 親墨 and 墨付け`,`Identify the three common scaffold types named in the textbook`,`Understand quantity take-off, clearance, anchorage, spacers and concrete placement terms`],x:`<h3>1. Setting-out and marking</h3><p><b>墨出し</b> is marking the reference lines needed for construction on the ground or a surface. <b>基準墨</b> is a reference line used to set out the building. <b>通り芯</b> is a centre/grid line; <b>壁芯</b> and <b>柱芯</b> are the centre lines of walls and columns. <b>親墨</b> is a line such as a grid/reference line that becomes the basis for later setting-out. <b>墨付け</b> is different: it marks timber members to show where they are to be processed.</p><h3>2. 遣り方 (temporary setting-out framework)</h3><p>遣り方 is a temporary framework used to show building position, reference lines, right angles and level/height. It uses stakes (杭), horizontal boards (水貫) and string lines (水糸). In civil engineering, 丁張り is also used for this kind of setting-out reference.</p><h3>3. Earthwork terms</h3><ul><li><b>根切り</b> — excavating down to the required foundation bottom level. It is a specific excavation operation; 掘削 is the broader word for excavation.</li><li><b>盛り土</b> — placing soil to raise/level ground; <b>段切り</b> — cutting steps into a slope before fill so it does not slide.</li><li><b>締固め</b> — increasing soil/material density by reducing gaps; <b>転圧</b> — compacting by rolling/pressing machinery.</li><li><b>埋め戻し</b> — putting soil back after underground work; <b>突き固め</b> — compacting that backfill with a rammer/plate.</li><li><b>土留め</b> — retaining soil to prevent collapse; <b>擁壁</b> — a wall-shaped retaining structure.</li><li><b>山留め</b> — supporting the ground around an excavation. Where space permits, an open-cut sloped excavation may be used; where space is limited, retaining walls and supports are installed. The textbook names sheet piles (矢板) and steel sheet piles (鋼矢板).</li></ul><h3>4. Foundation and concrete preparation</h3><p><b>地業</b> is the work/material layer below the foundation slab that supports it. It may include sand, gravel, broken stone, lean/blinding concrete or piles. <b>捨てコンクリート</b> provides a clean, level working surface for layout and subsequent foundation work. Its thickness is determined by the drawings/specification and site requirements; do not memorise a universal thickness. <b>基礎</b> transfers building loads to the ground. Direct foundations transfer load directly to the ground; pile foundations use piles to reach/support on stronger ground.</p><h3>5. Scaffolds and temporary works</h3><p>The textbook names three common scaffold types: <b>枠組み足場</b> (frame scaffold), <b>単管足場</b> (single-pipe scaffold) and <b>くさび緊結式足場</b> (wedge-lock scaffold). A <b>作業床</b> is the platform workers stand on. Scaffold type and components must be selected, erected, inspected and used according to the design, site rules and applicable safety requirements; never improvise or alter a scaffold yourself.</p><h3>6. Reinforcement, formwork and concrete</h3><p><b>配筋</b> means arranging and assembling reinforcing bars. <b>拾い出し</b> means calculating required materials, quantities and labour from drawings/specifications. <b>あそび</b> means allowance/clearance (the precise meaning depends on the detail); <b>あき</b> is the distance/clear gap between reinforcing bars. <b>定着</b> is anchorage/development of reinforcement; <b>スペーサー</b> helps keep reinforcement in its specified position and cover. <b>打つ／打設する</b> means placing/pouring concrete in construction language, not hitting it.</p><h3>7. Electrical and equipment safety</h3><p><b>感電</b> is electric shock; <b>漏電</b> is electrical leakage; <b>接地・アース</b> is protective earthing that provides a fault-current path so protective devices can operate and exposed conductive parts are less likely to remain dangerously live. It does not make unsafe contact safe. <b>絶縁</b> is insulation. <b>短絡</b> is a short circuit. For pipes, the textbook distinguishes <b>水圧試験</b> (pressure test for water-supply piping) and <b>満水試験</b> (full-water test for drainage piping).</p><p class=n>Textbook basis: Chapter 4, sections 4.2.1-4.2.11. Safety explanations are simplified; always follow site training and instructions.</p>`,s:{jp:`図面{ずめん}から必要{ひつよう}な材料{ざいりょう}を拾{ひろ}い出{だ}します。`,ro:`Zumen kara hitsuyou na zairyou wo hiroi dashimasu.`,en:`We calculate the required materials from the drawings.`,p:[[`図面{ずめん}から`,`from the drawings`],[`必要{ひつよう}な材料{ざいりょう}を`,`the necessary materials`],[`拾{ひろ}い出{だ}します`,`extract/list/calculate`]]},p:`When reading a term, ask: is it a reference line, a temporary structure, an earthwork operation, a foundation element, a rebar detail or a test? This prevents memorising words without understanding their job.`,m:`墨出し = lines on site; 墨付け = marks on timber. 根切り is a specific foundation excavation. 山留め supports soil; 擁壁 is a retaining wall.`,u:`You should distinguish the key setting-out terms, three scaffold types, earthwork operations, foundation layers and reinforcement/concrete vocabulary.`}
,{c:4,t:`Chapter 5: tools, machines and measuring instruments (Textbook 5.1-5.3)`,jp:`工具{こうぐ}・機械{きかい}・計測器{けいそくき}`,o:[`Name key machines, scaffolds, rebar and formwork tools`,`Match common hand/power tools to their job`,`Know the measuring tools for level, vertical and marking`],x:`<p>Chapter 5 teaches the tools of each trade. <b>Machines:</b> the ラフタークレーン (wheeled, for rough ground) and クローラクレーン (tracks, for heavy lifts). <b>とび:</b> scaffold parts include 筋交 (diagonal brace), 足場板 and 番線 (tie wire).</p><p><b>Rebar:</b> 結束線 ties bars, a 鉄筋カッター cuts them. <b>Formwork:</b> フォームタイ and セパレーター hold the panels, パイプサポート props the floor forms. <b>Concrete:</b> コンクリートポンプ pumps through 輸送管; the スランプコーン tests softness.</p><p><b>Common tools (5.3):</b> power tools (インパクトドライバー, ディスクグラインダー, 丸のこ); marking (墨つぼ, レーザー墨出し器); measuring (レベル, 水平器, 下げ振り, メジャー); lifting (チェーンブロック, ウインチ, ワイヤーロープ); working at height (脚立, 可搬式作業台, 高所作業車).</p><p><b>Safety:</b> never wear gloves with a rotating blade such as 丸のこ. Never stand on top of a 脚立.</p>`,s:{jp:`丸のこを使{つか}う時{とき}は、手袋{てぶくろ}をしてはいけません。`,ro:`Maru noko wo tsukau toki wa, tebukuro wo shite wa ikemasen.`,en:`When using a circular saw, you must not wear gloves.`,p:[[`丸のこを使う時は`,`when using a circular saw`],[`手袋をして`,`wearing gloves`],[`はいけません`,`must not (prohibition)`]]},p:`Teaching example: before cutting timber, check the board is fixed firmly (kickback risk) and remove gloves.`,m:`Tools by job: mark (墨つぼ) → measure (水平器) → cut (丸のこ) → fix (インパクト).`,u:`Learn tools by job: mark, measure, cut, fix, lift. No gloves near rotating blades.`},{c:5,t:`Chapter 6: how construction works - plans, QCDSE and preparation (Textbook 6.1-6.2)`,jp:`施工{せこう}に関{かん}する知識{ちしき}`,o:[`Explain the 5 features of construction work`,`Remember the 5M and QCDSE`,`List what to check before starting work`],x:`<p><b>5 features:</b> (1) 受注一品生産: each building is designed once, to order; (2) tied to the land; (3) affected by nature (weather, season); (4) bound by society (safety and environment around the site, local laws); (5) quality is built through the <b>safe working process</b>.</p><p><b>施工計画</b> is the plan based on the contract, drawings and specifications. Aim: good quality, lowest cost, within 工期, with 無事故無災害 and environmental care. <b>5M:</b> Men, Materials, Methods, Machinery, Money. <b>施工管理 = QCDSE:</b> Quality, Cost, Delivery (schedule), Safety, Environment.</p><p><b>Before work:</b> understand contract, drawings, site rules, neighbouring trades, work order, people and equipment; carry your career-up card and licences; do the <b>始業前点検</b> (accidents often happen with tools). <b>墨出し</b> marks positions and heights and is the most important precision task (墨つぼ or laser).</p><p><b>Scaffolds:</b> all types (単管, 枠組み, くさび緊結式) need a firm base, vertical and level assembly, 筋交 braces, and 壁つなぎ to the building.</p>`,s:{jp:`品質{ひんしつ}は安全{あんぜん}な工程{こうてい}でつくります。`,ro:`Hinshitsu wa anzen na koutei de tsukurimasu.`,en:`Quality is built through a safe process.`,p:[[`品質は`,`quality (topic)`],[`安全な工程で`,`through a safe process`],[`つくります`,`build / make`]]},p:`Teaching example: at 8:00 you check drawings, who works beside you today, your tools, and carry your CCUS card.`,m:`5M = Men, Materials, Methods, Machinery, Money. QCDSE = Quality, Cost, Delivery, Safety, Environment.`,u:`Five features, 5M, QCDSE, and the pre-work checklist. 墨出し is the most precise task.`},{c:6,t:`Chapter 7 (1): fatal accidents - types and prevention (Textbook 7.1)`,jp:`死亡災害{しぼうさいがい}`,o:[`Name the three major accident types`,`Describe the 12 accident types in simple words`,`Know the key prevention rules for falls, collapse, machines and falling objects`],x:`<p>The <b>三大災害</b> are <b>墜落・転落</b>, <b>建設機械・クレーン災害</b> and <b>崩壊・倒壊</b>; they make 4-7 of every 10 accidents. In FY2021 (令和3年) construction had 288 deaths; the most common is falls (墜落).</p><p><b>Types:</b> 墜落・転落 (fall from height), 転倒 (trip), 激突 (hit something), 飛来・落下 (flying or falling objects), 崩壊・倒壊 (collapse), 激突され (hit by mac
